<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="eye">
      <!-- [f] bidik varian C: dashed ring + dot; on target the ring widens and the dot becomes the Forb mouse -->
      <div id="eyeSvg">
        <svg class="ret" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
          <g class="ring">
            <circle cx="20" cy="20" r="12" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="4.6" stroke-dasharray="8.6 3.97" stroke-dashoffset="2" />
            <circle cx="20" cy="20" r="12" fill="none" stroke="#fff" stroke-width="2.4" stroke-dasharray="8.6 3.97" stroke-dashoffset="2" />
          </g>
          <g class="dot">
            <circle cx="20" cy="20" r="2.9" fill="rgba(0,0,0,.55)" />
            <circle cx="20" cy="20" r="1.9" fill="#fff" />
          </g>
        </svg>
        <svg class="mouse" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 60">
          <rect x="4" y="4" width="32" height="52" rx="16" fill="#ffffff" />
          <path d="M 20 4 L 20 24 L 4 24 L 4 20 C 4 11 11 4 20 4 Z" fill="#555555" />
          <line x1="4" y1="24" x2="36" y2="24" stroke="#181818" stroke-width="2" />
          <line x1="20" y1="4" x2="20" y2="24" stroke="#181818" stroke-width="2" />
          <rect x="18" y="10" width="4" height="10" rx="2" fill="#181818" />
        </svg>
      </div>
    </div>
    <div id="options-wrapper"></div>
    <script defer type="module" src="js/main.js"></script>
  </body>
</html>
