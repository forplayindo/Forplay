<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }
	html, body { width: 512px; height: 300px; overflow: hidden; background: transparent; }
	body { font-family: 'Segoe UI', Arial, sans-serif; color: #c8fbff; }

	.panel {
		position: absolute; inset: 10px;
		border: 2px solid rgba(80, 230, 255, 0.85);
		border-radius: 14px;
		background:
			repeating-linear-gradient(0deg, rgba(120, 240, 255, 0.07) 0 2px, transparent 2px 5px),
			linear-gradient(160deg, rgba(10, 60, 80, 0.78), rgba(5, 25, 40, 0.86));
		padding: 18px 26px;
		display: flex; flex-direction: column; gap: 10px;
	}

	.head { display: flex; justify-content: space-between; align-items: center;
		font-size: 17px; letter-spacing: 3px; color: rgba(140, 240, 255, 0.75); font-weight: 600; }
	.status { color: #ffd84a; letter-spacing: 2px; }
	.status.done { color: #6dff9e; }
	.status.warn { color: #ff6b6b; }

	.row { display: flex; justify-content: space-between; align-items: baseline; }
	.label { font-size: 22px; letter-spacing: 2px; color: rgba(160, 235, 245, 0.8); }
	.value { font-size: 40px; font-weight: 700; color: #ffffff; font-variant-numeric: tabular-nums; }
	.value.money { color: #7dffb0; }

	.bar { position: relative; height: 26px; border-radius: 13px; margin-top: 4px;
		background: rgba(80, 230, 255, 0.15); border: 1px solid rgba(80, 230, 255, 0.55); overflow: hidden; }
	.fill { position: absolute; inset: 0 auto 0 0; width: 0%;
		background: linear-gradient(90deg, #1fb8ff, #4ff3ff); transition: width 0.25s linear; }
	.pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
		font-size: 17px; font-weight: 700; color: #ffffff; }
</style>
</head>
<body>
	<div class="panel">
		<div class="head"><span id="title">SPBU</span><span class="status" id="status">MENGISI</span></div>
		<div class="row"><span class="label" id="label">BENSIN</span><span class="value" id="liters">0,0 L</span></div>
		<div class="row"><span class="label">TOTAL</span><span class="value money" id="total">Rp 0</span></div>
		<div class="bar"><div class="fill" id="fill"></div><div class="pct" id="pct">0%</div></div>
	</div>

<script>
	const $ = (id) => document.getElementById(id);

	window.addEventListener('message', (event) => {
		let d = event.data;
		if (typeof d === 'string') { try { d = JSON.parse(d); } catch { return; } }
		if (!d) return;

		if (d.title) $('title').textContent = d.title;
		if (d.label) $('label').textContent = d.label;
		$('liters').textContent = Number(d.liters || 0).toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' ' + (d.unit || 'L');
		$('total').textContent = 'Rp ' + Math.round(d.total || 0).toLocaleString('id-ID');

		const pct = Math.max(0, Math.min(100, d.percent || 0));
		$('fill').style.width = pct + '%';
		$('pct').textContent = Math.floor(pct) + '%';

		const status = $('status');
		status.textContent = d.status || '';
		status.className = 'status' + (d.state === 'done' ? ' done' : d.state === 'warn' ? ' warn' : '');
	});
</script>
</body>
</html>
