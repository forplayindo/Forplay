    </svg>

    <!-- panel staff -->
    <div class="panel split adm hidden" id="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="logo"><svg class="ic"><use href="#i-shield"/></svg></div>
                <div><h1>Admin</h1><small>Foreplay Indonesia</small></div>
            </div>
            <nav class="nav" id="nav"></nav>
            <div class="side-foot">
                <div class="av" id="meAv"></div>
                <div><b id="meName"></b><span class="role" id="meRole"></span></div>
            </div>
        </aside>
        <section class="detail">
            <div class="detail-h">
                <div><div class="lt" id="pgTitle"></div><small id="pgSub"></small></div>
                <div class="head-actions"><button class="icon-btn close" data-close title="Tutup (ESC)"><svg class="ic"><use href="#i-x"/></svg></button></div>
            </div>
            <div class="body" id="page"></div>
        </section>
        <div id="modal"></div>
        <div class="toast hidden" id="toast"></div>
    </div>

    <!-- form laporan warga -->
    <div class="panel lapor hidden" id="lapor">
        <header>
            <div class="brand">
                <div class="logo"><svg class="ic"><use href="#i-flag"/></svg></div>
                <div><h1>Lapor ke Staff</h1><small id="lStaff">Memuat…</small></div>
            </div>
            <div class="head-actions"><button class="icon-btn close" data-lclose title="Tutup (ESC)"><svg class="ic"><use href="#i-x"/></svg></button></div>
        </header>
        <div class="seg" id="lTabs"><button data-t="new" class="active">Buat Laporan</button><button data-t="mine">Laporan Saya <span class="bubble hidden" id="lUnread"></span></button></div>
        <div class="pg" id="lPg"></div>
        <div class="toast hidden" id="lToast"></div>
    </div>

    <script src="app.js"></script>
    <script src="lapor.js"></script>
</body>
</html>
