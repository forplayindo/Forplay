<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Periksa Kendaraan (mockup)</title>
<style>
/* Mockup NUI "Periksa Kendaraan" - tema gelap, gambar kendaraan asli (docs.fivem.net / gambar lokal) + garis penunjuk */
:root {
    --bg: #0b1118; --panel: #0f1720; --card: #15202c; --card2: #1b2938; --line: #233447; --line2: #2e445c;
    --text: #e6eef7; --muted: #8ca0b6; --accent: #2dd4bf; --accent-dark: #14b8a6; --accent-ink: #062521;
    --c0: #22c55e; --c1: #eab308; --c2: #f97316; --c3: #ef4444; --tyre: #64748b;
    --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    min-height: 100vh; font-family: 'Segoe UI', Roboto, Arial, sans-serif; color: var(--text); font-size: 13px; line-height: 1.35;
    background: radial-gradient(ellipse at 30% 20%, #3b4652 0%, #232b34 55%, #151a20 100%); user-select: none;
}
button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; outline: none; }
small { color: var(--muted); font-size: 11px; }

/* bar demo (tidak ada di game) */
.demo { position: fixed; top: 10px; left: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; background: rgba(15,23,32,.92); border: 1px solid var(--line); padding: 7px 9px; border-radius: 10px; font-size: 12px; z-index: 99; max-width: calc(100vw - 20px); }
.demo button { background: var(--card2); padding: 5px 9px; border-radius: 7px; }
.demo button:hover { background: var(--line2); }
.demo button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.demo .sep { width: 6px; }

.panel {
    position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%);
    width: min(1180px, 97vw); height: min(690px, 90vh);
    background: linear-gradient(180deg, #111b26 0%, var(--panel) 40%); border: 1px solid var(--line); border-radius: 18px;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.55);
}
header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.brand { display: flex; gap: 12px; align-items: center; }
.logo { font-size: 20px; width: 40px; height: 40px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.kicker { font-size: 10px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
h1 { font-size: 20px; font-weight: 700; letter-spacing: .01em; }
h3 { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
.icon-btn { width: 36px; height: 36px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; }
.icon-btn:hover { background: #3a1f24; border-color: #5a2a31; }
.state-pill { font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 999px; border: 1px solid; letter-spacing: .02em; }
.state-pill.lift { background: rgba(45,212,191,.1); color: var(--accent); border-color: rgba(45,212,191,.35); }
.state-pill.road { background: rgba(249,115,22,.1); color: #fdba74; border-color: rgba(249,115,22,.35); }

.main { flex: 1; display: grid; grid-template-columns: 1fr 410px; min-height: 0; }

/* kiri: cairan + panggung kendaraan */
.left { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
.fluids { display: flex; gap: 10px; padding: 14px 18px 0; }
.fluid { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
.fluid:hover { border-color: var(--line2); }
.tube { width: 12px; height: 38px; border-radius: 6px; background: #0b1219; border: 1px solid var(--line2); position: relative; overflow: hidden; flex-shrink: 0; }
.tube div { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 0 0 5px 5px; }
.fluid b { display: block; font-size: 15px; }
.fluid small { display: block; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }

.stage { flex: 1; position: relative; min-height: 0; margin: 6px 0 0; }
.stage::before { content: ''; position: absolute; inset: 10% 22%; background: radial-gradient(ellipse at center, rgba(45,212,191,.08), transparent 70%); pointer-events: none; }
.carbox { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 54%; display: flex; align-items: center; justify-content: center; }
.carbox img { width: 100%; height: auto; display: block; filter: drop-shadow(0 18px 18px rgba(0,0,0,.55)); }
.carbox svg { width: 100%; height: auto; display: block; }
.carbox .fb-body { fill: #1f2f40; stroke: #5b7894; stroke-width: 2.5; }
.carbox .fb-line { fill: none; stroke: #5b7894; stroke-width: 1.5; }
.carbox .fb-glass { fill: #2b4157; stroke: #5b7894; stroke-width: 1.5; }
.carbox .fb-tyre { fill: #0b1219; stroke: #5b7894; stroke-width: 2; }
.carbox .fb-rim { fill: #1b2938; stroke: #5b7894; stroke-width: 1.5; }
.imgsrc { position: absolute; left: 18px; bottom: 10px; font-size: 11px; color: var(--muted); }
svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
svg.links path { fill: none; stroke-width: 1.4; stroke-dasharray: 4 4; opacity: .85; }
svg.links circle { stroke: var(--panel); stroke-width: 2; }
.callout { position: absolute; width: 112px; padding: 6px 9px; background: rgba(21,32,44,.92); border: 1px solid; border-radius: 8px; cursor: pointer; transition: transform .12s; }
.callout:hover { transform: scale(1.04); }
.callout small { display: block; text-transform: uppercase; letter-spacing: .08em; font-size: 9.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.callout b { font-size: 15px; }
.callout .lk { float: right; font-size: 11px; margin-top: 3px; }
.callout.l3 { animation: blink 1.1s infinite; }
@keyframes blink { 50% { box-shadow: 0 0 0 3px rgba(239,68,68,.25); } }

/* kanan */
.right { display: flex; flex-direction: column; min-height: 0; }
.cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 14px 16px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.card small { display: block; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }
.card b { font-size: 14px; }
.list { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.list::-webkit-scrollbar { width: 6px; }
.list::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 3px; }
.list h3 { margin: 6px 0 2px; }
.list h3:first-child { margin-top: 0; }
.row { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.row.flash { animation: flash 1.2s; }
@keyframes flash { 0%, 60% { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(45,212,191,.25); } }
.row .nm { font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.row .nm span { color: var(--muted); font-weight: 400; font-size: 11px; }
.row .bar { grid-column: 1; display: flex; align-items: center; gap: 8px; }
.row .track { flex: 1; height: 5px; border-radius: 3px; background: #0b1219; overflow: hidden; }
.row .track div { height: 100%; border-radius: 3px; }
.row .pc { width: 38px; text-align: right; font-size: 11px; font-weight: 700; }
.row .mat { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
.row .mat.none { color: #fca5a5; }
.row .act { grid-row: 1 / span 2; grid-column: 2; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 7px; border: 1px solid var(--line2); background: var(--card2); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; min-width: 92px; justify-content: center; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ok { border-color: transparent; background: transparent; color: var(--c0); }
.btn.locked { color: #fdba74; border-color: rgba(249,115,22,.35); background: rgba(249,115,22,.08); opacity: 1; }

.empty { color: var(--c0); background: rgba(34,197,94,.08); border: 1px solid rgba(34,197,94,.3); padding: 14px; border-radius: 10px; font-weight: 600; text-align: center; }
.progress { position: absolute; inset: 0; background: rgba(11,17,24,.9); display: grid; place-items: center; z-index: 5; }
.progress .box { width: 76%; text-align: center; display: flex; flex-direction: column; gap: 10px; }
.progress .track2 { height: 8px; border-radius: 4px; background: var(--card2); overflow: hidden; }
.progress .fill { height: 100%; width: 0; background: var(--accent); }

footer { display: grid; grid-template-columns: 1fr 1.25fr; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
footer button { padding: 10px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; }
footer button:hover:not(:disabled) { border-color: var(--line2); background: var(--card2); }
footer button.all { background: rgba(45,212,191,.12); border-color: rgba(45,212,191,.4); color: var(--accent); }
footer button.all:hover:not(:disabled) { background: rgba(45,212,191,.2); }
footer button:disabled { opacity: .45; cursor: not-allowed; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--line2); padding: 9px 16px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.4); opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="demo">
    <b>MOCKUP</b>
    <span id="demo-veh"></span>
    <span class="sep"></span>
    <button id="d-lift" onclick="setLoc('lift')">⬆ Di Lift</button>
    <button id="d-road" onclick="setLoc('road')">Di Jalan</button>
    <span class="sep"></span>
    <button onclick="toggleStock()">Bahan penuh/kosong</button>
    <button onclick="resetVeh(true)">Reset rusak</button>
    <button onclick="resetVeh(false)">Reset sehat</button>
</div>

<div class="panel">
    <header>
        <div class="brand">
            <span class="logo">🔧</span>
            <div><div class="kicker">Diagnosa Bengkel</div><h1 id="vehname"></h1></div>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
            <span id="state" class="state-pill"></span>
            <button class="icon-btn" title="Tutup (ESC)">✕</button>
        </div>
    </header>

    <div class="main">
        <div class="left">
            <div class="fluids" id="fluids"></div>
            <div class="stage" id="stage">
                <svg class="links" id="links"></svg>
                <div class="carbox" id="carbox"></div>
                <div class="imgsrc" id="imgsrc"></div>
            </div>
        </div>

        <div class="right">
            <div class="cards" id="cards"></div>
            <div class="list" id="list"></div>
            <footer>
                <button id="btn-tyres"><span>Ganti Semua Ban</span><small id="tyres-sub"></small></button>
                <button id="btn-all" class="all"><span>Perbaiki Semua</span><small id="all-sub"></small></button>
            </footer>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== data =====
const ITEMS = {
    metalscrap:  { label: 'Metal Scrap',        ico: '🔩' },
    plastic:     { label: 'Plastic',            ico: '🧴' },
    steel:       { label: 'Steel',              ico: '🔗' },
    aluminum:    { label: 'Aluminum',           ico: '🥫' },
    copper:      { label: 'Copper',             ico: '🟠' },
    tirekit:     { label: 'Tire Kit',           ico: '⭕' },
    engine_oil:  { label: 'Engine Oil',         ico: '🛢️' },
    coolant:     { label: 'Coolant',            ico: '💧' },
    brake_fluid: { label: 'Brake Fluid',        ico: '🧪' },
    trans_fluid: { label: 'Transmission Fluid', ico: '⚙️' },
    spark_plug:  { label: 'Spark Plugs',        ico: '⚡' },
    air_filter:  { label: 'Air Filter',         ico: '🌀' },
};
// heavy = hanya bisa diperbaiki saat kendaraan di lift bengkel. fluid = diisi ulang.
const PARTS = {
    oil:        { label: 'Oli Mesin',     max: 100,  item: 'engine_oil',  qty: 1, fluid: true, fx: ['Normal', 'Oli mulai kotor', 'Oli kurang, mesin cepat aus', 'Oli habis, mesin bisa rusak berat'] },
    coolant:    { label: 'Coolant',       max: 100,  item: 'coolant',     qty: 1, fluid: true, fx: ['Normal', 'Coolant berkurang', 'Mesin cepat panas', 'Mesin overheat'] },
    brakefluid: { label: 'Minyak Rem',    max: 100,  item: 'brake_fluid', qty: 1, fluid: true, fx: ['Normal', 'Rem sedikit dalam', 'Rem terasa lembek', 'Rem hampir tidak berfungsi'] },
    transfluid: { label: 'Oli Transmisi', max: 100,  item: 'trans_fluid', qty: 1, fluid: true, fx: ['Normal', 'Perpindahan gigi agak kasar', 'Gigi sering telat masuk', 'Transmisi bisa selip'] },

    engine:     { label: 'Mesin',         max: 1000, item: 'metalscrap',  qty: 2, heavy: true, fx: ['Normal', 'Tenaga sedikit turun', 'Tenaga turun, asap tipis', 'Bisa mogok kapan saja'] },
    sparkplugs: { label: 'Busi',          max: 100,  item: 'spark_plug',  qty: 1, fx: ['Normal', 'Kadang tersendat', 'Mesin sering tersendat', 'Susah hidup, tenaga drop'] },
    airfilter:  { label: 'Filter Udara',  max: 100,  item: 'air_filter',  qty: 1, fx: ['Normal', 'Tenaga sedikit turun', 'Tenaga turun, boros bensin', 'Tenaga turun jauh, sangat boros'] },
    radiator:   { label: 'Radiator',      max: 100,  item: 'steel',       qty: 5, heavy: true, fx: ['Normal', 'Mesin cepat panas', 'Mesin rusak perlahan', 'Mesin rusak cepat'] },
    clutch:     { label: 'Kopling',       max: 100,  item: 'copper',      qty: 6, heavy: true, fx: ['Normal', 'Kadang mesin mati sesaat', 'Sering mati sesaat', 'Mesin mati-mati terus'] },
    axle:       { label: 'As Roda',       bike: 'Rantai & As', max: 100, item: 'aluminum', qty: 7, heavy: true, fx: ['Normal', 'Setir sedikit goyang', 'Setir tidak stabil', 'Setir sangat sulit dikendalikan'] },

    suspension: { label: 'Suspensi',      max: 100,  item: 'steel',       qty: 4, heavy: true, fx: ['Normal', 'Sedikit limbung', 'Limbung & memantul', 'Sangat limbung, sulit dikendalikan'] },
    brakes:     { label: 'Rem',           max: 100,  item: 'copper',      qty: 5, fx: ['Normal', 'Daya rem sedikit turun', 'Rem lemah, berdecit', 'Rem sangat lemah, menarik ke samping'] },

    body:       { label: 'Body',          max: 1000, item: 'plastic',     qty: 3, fx: ['Mulus', 'Lecet & penyok kecil', 'Penyok, kaca retak', 'Rusak berat, lampu/kaca pecah'] },
    fuel:       { label: 'Tangki Bensin', max: 100,  item: 'plastic',     qty: 5, heavy: true, fx: ['Normal', 'Bensin bocor sedikit', 'Bensin bocor', 'Bensin cepat habis'] },
};
const GROUPS = [
    ['Mesin & Penggerak', ['engine', 'sparkplugs', 'airfilter', 'radiator', 'clutch', 'axle']],
    ['Kaki-kaki', ['suspension', 'brakes', 'TYRES']],
    ['Bodi & Tangki', ['body', 'fuel']],
    ['Cairan', ['oil', 'coolant', 'brakefluid', 'transfluid']],
];
const TYRES = {
    car:  { FL: 'Ban depan kiri', FR: 'Ban depan kanan', RL: 'Ban belakang kiri', RR: 'Ban belakang kanan' },
    bike: { F: 'Ban depan', R: 'Ban belakang' },
};
const TYRE_FX = ['Normal', 'Grip sedikit berkurang', 'Mudah selip saat menikung', 'Gundul, rawan bocor sendiri'];
const LVL = ['Baik', 'Aus', 'Rusak', 'Parah'];

// kendaraan demo. img: 'fivem' = docs.fivem.net/vehicles/<model>.webp, null = addon tanpa gambar (siluet)
const VEH = {
    jester3: { name: 'Dinka Jester Classic', plate: 'F 1234 AB', bike: false, img: 'fivem' },
    sultan:  { name: 'Karin Sultan',         plate: 'F 2201 KS', bike: false, img: 'fivem' },
    zentorno:{ name: 'Pegassi Zentorno',     plate: 'F 77 GT',   bike: false, img: 'fivem' },
    dubsta:  { name: 'Benefactor Dubsta',    plate: 'F 4455 KR', bike: false, img: 'fivem' },
    speedo:  { name: 'Vapid Speedo',         plate: 'F 9087 VN', bike: false, img: 'fivem' },
    pcj:     { name: 'Shitzu PCJ 600',       plate: 'F 5678 CD', bike: true,  img: 'fivem' },
    addon:   { name: 'Mobil Addon (contoh)', plate: 'F 3030 AD', bike: false, img: null },
};

// titik penunjuk (pecahan dari kotak gambar). Gambar FiveM: tampak 3/4 depan, moncong di kiri.
const ANCHOR = {
    car: {
        radiator: [.07, .64], engine: [.2, .46], sparkplugs: [.28, .43], airfilter: [.13, .42], brakes: [.32, .8], TYRES: [.87, .64],
        body: [.6, .3], clutch: [.42, .6], axle: [.62, .74], suspension: [.82, .5], fuel: [.86, .4],
    },
    bike: {
        radiator: [.42, .44], engine: [.5, .62], sparkplugs: [.47, .5], airfilter: [.56, .44], brakes: [.13, .8], TYRES: [.86, .8],
        body: [.75, .3], clutch: [.44, .7], axle: [.72, .72], suspension: [.2, .42], fuel: [.62, .3],
    },
};
// urut dari atas ke bawah mengikuti tinggi titik penunjuk supaya garis tidak bersilangan
const CALLOUTS = { left: ['airfilter', 'sparkplugs', 'engine', 'radiator', 'clutch', 'brakes'], right: ['body', 'fuel', 'suspension', 'TYRES', 'axle'] };

let st, stock;
const full = () => ({ metalscrap: 6, plastic: 10, steel: 9, aluminum: 7, copper: 12, tirekit: 4, engine_oil: 2, coolant: 2, brake_fluid: 1, trans_fluid: 1, spark_plug: 1, air_filter: 1 });
const isBike = () => VEH[st.veh].bike;
const tyreKeys = () => Object.keys(TYRES[isBike() ? 'bike' : 'car']);

function resetVeh(broken) {
    const veh = st ? st.veh : 'jester3', loc = st ? st.loc : 'lift';
    st = { veh, loc, broken, odo: broken ? 14820 : 3120 };
    st.p = broken
        ? { oil: 34, coolant: 58, brakefluid: 81, transfluid: 12, engine: 610, sparkplugs: 47, airfilter: 66, radiator: 42, clutch: 71, axle: 86, suspension: 55, brakes: 18, body: 540, fuel: 100 }
        : Object.fromEntries(Object.keys(PARTS).map(k => [k, PARTS[k].max]));
    setTyres();
    if (!stock) stock = full();
    build();
}
function setTyres() {
    st.tw = isBike() ? (st.broken ? { F: 72, R: 40 } : { F: 100, R: 100 }) : (st.broken ? { FL: 64, FR: 88, RL: 35, RR: 14 } : { FL: 100, FR: 100, RL: 100, RR: 100 });
    st.burst = st.broken ? (isBike() ? { R: true } : { FL: true }) : {};
}
function setVeh(v) { st.veh = v; setTyres(); build(); }
function setLoc(l) { st.loc = l; render(); }
function toggleStock() { stock = Object.values(stock).some(v => v > 0) ? Object.fromEntries(Object.keys(ITEMS).map(k => [k, 0])) : full(); render(); }

const pct = k => Math.round(st.p[k] / PARTS[k].max * 100);
const lvlOf = v => v >= 80 ? 0 : v >= 50 ? 1 : v >= 20 ? 2 : 3;
const lvl = k => lvlOf(pct(k));
const label = k => (isBike() && PARTS[k].bike) || PARTS[k].label;
const locked = k => PARTS[k].heavy && st.loc !== 'lift';
// di atas 80% masih "Baik", tidak dianggap rusak (sama dengan ban)
const needs = k => pct(k) < 80;
// ban: di atas 80% masih layak
const tyreNeeds = t => st.burst[t] || st.tw[t] < 80;
const tyreLvl = t => st.burst[t] ? 3 : lvlOf(st.tw[t]);
const tyresWorst = () => Math.max(...tyreKeys().map(tyreLvl));
const color = l => `var(--c${l})`;

// ===== gambar kendaraan =====
const FALLBACK = `<svg viewBox="30 48 552 196"><g transform="translate(612,0) scale(-1,1)">
  <path class="fb-body" d="M42,186 L38,158 C38,140 46,128 62,124 L128,116 C156,112 178,106 198,96 L240,70 C262,60 302,56 334,58 C362,60 384,70 404,90 L420,104 C468,110 516,114 548,124 C566,130 574,144 574,160 L572,186 L502,186 A46,46 0 0,0 410,186 L198,186 A46,46 0 0,0 106,186 Z"/>
  <path class="fb-glass" d="M206,104 L242,79 C262,69 300,65 330,66 C354,68 374,77 392,93 L402,104 Z"/>
  <path class="fb-line" d="M304,64 L304,105 M198,106 L406,106 M304,106 L306,182 M408,108 Q415,146 404,182 M202,108 C195,140 197,166 204,182"/>
  <circle class="fb-tyre" cx="152" cy="190" r="40"/><circle class="fb-rim" cx="152" cy="190" r="26"/>
  <circle class="fb-tyre" cx="456" cy="190" r="40"/><circle class="fb-rim" cx="456" cy="190" r="26"/>
</g></svg>`;

function build() {
    const V = VEH[st.veh], box = document.getElementById('carbox');
    box.innerHTML = '';
    const src = document.getElementById('imgsrc');
    if (V.img === 'fivem') {
        const img = new Image();
        img.onload = () => { src.textContent = `Gambar: docs.fivem.net/vehicles/${st.veh}.webp`; render(); };
        img.onerror = () => { box.innerHTML = FALLBACK; src.textContent = 'Gambar gagal dimuat · memakai siluet'; render(); };
        img.src = `https://docs.fivem.net/vehicles/${st.veh}.webp`;
        box.appendChild(img);
        src.textContent = 'Memuat gambar…';
    } else {
        box.innerHTML = FALLBACK;
        src.textContent = 'Addon tanpa gambar · memakai siluet (nanti: /vehimg membuat gambarnya)';
    }
    // callout
    document.querySelectorAll('.callout').forEach(e => e.remove());
    const stage = document.getElementById('stage');
    ['left', 'right'].forEach(side => CALLOUTS[side].forEach(k => {
        const c = document.createElement('div');
        c.className = 'callout'; c.dataset.k = k; c.dataset.side = side;
        c.onclick = () => focusRow(k);
        stage.appendChild(c);
    }));
    render();
}

function layoutCallouts() {
    const stage = document.getElementById('stage'), sr = stage.getBoundingClientRect();
    const box = document.getElementById('carbox').firstElementChild;
    if (!box) return;
    const br = box.getBoundingClientRect();
    const A = ANCHOR[isBike() ? 'bike' : 'car'];
    const svg = document.getElementById('links');
    let h = '';
    ['left', 'right'].forEach(side => {
        const keys = CALLOUTS[side], n = keys.length, gap = (sr.height - 30) / n;
        keys.forEach((k, i) => {
            const c = stage.querySelector(`.callout[data-k="${k}"]`);
            const top = 14 + gap * i + (gap - 46) / 2;
            c.style.top = top + 'px';
            c.style[side] = '16px';
            c.style[side === 'left' ? 'right' : 'left'] = '';
            const ax = br.left - sr.left + A[k][0] * br.width, ay = br.top - sr.top + A[k][1] * br.height;
            const cx = side === 'left' ? 16 + 112 : sr.width - 16 - 112, cy = top + 23;
            const l = k === 'TYRES' ? tyresWorst() : lvl(k);
            const mid = side === 'left' ? cx + 22 : cx - 22;
            h += `<path d="M${cx},${cy} L${mid},${cy} L${ax},${ay}" stroke="${color(l)}"/><circle cx="${ax}" cy="${ay}" r="4.5" fill="${color(l)}"/>`;
        });
    });
    svg.innerHTML = h;
}

// ===== render =====
function render() {
    document.getElementById('demo-veh').innerHTML = Object.keys(VEH).map(v =>
        `<button class="${st.veh === v ? 'on' : ''}" onclick="setVeh('${v}')">${v === 'addon' ? 'Addon' : VEH[v].name.split(' ').slice(1).join(' ')}</button>`).join(' ');
    ['lift', 'road'].forEach(l => document.getElementById('d-' + l).classList.toggle('on', st.loc === l));

    const V = VEH[st.veh];
    document.getElementById('vehname').textContent = V.name;
    const s = document.getElementById('state');
    s.className = 'state-pill ' + st.loc;
    s.textContent = st.loc === 'lift' ? '⬆ Di Lift · semua bisa diperbaiki' : 'Di Jalan · perbaikan ringan';

    // cairan
    document.getElementById('fluids').innerHTML = ['oil', 'coolant', 'brakefluid', 'transfluid'].map(k => {
        const v = pct(k), l = lvl(k);
        return `<div class="fluid" onclick="focusRow('${k}')"><div class="tube"><div style="height:${v}%;background:${color(l)}"></div></div>
            <div><small>${PARTS[k].label}</small><b style="color:${l ? color(l) : 'var(--text)'}">${v}%</b></div></div>`;
    }).join('');

    // callout
    document.querySelectorAll('.callout').forEach(c => {
        const k = c.dataset.k;
        let l, txt, lk = '';
        if (k === 'TYRES') {
            l = tyresWorst();
            const nb = tyreKeys().filter(t => st.burst[t]).length;
            txt = nb ? `${nb} bocor` : `${Math.min(...tyreKeys().map(t => st.tw[t]))}%`;
            c.querySelector && (c.innerHTML = `<small>Ban</small><b style="color:${color(l)}">${txt}</b>`);
        } else {
            l = lvl(k);
            if (locked(k) && needs(k)) lk = '<span class="lk">🔒</span>';
            c.innerHTML = `<small>${label(k)}</small>${lk}<b style="color:${color(l)}">${pct(k)}%</b>`;
        }
        c.style.borderColor = l ? color(l) : 'var(--line2)';
        c.classList.toggle('l3', l === 3);
    });

    // kartu
    const keys = Object.keys(PARTS);
    const avg = Math.round(keys.reduce((a, k) => a + pct(k), 0) / keys.length);
    document.getElementById('cards').innerHTML = [
        ['Plat', V.plate, ''],
        ['Jarak Tempuh', st.odo.toLocaleString('id-ID') + ' km', ''],
        ['Kondisi Umum', avg + '%', color(lvlOf(avg))],
    ].map(([k, v, c]) => `<div class="card"><small>${k}</small><b style="${c ? 'color:' + c : ''}">${v}</b></div>`).join('');

    renderList();
    renderFooter();
    requestAnimationFrame(layoutCallouts);
}

function matHtml(item, qty) {
    const have = stock[item];
    return `<div class="mat ${have < qty ? 'none' : ''}">${ITEMS[item].ico} ${ITEMS[item].label} ×${qty} · punya ${have}</div>`;
}

function partRow(k) {
    const P = PARTS[k], v = pct(k), l = lvl(k), lk = locked(k), need = needs(k), ok = stock[P.item] >= P.qty;
    let act;
    if (!need) act = `<button class="btn ok" disabled>✔ OK</button>`;
    else if (lk) act = `<button class="btn locked" disabled title="Bawa ke bengkel & naikkan ke lift">🔒 Perlu Lift</button>`;
    else act = `<button class="btn" ${ok ? '' : 'disabled'} onclick="repair('${k}')">🔧 ${P.fluid ? 'Isi Ulang' : 'Perbaiki'}</button>`;
    return `<div class="row" data-row="${k}">
        <div class="nm">${label(k)}${need ? `<span>${P.fx[l]}</span>` : ''}</div>
        <div class="act">${act}</div>
        <div class="bar"><div class="track"><div style="width:${v}%;background:${color(l)}"></div></div><div class="pc" style="color:${color(l)}">${v}%</div></div>
        ${need ? matHtml(P.item, P.qty) : ''}</div>`;
}

function tyreRow(t) {
    const b = !!st.burst[t], w = st.tw[t], l = tyreLvl(t), need = tyreNeeds(t);
    const act = !need ? `<button class="btn ok" disabled>✔ OK</button>`
        : `<button class="btn" ${stock.tirekit ? '' : 'disabled'} onclick="repairTyre('${t}')">⭕ Ganti Ban</button>`;
    return `<div class="row" data-row="TYRES">
        <div class="nm">${TYRES[isBike() ? 'bike' : 'car'][t]}${need ? `<span>${b ? 'Bocor · oleng & lambat' : TYRE_FX[lvlOf(w)]}</span>` : ''}</div>
        <div class="act">${act}</div>
        <div class="bar"><div class="track"><div style="width:${w}%;background:${color(l)}"></div></div><div class="pc" style="color:${color(l)}">${b ? 'BOCOR' : w + '%'}</div></div>
        ${need ? matHtml('tirekit', 1) : ''}</div>`;
}

function renderList() {
    const el = document.getElementById('list');
    const ov = el.querySelector('.progress');
    // hanya bagian yang rusak; kondisi lengkap cukup terlihat di persentase kiri
    const html = GROUPS.map(([title, ks]) => {
        const rows = ks.map(k => k === 'TYRES' ? tyreKeys().filter(tyreNeeds).map(tyreRow).join('') : needs(k) ? partRow(k) : '').join('');
        return rows ? `<h3>${title}</h3>${rows}` : '';
    }).join('');
    el.innerHTML = html || '<div class="empty">✔ Tidak ada kerusakan. Kendaraan dalam kondisi baik.</div>';
    if (ov) el.appendChild(ov);
}

function focusRow(k) {
    const r = document.querySelector(`.row[data-row="${k}"]`);
    if (!r) return toast(`✔ ${k === 'TYRES' ? 'Semua ban' : label(k)} dalam kondisi baik`);
    r.scrollIntoView({ behavior: 'smooth', block: 'center' });
    document.querySelectorAll(`.row[data-row="${k}"]`).forEach(x => { x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash'); });
}

function allCost() {
    const cost = {}, parts = [];
    Object.keys(PARTS).forEach(k => {
        if (needs(k) && !locked(k)) { cost[PARTS[k].item] = (cost[PARTS[k].item] || 0) + PARTS[k].qty; parts.push(k); }
    });
    const tyres = tyreKeys().filter(tyreNeeds);
    if (tyres.length) cost.tirekit = (cost.tirekit || 0) + tyres.length;
    return { cost, parts, tyres };
}

function renderFooter() {
    const bt = document.getElementById('btn-tyres'), ba = document.getElementById('btn-all');
    const fixT = tyreKeys().filter(tyreNeeds), nb = fixT.length;
    bt.disabled = !nb || stock.tirekit < nb;
    document.getElementById('tyres-sub').textContent = !nb ? 'Semua ban layak' : `⭕ Tire Kit ×${nb} · punya ${stock.tirekit}`;
    bt.onclick = () => run(`Mengganti ${nb} ban…`, 2500, () => { stock.tirekit -= nb; fixT.forEach(t => { delete st.burst[t]; st.tw[t] = 100; }); toast('⭕ Ban sudah diganti'); });

    const { cost, parts, tyres } = allCost(), keys = Object.keys(cost);
    const lockedN = Object.keys(PARTS).filter(k => needs(k) && locked(k)).length;
    const enough = keys.every(k => stock[k] >= cost[k]);
    ba.disabled = !keys.length || !enough;
    let sub = !keys.length ? (lockedN ? `🔒 ${lockedN} bagian perlu lift` : 'Tidak ada yang diperbaiki')
        : keys.map(k => `${ITEMS[k].ico}${cost[k]}`).join(' ') + (enough ? '' : ' · bahan kurang');
    if (keys.length && lockedN) sub += ` · 🔒 ${lockedN} perlu lift`;
    document.getElementById('all-sub').textContent = sub;
    ba.onclick = () => run('Memperbaiki semua…', 4000, () => {
        Object.entries(cost).forEach(([k, v]) => stock[k] -= v);
        parts.forEach(k => st.p[k] = PARTS[k].max);
        tyres.forEach(t => { delete st.burst[t]; st.tw[t] = 100; });
        toast(lockedN ? `🔧 Selesai · ${lockedN} bagian berat masih perlu lift` : '🔧 Kendaraan sudah diperbaiki');
    });
}

function repairTyre(t) {
    run(`Mengganti ${TYRES[isBike() ? 'bike' : 'car'][t].toLowerCase()}…`, 2000, () => {
        stock.tirekit--; delete st.burst[t]; st.tw[t] = 100; toast('⭕ Ban baru sudah dipasang');
    });
}

function repair(k) {
    const P = PARTS[k];
    run(`${P.fluid ? 'Mengisi' : 'Memperbaiki'} ${label(k).toLowerCase()}…`, 2500, () => {
        stock[P.item] -= P.qty; st.p[k] = P.max;
        toast(`🔧 ${label(k)} sudah ${P.fluid ? 'diisi' : 'diperbaiki'}`);
    });
}

function run(text, ms, done) {
    const el = document.getElementById('list');
    const ov = document.createElement('div');
    ov.className = 'progress';
    ov.style.top = el.scrollTop + 'px';
    ov.innerHTML = `<div class="box"><b>${text}</b><div class="track2"><div class="fill"></div></div><small>Animasi mekanik berjalan di game · bisa dibatalkan · bahan dipotong setelah selesai</small></div>`;
    el.appendChild(ov);
    el.style.overflow = 'hidden';
    const fill = ov.querySelector('.fill');
    requestAnimationFrame(() => { fill.style.transition = `width ${ms}ms linear`; fill.style.width = '100%'; });
    setTimeout(() => { ov.remove(); el.style.overflow = ''; done(); render(); }, ms);
}

function toast(t) {
    const e = document.getElementById('toast');
    e.textContent = t; e.classList.add('show');
    clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 2400);
}

window.addEventListener('resize', () => requestAnimationFrame(layoutCallouts));

// #<model>,road untuk screenshot
const hash = location.hash.slice(1).split(',');
st = { veh: VEH[hash[0]] ? hash[0] : 'jester3', loc: hash.includes('road') ? 'road' : 'lift' };
resetVeh(true);
</script>
