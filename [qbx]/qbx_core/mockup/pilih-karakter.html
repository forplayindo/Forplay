<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup Pilih Karakter</title>
<style>
:root {
    --bg: rgba(17, 24, 39, .92);
    --card: #1a2233;
    --card2: #222c40;
    --line: #2e3a52;
    --text: #e8edf6;
    --muted: #93a0b8;
    --accent: #5b9dff;
    --accent-dark: #3f82ea;
    --gold: #e7c36a;
    --green: #4ade80;
    --red: #f87171;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; }
body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; color: var(--text); font-size: 14px; background: #0b0f17; }
button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }

/* ---- hanya untuk mockup: tiruan pemandangan game (bandara, sore) ---- */
.scene { position: fixed; inset: 0; background:
    linear-gradient(180deg, #f2a65a 0%, #e9875a 22%, #7a5a7a 45%, #2b3550 62%, #1c2232 63%, #262b36 100%); }
.scene::before { content: ''; position: absolute; left: 0; right: 0; top: 62%; height: 3px; background: #e7c36a55; }
.scene::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 37%;
    background: repeating-linear-gradient(90deg, transparent 0 120px, #ffffff10 120px 124px); }
.ped { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%); width: 150px; height: 420px; opacity: .9; }
.ped .head { width: 64px; height: 76px; border-radius: 45%; background: #c99a7a; margin: 0 auto; }
.ped .body { width: 130px; height: 190px; margin: 6px auto 0; border-radius: 40px 40px 10px 10px; background: #2f4060; }
.ped .legs { width: 100px; height: 140px; margin: 0 auto; background: linear-gradient(90deg, #1f2a3a 48%, transparent 48% 52%, #1f2a3a 52%); }
.demo { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 9; background: #000a; padding: 6px; border-radius: 10px; font-size: 12px; }
.demo button { padding: 5px 10px; border-radius: 7px; background: #ffffff14; }
.demo button.on { background: var(--gold); color: #1a1406; font-weight: 700; }
/* -------------------------------------------------------------------- */

.panel { position: fixed; top: 50%; transform: translateY(-50%); background: var(--bg); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 20px 50px rgba(0, 0, 0, .45); display: flex; flex-direction: column; overflow: hidden; }
.left { left: 4vw; width: 300px; max-height: 80vh; }
.right { right: 4vw; width: 360px; max-height: 86vh; }

.head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.head h1 { font-size: 13px; letter-spacing: 2px; font-weight: 800; color: var(--gold); }
.head small { color: var(--muted); font-size: 12px; }

.chars { padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.char { text-align: left; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: flex; gap: 12px; align-items: center; transition: border-color .15s, background .15s; }
.char:hover { background: var(--card2); }
.char.active { border-color: var(--accent); background: var(--card2); }
.char .av { width: 38px; height: 38px; border-radius: 10px; background: #2b3a57; display: grid; place-items: center; font-weight: 800; color: var(--accent); flex-shrink: 0; }
.char b { display: block; font-size: 15px; }
.char span { color: var(--muted); font-size: 12px; }
.char.new { border-style: dashed; color: var(--muted); }
.char.new .av { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-size: 20px; }
.note { padding: 0 16px 14px; color: var(--muted); font-size: 11px; }

.info { padding: 16px 20px; border-bottom: 1px solid var(--line); }
.info h2 { font-size: 20px; }
.info .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.stat { background: var(--card); border-radius: 10px; padding: 9px 11px; }
.stat span { display: block; color: var(--muted); font-size: 11px; }
.stat b { font-size: 14px; }
.stat.wide { grid-column: 1 / -1; }
.money b { color: var(--green); }

.spawn { padding: 14px 20px 6px; overflow-y: auto; flex: 1; }
.spawn h3 { font-size: 11px; letter-spacing: 1.5px; color: var(--muted); font-weight: 800; margin-bottom: 8px; }
.loc { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--card); border: 1px solid transparent; margin-bottom: 6px; }
.loc:hover { background: var(--card2); }
.loc.active { border-color: var(--accent); }
.loc .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); flex-shrink: 0; }
.loc.active .dot { border-color: var(--accent); background: radial-gradient(var(--accent) 45%, transparent 50%); }
.loc b { display: block; font-size: 14px; }
.loc span { color: var(--muted); font-size: 12px; }
.loc .ic { margin-left: auto; font-size: 15px; opacity: .8; }

.foot { padding: 12px 20px 18px; }
.play { width: 100%; padding: 13px; border-radius: 12px; background: var(--accent); color: #0b1220; font-weight: 800; font-size: 15px; letter-spacing: 1px; }
.play:hover { background: var(--accent-dark); }

.newbox { padding: 18px 20px; color: var(--muted); font-size: 13px; line-height: 1.5; flex: 1; }
.newbox b { color: var(--text); }
</style>
</head>
<body>
<div class="scene"></div>
<div class="ped"><div class="head"></div><div class="body"></div><div class="legs"></div></div>

<div class="demo">
    <span style="padding:5px 4px;opacity:.7">Mockup:</span>
    <button data-mode="player" class="on">Pemain (1 slot)</button>
    <button data-mode="admin">Admin (3 slot)</button>
</div>

<div class="panel left">
    <div class="head"><h1>PILIH KARAKTER</h1><small id="slotinfo"></small></div>
    <div class="chars" id="chars"></div>
    <div class="note">Karakter tidak bisa dihapus sendiri.</div>
</div>

<div class="panel right" id="right"></div>

<script>
const DATA = [
    { cid: 'ED3UIWMB', name: 'Sora Damn', gender: 'Laki-laki', birth: '1998-04-12', job: 'Mekanik', grade: 'Karyawan', gang: 'crew_1', bank: 1250000, cash: 85000, phone: '0812-3456-7890', last: 'Alta St, Pillbox Hill', house: 'Rumah Vinewood 12' },
    { cid: 'K96OT27X', name: 'Raka Pratama', gender: 'Laki-laki', birth: '2001-09-30', job: 'Pengangguran', grade: '-', gang: '-', bank: 320000, cash: 15000, phone: '0813-1111-2222', last: 'Great Ocean Hwy, Paleto Bay', house: null },
];
const SPAWNS = [ { label: 'Legion Square', area: 'Vespucci Blvd, Pillbox Hill' }, { label: 'Paleto Bay', area: 'Paleto Blvd, Paleto Bay' } ];
const rp = (n) => 'Rp ' + n.toLocaleString('id-ID');
let mode = 'player', sel = 0, loc = 0;

function slots() { return mode === 'admin' ? 3 : 1; }

function renderChars() {
    const max = slots();
    const own = DATA.slice(0, max);
    document.getElementById('slotinfo').textContent = `${own.length} / ${max} slot terpakai`;
    let html = own.map((c, i) => `<button class="char ${i === sel ? 'active' : ''}" data-i="${i}">
        <div class="av">${c.name.split(' ').map(w => w[0]).join('')}</div>
        <div><b>${c.name}</b><span>${c.job}</span></div></button>`).join('');
    for (let i = own.length; i < max; i++) html += `<button class="char new ${i === sel ? 'active' : ''}" data-i="${i}"><div class="av">＋</div><div><b>Slot kosong</b><span>Buat karakter baru</span></div></button>`;
    document.getElementById('chars').innerHTML = html;
}

function renderRight() {
    const c = DATA.slice(0, slots())[sel];
    const r = document.getElementById('right');
    if (!c) {
        r.innerHTML = `<div class="info"><h2>Karakter Baru</h2><div class="sub">Slot ${sel + 1}</div></div>
        <div class="newbox">Isi <b>nama, tanggal lahir, dan jenis kelamin</b>, lalu kamu langsung muncul di <b>Kantor Pemerintahan (City Hall)</b> untuk mengatur wajah & pakaian.<br><br>Lokasi spawn pertama sudah ditentukan dan tidak bisa dipilih.</div>
        <div class="foot"><button class="play">BUAT KARAKTER</button></div>`;
        return;
    }
    const locs = [{ label: 'Lokasi Terakhir', area: c.last, ic: '📍' }, ...SPAWNS.map(s => ({ ...s, ic: '🏙️' }))];
    if (c.house) locs.push({ label: c.house, area: 'Rumah milikmu', ic: '🏠' });
    if (loc >= locs.length) loc = 0;
    r.innerHTML = `<div class="info"><h2>${c.name}</h2><div class="sub">${c.cid} · ${c.gender} · ${c.birth}</div>
        <div class="stats">
            <div class="stat"><span>Pekerjaan</span><b>${c.job}</b></div>
            <div class="stat"><span>Jabatan</span><b>${c.grade}</b></div>
            <div class="stat money"><span>Bank</span><b>${rp(c.bank)}</b></div>
            <div class="stat money"><span>Cash</span><b>${rp(c.cash)}</b></div>
            <div class="stat"><span>Telepon</span><b>${c.phone}</b></div>
            <div class="stat"><span>Gang</span><b>${c.gang}</b></div>
        </div></div>
        <div class="spawn"><h3>LOKASI SPAWN</h3>${locs.map((l, i) => `<button class="loc ${i === loc ? 'active' : ''}" data-l="${i}"><div class="dot"></div><div><b>${l.label}</b><span>${l.area}</span></div><div class="ic">${l.ic}</div></button>`).join('')}</div>
        <div class="foot"><button class="play">MAIN</button></div>`;
}

function render() { renderChars(); renderRight(); }

document.getElementById('chars').addEventListener('click', (e) => {
    const b = e.target.closest('.char'); if (!b) return;
    sel = Number(b.dataset.i); loc = 0; render();
});
document.getElementById('right').addEventListener('click', (e) => {
    const b = e.target.closest('.loc'); if (!b) return;
    loc = Number(b.dataset.l); renderRight();
});
document.querySelector('.demo').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.mode; sel = 0; loc = 0;
    document.querySelectorAll('.demo button').forEach(x => x.classList.toggle('on', x === b));
    render();
});
render();
</script>
</body>
</html>
