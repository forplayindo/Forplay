<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Cek Pasien (mockup)</title>
<style>
/* Mockup NUI "Cek Pasien" - tata letak mengikuti panel Administrasi f_police, tema terang dasar #faebd7 */
:root {
    --bg: #faebd7; --card: #fff7ec; --card2: #f3dcc0; --line: #e4c9a3;
    --text: #3d2b1a; --muted: #8b7055; --accent: #2f6fd6; --accent-dark: #2459b0;
    --green: #1f8a4c; --red: #c9372c;
    --s0: #f3dcc0; --s1: #e0b030; --s2: #f59e0b; --s3: #f97316; --s4: #ef4444;
    --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    min-height: 100vh; font-family: 'Segoe UI', Roboto, Arial, sans-serif; color: var(--text); font-size: 14px; line-height: 1.35;
    background: radial-gradient(ellipse at 30% 20%, #b9c3cc 0%, #8f9aa5 55%, #6d7782 100%); user-select: none;
}
button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; outline: none; }
small { color: var(--muted); font-size: 12px; }

/* bar demo (tidak ada di game) */
.demo { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; background: rgba(250,235,215,.9); padding: 8px 10px; border-radius: 10px; font-size: 12px; z-index: 99; }
.demo button { background: var(--card2); padding: 6px 10px; border-radius: 8px; }
.demo button:hover { background: var(--line); }

.panel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(960px, 96vw); height: min(620px, 94vh);
    background: var(--bg); border: 1px solid var(--line); border-radius: 20px;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(80,50,20,.3);
}
header { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; border-bottom: 1px solid var(--line); }
.brand { display: flex; gap: 12px; align-items: center; }
.logo { font-size: 26px; width: 46px; height: 46px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
h1 { font-size: 20px; font-weight: 700; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font-size: 16px; }
.icon-btn:hover { background: #f6cfc8; }
.state-pill { font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 999px; }
.state-pill.down { background: #f9d6d0; color: var(--red); }
.state-pill.ok { background: #d5efdc; color: var(--green); }

.main { flex: 1; display: grid; grid-template-columns: 380px 1fr; min-height: 0; }

/* kiri: tubuh */
.body-col { border-right: 1px solid var(--line); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; align-items: center; min-height: 0; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #fffaf3 0%, #fbf0e1 55%, #f3dfc5 100%); }
.body-col .hint { color: var(--muted); font-size: 12px; text-align: center; }
.body-col .hover { color: var(--text); font-weight: 600; }
svg.body { width: 100%; flex: 1 1 0; min-height: 0; }
svg.body .regions { mix-blend-mode: hard-light; }
svg.body .part { fill-opacity: .8; stroke: rgba(255,255,255,.25); stroke-width: .8; stroke-linejoin: round; cursor: pointer; }
svg.body .part:not(.hurt):hover { fill: rgba(91,157,255,.25); fill-opacity: 1; }
svg.body .part.hurt:hover { fill-opacity: .8; }
svg.body .selo { fill: none; stroke: #1d6fe0; stroke-width: 3.5; stroke-linejoin: round; }
svg.body .part.s4 { animation: pulse 1.2s infinite; }
svg.body .slabel { fill: var(--muted); font-size: 13px; font-weight: 700; text-anchor: middle; }
.hover { font-size: 12px; min-height: 16px; }
@keyframes pulse { 50% { fill-opacity: .92; } }
.legend { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 11px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

/* kanan */
.right { display: flex; flex-direction: column; min-height: 0; }
.vitals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 16px 20px 0; }
.vital { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.vital small { display: block; }
.vital b { font-size: 15px; }
.vital.bad b { color: var(--red); }
.vital.warn b { color: #c76a00; }
.vital.good b { color: var(--green); }

.content { flex: 1; overflow-y: auto; padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; position: relative; }
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.row { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; }
.row:hover { border-color: var(--accent); }
.row .dot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
.row .name { flex: 1; }
.row .name span { display: block; color: var(--muted); font-size: 12px; }
.row .need { font-size: 12px; color: var(--muted); text-align: right; }
.row .need b { color: var(--text); }
.empty { color: var(--green); background: #d5efdc; padding: 12px 14px; border-radius: 12px; font-weight: 700; }

.detail { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.detail .top { display: flex; justify-content: space-between; align-items: center; }
.back { color: var(--accent); font-size: 13px; font-weight: 600; }
.sev-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.sev-bar div { height: 8px; border-radius: 4px; background: var(--card2); }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--bg); }
.kv span { color: var(--muted); }
.item-need { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: #e6efff; border: 1px solid #a9c4f0; }
.item-need .ico { font-size: 26px; width: 44px; height: 44px; display: grid; place-items: center; background: #fff; border-radius: 10px; }
.item-need .name { flex: 1; }
.item-need .stock { font-weight: 800; }
.item-need.none { background: #fbe0dc; border-color: #eba79e; }
.item-need.none .stock { color: var(--red); }

.primary { padding: 12px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 800; font-size: 15px; }
.primary:hover { background: var(--accent-dark); }
.primary:disabled { opacity: .6; cursor: not-allowed; background: var(--card2); color: var(--muted); }
.msg { padding: 8px 12px; border-radius: 8px; background: #fbe0dc; color: var(--red); font-size: 12px; }

/* progress */
.progress { position: absolute; inset: 0; background: rgba(250,235,215,.94); display: grid; place-items: center; z-index: 5; }
.progress .box { width: 70%; text-align: center; display: flex; flex-direction: column; gap: 10px; }
.progress .track { height: 10px; border-radius: 5px; background: var(--card2); overflow: hidden; }
.progress .fill { height: 100%; width: 0; background: var(--accent); }

footer { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); }
footer button { padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; }
footer button:hover:not(:disabled) { background: var(--card2); }
footer button small { font-weight: 400; }
footer button.revive { background: #d5efdc; border-color: #a8d8b6; color: var(--green); }
footer button.revive:hover:not(:disabled) { background: #c2e6cd; }
footer button:disabled { opacity: .5; cursor: not-allowed; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; box-shadow: 0 6px 20px rgba(80,50,20,.2); opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="demo">
    <b>MOCKUP</b>
    <button onclick="resetPatient(true)">Reset: pasien tergeletak</button>
    <button onclick="resetPatient(false)">Reset: pasien sadar</button>
    <button onclick="toggleStock()">Tas EMS: penuh / kosong</button>
</div>

<div class="panel">
    <header>
        <div class="brand">
            <span class="logo">🩺</span>
            <div><h1>Cek Pasien</h1><small>John Carter · ID 12</small></div>
        </div>
        <div style="display:flex;gap:12px;align-items:center">
            <span id="state" class="state-pill down"></span>
            <button class="icon-btn" title="Tutup (ESC)">✕</button>
        </div>
    </header>

    <div class="main">
        <div class="body-col">
            <h3>Peta Luka</h3>
            <svg class="body" viewBox="0 0 420 470" id="body"></svg>
            <div class="hover" id="hover">&nbsp;</div>
            <div class="legend">
                <span><i style="background:#2b7de0"></i>Sehat</span>
                <span><i style="background:var(--s1)"></i>Iritasi</span>
                <span><i style="background:var(--s2)"></i>Cukup sakit</span>
                <span><i style="background:var(--s3)"></i>Sakit</span>
                <span><i style="background:var(--s4)"></i>Sangat sakit</span>
            </div>
            <div class="hint">Klik area tubuh untuk melihat & mengobati</div>
        </div>

        <div class="right">
            <div class="vitals" id="vitals"></div>
            <div class="content" id="content"></div>
            <footer>
                <button id="btn-pk"><span>💊 Painkiller</span><small id="pk-sub"></small></button>
                <button id="btn-all"><span>🩹 Obati Semua</span><small id="all-sub"></small></button>
                <button id="btn-rev" class="revive"><span>❤️ Revive</span><small id="rev-sub"></small></button>
            </footer>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Gambar anatomi body.png (459x612) ditampilkan apa adanya; di atasnya poligon area luka yang di-mask
// dengan siluet (body-mask.png). Area sehat transparan, area luka diberi warna tingkat keparahan.
// Poligon ditulis untuk sisi kiri layar lalu dicerminkan terhadap garis tengah x = 229.5.
(function buildBody() {
    const NS = 'http://www.w3.org/2000/svg';
    const W = 459, H = 612, CX = 229.5;

    const CENTER = {
        HEAD: [[180,0],[279,0],[279,116],[180,116]],
        NECK: [[190,116],[269,116],[269,134],[190,134]],
        UPPER_BODY: [[200,126],[259,126],[290,138],[281,198],[278,262],[181,262],[178,198],[169,138]],
        LOWER_BODY: [[181,262],[278,262],[292,330],[229.5,345],[167,330]],
    };
    const SIDE = {
        LEG: [[150,320],[167,330],[229.5,345],[229.5,555],[150,555]],
        FOOT: [[140,555],[229.5,555],[229.5,620],[140,620]],
        ARM: [[-20,120],[205,120],[178,198],[140,306],[-20,306]],
        HAND: [[-20,306],[170,306],[170,336],[-20,336]],
        FINGER: [[-20,336],[170,336],[170,380],[-20,380]],
    };
    const SPINE = [[225,134],[234,134],[234,330],[225,330]];

    const svg = document.getElementById('body');
    svg.setAttribute('viewBox', '78 22 303 580');
    const el = (tag, attrs, parent) => {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        (parent || svg).appendChild(e);
        return e;
    };
    const pts = p => p.map(q => q.join(',')).join(' ');
    const mir = p => p.map(([x, y]) => [CX * 2 - x, y]);

    const defs = el('defs', {});
    const mask = el('mask', { id: 'bodyMask', maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: W, height: H, style: 'mask-type:alpha' }, defs);
    el('image', { href: 'body-mask.png', x: 0, y: 0, width: W, height: H }, mask);

    el('text', { class: 'slabel', x: 100, y: 120 }).textContent = 'KA';
    el('text', { class: 'slabel', x: 359, y: 120 }).textContent = 'KI';

    el('image', { href: 'body.png', x: 0, y: 0, width: W, height: H, style: 'pointer-events:none' });
    // warna luka di atas gambar dengan blend mode: warnanya ikut, detail organ & pembuluh darah tetap kelihatan.
    // kiri layar = kanan pasien (tampak depan)
    const regions = el('g', { mask: 'url(#bodyMask)', class: 'regions' });
    const add = (p, poly) => el('polygon', { class: 'part', 'data-p': p, points: pts(poly) }, regions);
    ['LEG', 'FOOT', 'ARM', 'HAND', 'FINGER'].forEach(k => {
        add('R' + k, SIDE[k]);
        add('L' + k, mir(SIDE[k]));
    });
    ['LOWER_BODY', 'UPPER_BODY', 'NECK', 'HEAD', 'SPINE'].forEach(k => add(k, k === 'SPINE' ? SPINE : CENTER[k]));
    // garis pilihan digambar di atas gambar supaya tetap kelihatan
    const selLayer = el('g', { id: 'selLayer', mask: 'url(#bodyMask)', style: 'pointer-events:none' });
})();
</script>
<script>
const SEV = ['Sehat', 'Iritasi', 'Cukup sakit', 'Sakit', 'Sangat sakit'];
const BLEED = ['Tidak berdarah', 'Sedikit berdarah', 'Berdarah', 'Banyak berdarah', 'Pendarahan hebat'];
const ITEMS = {
    bandage:    { label: 'Perban',          ico: '🩹' },
    hemostatic: { label: 'Kasa Hemostatik', ico: '🧻' },
    splint:     { label: 'Bidai',           ico: '🦴' },
    suture:     { label: 'Kit Jahit',       ico: '🧵' },
    firstaid:   { label: 'Kotak P3K',       ico: '🧰' },
    painkillers:{ label: 'Painkiller',      ico: '💊' },
};
// limb = anggota gerak (berat -> bidai), skin = kepala/badan (berat -> kit jahit)
const PARTS = {
    HEAD: ['Kepala', 'skin'], NECK: ['Leher', 'skin'], UPPER_BODY: ['Badan atas', 'skin'], LOWER_BODY: ['Badan bawah', 'skin'],
    SPINE: ['Tulang belakang', 'limb', true],
    LARM: ['Lengan kiri', 'limb'], LHAND: ['Tangan kiri', 'limb'], LFINGER: ['Jari kiri', 'limb'],
    RARM: ['Lengan kanan', 'limb'], RHAND: ['Tangan kanan', 'limb'], RFINGER: ['Jari kanan', 'limb'],
    LLEG: ['Kaki kiri', 'limb', true], LFOOT: ['Telapak kiri', 'limb', true],
    RLEG: ['Kaki kanan', 'limb', true], RFOOT: ['Telapak kanan', 'limb', true],
};
const EFFECT = {
    skin: ['', 'Nyeri ringan', 'Nyeri, kadang pandangan kabur', 'Luka terbuka, pandangan kabur', 'Luka dalam, bisa pingsan'],
    limb: ['', 'Nyeri ringan', 'Gerak sedikit terganggu', 'Kemungkinan retak', 'Patah, tidak bisa dipakai normal'],
};

let st;
function resetPatient(down) {
    st = {
        down, timer: down ? 252 : 0, bleed: down ? 3 : 1, hp: down ? 0 : 62, armor: 0, sel: null,
        inj: down
            ? { HEAD: [1, 'Pukulan tangan kosong'], UPPER_BODY: [3, 'Pistol'], RHAND: [2, 'Pisau'], LLEG: [4, 'Pistol'] }
            : { LARM: [2, 'Jatuh dari ketinggian'], LFOOT: [1, 'Jatuh dari ketinggian'] },
    };
    if (!window.stock) stock = full();
    render();
}
const full = () => ({ bandage: 5, hemostatic: 1, splint: 1, suture: 2, firstaid: 3, painkillers: 4 });
function toggleStock() {
    stock = Object.values(stock).some(v => v > 0) ? { bandage: 0, hemostatic: 0, splint: 0, suture: 0, firstaid: 0, painkillers: 0 } : full();
    render();
}

function needFor(p) {
    const sev = st.inj[p] ? st.inj[p][0] : 0;
    if (!sev) return null;
    if (sev <= 2) return 'bandage';
    return PARTS[p][1] === 'limb' ? 'splint' : 'suture';
}
const bleedNeed = () => st.bleed === 0 ? null : (st.bleed <= 2 ? 'bandage' : 'hemostatic');
const injList = () => Object.keys(st.inj).sort((a, b) => st.inj[b][0] - st.inj[a][0]);

function render() {
    // tubuh
    document.querySelectorAll('#body .part').forEach(el => {
        const p = el.dataset.p, sev = st.inj[p] ? st.inj[p][0] : 0;
        el.setAttribute('fill', sev ? `var(--s${sev})` : 'transparent');
        el.classList.toggle('hurt', sev > 0);
        el.classList.toggle('s4', sev === 4);
        el.classList.toggle('sel', st.sel === p);
    });
    const selLayer = document.getElementById('selLayer');
    selLayer.innerHTML = '';
    document.querySelectorAll(`#body .part[data-p="${st.sel}"]`).forEach(el => {
        const o = el.cloneNode(); o.setAttribute('class', 'selo'); selLayer.appendChild(o);
    });
    // status
    const s = document.getElementById('state');
    s.className = 'state-pill ' + (st.down ? 'down' : 'ok');
    s.textContent = st.down ? `Tergeletak · ${fmt(st.timer)}` : 'Sadar';
    // vital
    const injCount = injList().length;
    document.getElementById('vitals').innerHTML = [
        ['Kesadaran', st.down ? 'Tidak sadar' : 'Sadar', st.down ? 'bad' : 'good'],
        ['Pendarahan', BLEED[st.bleed], st.bleed >= 3 ? 'bad' : st.bleed ? 'warn' : 'good'],
        ['Darah', st.down ? 'Kritis' : st.hp + '%', st.down ? 'bad' : st.hp < 50 ? 'warn' : 'good'],
        ['Luka', injCount ? injCount + ' area' : 'Tidak ada', injCount ? 'warn' : 'good'],
    ].map(([k, v, c]) => `<div class="vital ${c}"><small>${k}</small><b>${v}</b></div>`).join('');

    st.sel ? renderDetail(st.sel) : renderSummary();
    renderFooter();
}

function needHtml(key, qty = 1) {
    const it = ITEMS[key], have = stock[key];
    return `<div class="item-need ${have < qty ? 'none' : ''}">
        <div class="ico">${it.ico}</div>
        <div class="name"><b>${it.label}</b> ×${qty}<br><small>Di tas kamu</small></div>
        <div class="stock">${have}</div></div>`;
}

function renderSummary() {
    const c = document.getElementById('content');
    let h = '<h3>Ringkasan</h3>';
    if (st.bleed) {
        const n = bleedNeed();
        h += `<button class="row" onclick="select('BLEED')"><span class="dot" style="background:var(--s${Math.min(4, st.bleed + 1)})"></span>
            <span class="name">🩸 ${BLEED[st.bleed]}<span>Darah terus berkurang, tangani dulu</span></span>
            <span class="need">Butuh<br><b>${ITEMS[n].ico} ${ITEMS[n].label}</b></span></button>`;
    }
    const list = injList();
    if (!list.length && !st.bleed) h += '<div class="empty">✔ Pasien tidak memiliki luka</div>';
    list.forEach(p => {
        const [sev, cause] = st.inj[p], n = needFor(p);
        h += `<button class="row" onclick="select('${p}')"><span class="dot" style="background:var(--s${sev})"></span>
            <span class="name">${PARTS[p][0]} · ${SEV[sev]}<span>Penyebab: ${cause}${PARTS[p][2] && sev >= 2 ? ' · bikin pincang' : ''}</span></span>
            <span class="need">Butuh<br><b>${ITEMS[n].ico} ${ITEMS[n].label}</b></span></button>`;
    });
    c.innerHTML = h;
}

function renderDetail(p) {
    const c = document.getElementById('content');
    if (p === 'BLEED') {
        const n = bleedNeed();
        if (!n) { st.sel = null; return renderSummary(); }
        c.innerHTML = `<div class="detail">
            <div class="top"><h2>🩸 Pendarahan</h2><button class="back" onclick="select(null)">← Ringkasan</button></div>
            <div class="sev-bar">${[1,2,3,4].map(i => `<div style="${i <= st.bleed ? `background:var(--s${Math.min(4, st.bleed + 1)})` : ''}"></div>`).join('')}</div>
            <div class="kv"><span>Tingkat</span><b>${BLEED[st.bleed]}</b></div>
            <div class="kv"><span>Efek</span><b>${st.bleed >= 3 ? 'Darah cepat habis, bisa pingsan' : 'Darah berkurang perlahan'}</b></div>
            <h3>Penanganan</h3>${needHtml(n)}
            ${stock[n] ? '' : `<div class="msg">Kamu tidak punya ${ITEMS[n].label}</div>`}
            <button class="primary" ${stock[n] ? '' : 'disabled'} onclick="treat('BLEED')">Hentikan Pendarahan</button></div>`;
        return;
    }
    const inj = st.inj[p], sev = inj ? inj[0] : 0, n = needFor(p), [label, group, limp] = PARTS[p];
    let h = `<div class="detail">
        <div class="top"><h2>${label}</h2><button class="back" onclick="select(null)">← Ringkasan</button></div>
        <div class="sev-bar">${[1,2,3,4].map(i => `<div style="${i <= sev ? `background:var(--s${sev})` : ''}"></div>`).join('')}</div>
        <div class="kv"><span>Kondisi</span><b>${SEV[sev]}</b></div>`;
    if (!sev) { c.innerHTML = h + '<div class="empty">✔ Tidak ada luka di area ini</div></div>'; return; }
    h += `<div class="kv"><span>Penyebab</span><b>${inj[1]}</b></div>
        <div class="kv"><span>Efek</span><b>${EFFECT[group][sev]}${limp && sev >= 2 ? ' · pincang' : ''}</b></div>
        <h3>Penanganan</h3>${needHtml(n)}
        ${stock[n] ? '' : `<div class="msg">Kamu tidak punya ${ITEMS[n].label}</div>`}
        <button class="primary" ${stock[n] ? '' : 'disabled'} onclick="treat('${p}')">Obati ${label}</button></div>`;
    c.innerHTML = h;
}

function allCost() {
    const cost = {};
    const add = k => { if (k) cost[k] = (cost[k] || 0) + 1; };
    add(bleedNeed());
    injList().forEach(p => add(needFor(p)));
    return cost;
}

function renderFooter() {
    const pk = document.getElementById('btn-pk'), all = document.getElementById('btn-all'), rev = document.getElementById('btn-rev');
    pk.disabled = st.down || !stock.painkillers;
    document.getElementById('pk-sub').textContent = st.down ? 'Pasien tidak sadar' : `Tahan nyeri · punya ${stock.painkillers}`;

    const cost = allCost(), keys = Object.keys(cost);
    const enough = keys.every(k => stock[k] >= cost[k]);
    all.disabled = !keys.length || !enough;
    document.getElementById('all-sub').textContent = !keys.length ? 'Tidak ada yang diobati'
        : keys.map(k => `${ITEMS[k].ico}${cost[k]}`).join(' ') + (enough ? '' : ' · item kurang');

    const blockBleed = st.bleed >= 3;
    rev.disabled = !st.down || !stock.firstaid || blockBleed;
    document.getElementById('rev-sub').textContent = !st.down ? 'Pasien sadar'
        : blockBleed ? 'Hentikan pendarahan dulu' : !stock.firstaid ? 'Butuh Kotak P3K' : `🧰 Kotak P3K ×1 · punya ${stock.firstaid}`;

    pk.onclick = () => run('Memberi painkiller…', 2000, () => { stock.painkillers--; toast('💊 Efek nyeri pasien ditahan sementara'); });
    all.onclick = () => run('Mengobati semua luka…', 4000, () => {
        Object.entries(cost).forEach(([k, v]) => stock[k] -= v);
        st.inj = {}; st.bleed = 0; st.sel = null; if (!st.down) st.hp = 100;
        toast('🩹 Semua luka diobati');
    });
    rev.onclick = () => run('Melakukan CPR…', 3000, () => {
        stock.firstaid--; st.down = false; st.hp = 25; st.timer = 0;
        toast('❤️ Pasien sadar kembali (luka tetap ada)');
    });
}

function select(p) { st.sel = p; render(); }

function treat(p) {
    if (p === 'BLEED') {
        const n = bleedNeed();
        return run(`Memasang ${ITEMS[n].label.toLowerCase()}…`, 2000, () => {
            stock[n]--; st.bleed = n === 'hemostatic' ? 0 : Math.max(0, st.bleed - 2);
            toast(`${ITEMS[n].ico} Pendarahan dihentikan`);
        });
    }
    const n = needFor(p);
    run(`Memasang ${ITEMS[n].label.toLowerCase()} di ${PARTS[p][0].toLowerCase()}…`, 2000, () => {
        stock[n]--; delete st.inj[p]; st.sel = null;
        toast(`${ITEMS[n].ico} ${PARTS[p][0]} sudah diobati`);
    });
}

function run(label, ms, done) {
    const c = document.getElementById('content');
    const ov = document.createElement('div');
    ov.className = 'progress';
    ov.innerHTML = `<div class="box"><b>${label}</b><div class="track"><div class="fill"></div></div><small>Animasi berjalan di game · bisa dibatalkan</small></div>`;
    c.appendChild(ov);
    const fill = ov.querySelector('.fill');
    requestAnimationFrame(() => { fill.style.transition = `width ${ms}ms linear`; fill.style.width = '100%'; });
    setTimeout(() => { done(); render(); }, ms);
}

function toast(t) {
    const el = document.getElementById('toast');
    el.textContent = t; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2200);
}
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

const hover = document.getElementById('hover');
document.querySelectorAll('#body .part').forEach(el => {
    el.addEventListener('click', () => select(el.dataset.p));
    el.addEventListener('mouseenter', () => {
        const p = el.dataset.p, sev = st.inj[p] ? st.inj[p][0] : 0;
        hover.textContent = `${PARTS[p][0]} · ${SEV[sev]}`;
    });
    el.addEventListener('mouseleave', () => { hover.innerHTML = '&nbsp;'; });
});
setInterval(() => { if (st.down && st.timer > 0) { st.timer--; document.getElementById('state').textContent = `Tergeletak · ${fmt(st.timer)}`; } }, 1000);
resetPatient(true);
</script>
</body>
</html>
