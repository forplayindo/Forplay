<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Cek Pasien</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-steth" viewBox="0 0 24 24"><path d="M6 3v6a5 5 0 0 0 10 0V3M11 14v2a5 5 0 0 0 10 0v-2"/><circle cx="21" cy="12" r="0"/><circle cx="20" cy="12" r="2"/></symbol>
    <symbol id="i-pill" viewBox="0 0 24 24"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-45 12 12)"/><path d="m9 9 6 6"/></symbol>
    <symbol id="i-cross" viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol>
</svg>
<div id="app" class="hidden">
    <div class="panel">
        <header>
            <div class="brand">
                <span class="logo"><svg class="ic"><use href="#i-steth"/></svg></span>
                <div><h1>Cek Pasien</h1><small id="sub"></small></div>
            </div>
            <div class="head-right">
                <span id="state" class="state-pill"></span>
                <button class="icon-btn" id="close" title="Tutup (ESC)"><svg class="ic"><use href="#i-x"/></svg></button>
            </div>
        </header>

        <div class="main">
            <div class="body-col">
                <h3>Peta Luka</h3>
                <svg class="body" id="body"></svg>
                <div class="hover" id="hover">&nbsp;</div>
                <div class="legend">
                    <span><i style="background:#2b7de0"></i>Sehat</span>
                    <span><i style="background:var(--s1)"></i>Iritasi</span>
                    <span><i style="background:var(--s2)"></i>Cukup sakit</span>
                    <span><i style="background:var(--s3)"></i>Sakit</span>
                    <span><i style="background:var(--s4)"></i>Sangat sakit</span>
                </div>
                <div class="hint">Klik area tubuh untuk melihat & mengobati</div>
            </div>

            <div class="right">
                <div class="tabs">
                    <button data-tab="care" class="on">Perawatan</button>
                    <button data-tab="bill">Tagihan</button>
                </div>
                <div class="vitals" id="vitals"></div>
                <div class="content" id="content"></div>
                <div class="content hidden" id="billing"></div>
                <footer id="care-footer">
                    <button id="btn-pk"><span>💊 Painkillers</span><small id="pk-sub"></small></button>
                    <button id="btn-all"><span>🩹 Obati Semua</span><small id="all-sub"></small></button>
                    <button id="btn-tf" class="blood"><span>🩸 Transfusi</span><small id="tf-sub"></small></button>
                    <button id="btn-rev" class="revive"><span>❤️ Revive</span><small id="rev-sub"></small></button>
                </footer>
            </div>
        </div>
    </div>
</div>
<!-- Apotek: warga memesan / petugas EMS menyerahkan -->
<div id="pharmacy" class="hidden">
    <div class="panel ph-panel">
        <header>
            <div class="brand">
                <span class="logo"><svg class="ic"><use href="#i-pill"/></svg></span>
                <div><h1 id="ph-title">Apotek</h1><small id="ph-sub"></small></div>
            </div>
            <button class="icon-btn" id="ph-close" title="Tutup (ESC)"><svg class="ic"><use href="#i-x"/></svg></button>
        </header>
        <div class="ph-body" id="ph-body"></div>
        <footer class="ph-foot hidden" id="ph-foot"></footer>
    </div>
</div>
<!-- Panel Operasi (Dokter) -->
<div id="surgery" class="hidden">
    <div class="panel sr-panel">
        <header>
            <div class="brand">
                <span class="logo"><svg class="ic"><use href="#i-cross"/></svg></span>
                <div><h1>Operasi</h1><small id="sr-sub"></small></div>
            </div>
            <button class="icon-btn" id="sr-close" title="Tutup (ESC)"><svg class="ic"><use href="#i-x"/></svg></button>
        </header>
        <div class="sr-main">
            <div class="sr-side" id="sr-side"></div>
            <div class="sr-steps" id="sr-steps"></div>
        </div>
    </div>
</div>
<!-- Kasir: pasien membayar tagihan / petugas EMS (approval, belum dibayar, stok, supplier, harga, pengaturan) -->
<div id="kasir" class="hidden">
    <div class="panel ks-panel">
        <header>
            <div class="brand">
                <span class="logo"><svg class="ic"><use href="#i-receipt"/></svg></span>
                <div><h1 id="ks-title">Kasir</h1><small id="ks-sub"></small></div>
            </div>
            <button class="icon-btn" id="ks-close" title="Tutup (ESC)"><svg class="ic"><use href="#i-x"/></svg></button>
        </header>
        <div class="ks-tabs" id="ks-tabs"></div>
        <div class="ks-body" id="ks-body"></div>
    </div>
</div>
<script src="app.js"></script>
<script src="pharmacy.js"></script>
<script src="surgery.js"></script>
<script src="kasir.js"></script>
</body>
</html>
