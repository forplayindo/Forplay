<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>f_cityhall</title>
    <link rel="preload" href="ui/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="ui/fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="ui/fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="ui/ios.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute">
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
        <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/></symbol>
        <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></symbol>
        <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
        <symbol id="i-id" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2.5"/><path d="M14 10h4M14 14h3"/></symbol>
        <symbol id="i-car" viewBox="0 0 24 24"><path d="M3 13l2-5a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 8l2 5v4H3z"/><path d="M5 17v2M19 17v2"/><circle cx="7.5" cy="13.5" r="1"/><circle cx="16.5" cy="13.5" r="1"/></symbol>
        <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
        <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol>
        <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13h5l2 3h4l2-3h5"/><path d="M5 5h14l2 8v6H3v-6z"/></symbol>
        <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
        <symbol id="i-cash" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></symbol>
        <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></symbol>
        <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M2 21h20M8 8h3M8 12h3M8 16h3"/></symbol>
        <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/></symbol>
        <symbol id="i-truck" viewBox="0 0 24 24"><path d="M2 6h11v10H2zM13 10h4l4 3v3h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
        <symbol id="i-bus" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="14" rx="2"/><path d="M4 11h16M7 17v3M17 17v3"/><circle cx="8" cy="14" r=".5"/><circle cx="16" cy="14" r=".5"/></symbol>
        <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3z"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
        <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></symbol>
        <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
        <symbol id="i-call" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></symbol>
    </svg>

    <!-- LAYANAN WARGA -->
    <div id="services" class="panel hidden">
        <aside class="sidebar">
            <div class="brand"><span class="app-ic" id="s-logo"><svg class="ic"><use href="#i-home"/></svg></span><div><h1 id="s-title">Layanan</h1><small id="s-sub"></small></div></div>
            <nav class="nav" id="s-tabs">
                <button data-tab="all" class="active"><svg class="ic"><use href="#i-grid"/></svg>Semua</button>
                <button data-tab="license"><svg class="ic"><use href="#i-id"/></svg>Dokumen</button>
                <button data-tab="vehicle"><svg class="ic"><use href="#i-car"/></svg>Kendaraan</button>
                <button data-tab="redeem" class="hidden"><svg class="ic"><use href="#i-shield"/></svg>Penebusan</button>
                <button data-tab="company" class="hidden"><svg class="ic"><use href="#i-building"/></svg>Pajak Perusahaan</button>
            </nav>
        </aside>

        <section class="detail">
            <div class="detail-h">
                <div><div class="lt" id="s-head">Semua Layanan</div><small id="s-count"></small></div>
                <div class="spacer"></div>
                <button class="circle" data-close title="Tutup"><svg class="ic"><use href="#i-x"/></svg></button>
            </div>
            <div id="s-banner" class="notice hidden"></div>
            <main id="grid" class="cards"></main>

            <!-- tab Pajak Perusahaan (f_tax) -->
            <section id="c-view" class="pane hidden"><div class="pane-body" id="c-body"></div></section>
        </section>

        <aside id="cart" class="inspector">
            <div class="insp-h"><h2>Keranjang</h2><span id="cart-count" class="bubble hidden">0</span></div>
            <div id="cart-list" class="cart-list"></div>
            <div class="cart-foot">
                <div class="group plain"><div class="row total-row"><span class="t">Total</span><strong id="cart-total">Rp 0</strong></div></div>
                <div>
                    <div class="group-h">Bayar dengan</div>
                    <div class="seg methods">
                        <button data-method="cash" class="active"><svg class="ic"><use href="#i-cash"/></svg>Cash</button>
                        <button data-method="transfer"><svg class="ic"><use href="#i-phone"/></svg>Transfer</button>
                    </div>
                </div>
                <div id="cart-msg" class="msg hidden"></div>
                <button id="order-btn" class="b b-filled b-lg b-block">Ajukan &amp; Bayar</button>
                <div class="foot-note">Diproses petugas di loket</div>
            </div>
        </aside>
    </div>

    <!-- CARI PEKERJAAN (zona sendiri) -->
    <div id="jobs" class="panel jobsheet hidden">
        <div class="detail-h">
            <span class="app-ic"><svg class="ic"><use href="#i-briefcase"/></svg></span>
            <div><div class="lt">Cari Pekerjaan</div><small id="j-sub"></small></div>
            <div class="spacer"></div>
            <button class="circle" data-close title="Tutup"><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
        <div class="jobs-body">
            <div class="group-h">Lowongan tersedia</div>
            <div class="group job-list" id="j-list"></div>
        </div>
        <div class="jobs-foot">
            <div id="j-msg" class="msg hidden"></div>
            <button id="j-apply" class="b b-filled b-lg b-block" disabled>Pilih pekerjaan</button>
        </div>
    </div>

    <!-- MEJA PETUGAS -->
    <div id="staff" class="panel hidden">
        <aside class="sidebar">
            <div class="brand"><span class="app-ic"><svg class="ic"><use href="#i-folder"/></svg></span><div><h1 id="t-title">Meja Petugas</h1><small>Administrasi</small></div></div>
            <nav class="nav" id="t-tabs">
                <button data-tab="requests" class="active"><svg class="ic"><use href="#i-inbox"/></svg>Permohonan<span id="t-count" class="bubble hidden">0</span></button>
                <button data-tab="tickets" id="t-tickets-tab" class="hidden"><svg class="ic"><use href="#i-shield"/></svg>Tilang</button>
                <button data-tab="prices" id="t-prices-tab" class="hidden"><svg class="ic"><use href="#i-tag"/></svg>Atur Harga</button>
            </nav>
            <div class="side-foot"><button class="b b-red-tint b-block hidden" id="t-duty">Selesai Bertugas</button></div>
        </aside>

        <section class="detail">
            <div class="detail-h">
                <div><div class="lt" id="t-head">Permohonan</div><small id="t-sub"></small></div>
                <div class="spacer"></div>
                <button class="circle" id="t-refresh" title="Refresh"><svg class="ic"><use href="#i-refresh"/></svg></button>
                <button class="circle" data-close title="Tutup"><svg class="ic"><use href="#i-x"/></svg></button>
            </div>
            <main id="t-list" class="requests"></main>
            <section id="t-tickets" class="tickets hidden">
                <nav class="filters" id="k-filters">
                    <button data-filter="all" class="active">Semua</button>
                    <button data-filter="sim">SIM belum diambil</button>
                    <button data-filter="stnk">STNK belum diambil</button>
                    <button data-filter="vehicle">Kendaraan belum diambil</button>
                    <button data-filter="fine">Belum bayar denda</button>
                </nav>
                <main id="k-list" class="requests"></main>
            </section>
            <main id="t-prices" class="prices hidden"></main>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
