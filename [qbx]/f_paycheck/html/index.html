<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>f_paycheck</title>
    <link rel="stylesheet" href="ui/ios.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute">
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
        <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M16 13.5h2"/></symbol>
        <symbol id="i-cash" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></symbol>
        <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></symbol>
    </svg>

    <div id="panel" class="panel hidden">
        <header>
            <div class="brand"><span class="logo"><svg class="ic"><use href="#i-wallet"/></svg></span><div><h1>Paycheck</h1><small id="sub">ATM</small></div></div>
            <div class="head-actions"><button class="circle close" id="close"><svg class="ic"><use href="#i-x"/></svg></button></div>
        </header>

        <section class="body">
            <div class="hero">
                <small>Diterima setelah pajak</small>
                <strong id="net">Rp 0</strong>
            </div>

            <div class="group">
                <div class="row"><span class="t">Total paycheck</span><span class="d" id="gross">Rp 0</span></div>
                <div class="row"><span class="t">Potongan pajak (<i id="rate">5</i>%)</span><span class="d t-red" id="tax">- Rp 0</span></div>
                <div class="row sum"><span class="t">Bisa ditarik</span><b class="num" id="net2">Rp 0</b></div>
            </div>

            <div id="empty" class="empty hidden">Belum ada paycheck tersimpan.<small>Gaji masuk otomatis selama kamu bekerja.</small></div>

            <div>
                <div class="group-h">Ambil ke</div>
                <div class="methods">
                    <button data-method="cash" class="active"><svg class="ic"><use href="#i-cash"/></svg>Cash</button>
                    <button data-method="bank"><svg class="ic"><use href="#i-phone"/></svg>Transfer</button>
                </div>
            </div>
            <div id="msg" class="msg hidden"></div>
            <button id="withdraw" class="primary b-lg">Ambil Uang</button>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
