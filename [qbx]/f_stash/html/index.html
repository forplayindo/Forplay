<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>f_stash</title>
    <link rel="stylesheet" href="ui/ios.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute">
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
        <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    </svg>
    <div id="panel" class="panel hidden">
        <header>
            <div class="brand"><span class="logo"><svg class="ic"><use href="#i-box"/></svg></span><div><h1>Kelola Stash</h1><small id="sub"></small></div></div>
            <div class="head-actions">
                <button class="b b-filled b-sm" id="add-btn"><svg class="ic"><use href="#i-plus"/></svg>Tambah di Posisi Saya</button>
                <button class="circle close" data-close><svg class="ic"><use href="#i-x"/></svg></button>
            </div>
        </header>

        <div class="toolbar">
            <nav class="tabs" id="tabs">
                <button data-tab="all" class="active">Semua</button>
                <button data-tab="job">Job</button>
                <button data-tab="gang">Gang</button>
                <button data-tab="public">Umum</button>
            </nav>
            <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="search" placeholder="Cari nama stash / job / gang"></label>
        </div>
        <div id="msg" class="banner hidden"></div>
        <main id="list" class="list"></main>

        <aside id="sheet" class="sheet hidden">
            <div class="sheet-head"><h2 id="sheet-title">Tambah Stash</h2><button class="circle" id="sheet-close"><svg class="ic"><use href="#i-x"/></svg></button></div>
            <div class="sheet-body">
                <div id="loc-note" class="notice"></div>

                <label>Nama stash</label>
                <input id="f-label" maxlength="40" placeholder="Contoh: Gudang Ballas">

                <label>Pemilik</label>
                <div class="seg" id="f-gtype">
                    <button data-v="job" class="active">Job</button>
                    <button data-v="gang">Gang</button>
                    <button data-v="public">Umum</button>
                </div>
                <select id="f-group"></select>
                <small class="hint hidden" id="public-hint">Semua warga bisa membuka. Pakai Personal agar tiap warga punya isi sendiri (Bersama = siapa saja bisa ambil semua barang).</small>

                <label>Akses</label>
                <div class="seg" id="f-personal">
                    <button data-v="0" class="active">Bersama</button>
                    <button data-v="1">Personal</button>
                </div>
                <small class="hint" id="personal-hint">Bersama: satu isi untuk semua anggota. Personal: tiap anggota punya isi sendiri.</small>

                <div id="grade-box">
                    <label>Grade minimal</label>
                    <div class="seg grades" id="f-grade"></div>
                    <small class="hint" id="grade-hint"></small>
                </div>

                <div id="duty-row" class="check">
                    <input type="checkbox" id="f-duty"><label for="f-duty">Wajib on duty</label>
                </div>

                <div class="two">
                    <div><label>Berat maks (kg)</label><input id="f-weight" type="number" min="1"></div>
                    <div><label>Jumlah slot</label><input id="f-slots" type="number" min="1"></div>
                </div>
            </div>
            <div class="sheet-foot">
                <div id="sheet-msg" class="msg hidden"></div>
                <button id="save-btn" class="primary b-lg">Simpan</button>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
