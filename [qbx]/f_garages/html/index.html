<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>f_garages</title>
    <link rel="stylesheet" href="ui/ios.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute">
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
        <symbol id="i-parking" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9.5 17V7h3.5a3 3 0 0 1 0 6H9.5"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    </svg>
    <div id="panel" class="panel hidden">
        <header>
            <div class="brand"><span class="logo"><svg class="ic"><use href="#i-parking"/></svg></span><div><h1>Kelola Garasi</h1><small id="sub"></small></div></div>
            <div class="head-actions">
                <button class="b b-filled b-sm" id="add-btn"><svg class="ic"><use href="#i-plus"/></svg>Garasi Baru</button>
                <button class="circle close" data-close><svg class="ic"><use href="#i-x"/></svg></button>
            </div>
        </header>

        <div class="toolbar">
            <nav class="tabs" id="tabs">
                <button data-tab="all" class="active">Semua</button>
                <button data-tab="editor">Buatan Editor</button>
                <button data-tab="builtin">Bawaan</button>
            </nav>
            <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="search" placeholder="Cari nama garasi / job / gang"></label>
        </div>
        <div id="msg" class="banner hidden"></div>
        <main id="list" class="list"></main>

        <aside id="sheet" class="sheet hidden">
            <div class="sheet-head"><h2 id="sheet-title">Garasi Baru</h2><button class="circle" id="sheet-close"><svg class="ic"><use href="#i-x"/></svg></button></div>
            <div class="sheet-body">
                <label>Nama garasi</label>
                <input id="f-label" maxlength="40" placeholder="Contoh: Parkiran Mirror Park">

                <label>Jenis kendaraan</label>
                <div class="seg" id="f-vtype">
                    <button data-v="car" class="active">Mobil</button>
                    <button data-v="air">Udara</button>
                    <button data-v="sea">Laut</button>
                </div>

                <label>Fungsi</label>
                <div class="seg" id="f-depot">
                    <button data-v="0" class="active">Garasi</button>
                    <button data-v="1">Tempat Sitaan</button>
                </div>
                <small class="hint" id="depot-hint">Garasi: parkir & ambil kendaraan sendiri.</small>

                <label>Pemilik</label>
                <div class="seg" id="f-gtype">
                    <button data-v="public" class="active">Umum</button>
                    <button data-v="job">Job</button>
                    <button data-v="gang">Gang</button>
                </div>
                <select id="f-group" class="hidden"></select>
                <div id="grade-box" class="hidden">
                    <label>Grade minimal</label>
                    <div class="seg grades" id="f-grade"></div>
                </div>
                <div id="shared-row" class="check hidden">
                    <input type="checkbox" id="f-shared"><label for="f-shared">Kendaraan bersama (semua anggota bisa ambil semua kendaraan)</label>
                </div>

                <label>Tinggi zona (meter)</label>
                <input id="f-height" type="number" min="2" max="40" step="0.5">

                <div class="mark">
                    <div><b>Area garasi</b><small id="area-info">Belum ditandai</small></div>
                    <button class="cap tint" id="mark-area">Tandai Area</button>
                </div>
                <div class="mark">
                    <div><b>Titik keluar kendaraan</b><small id="spawn-info">Belum ditandai</small></div>
                    <button class="cap tint" id="mark-spawn">Tandai Titik Keluar</button>
                </div>
                <div class="notice">Area: jalan ke tiap sudut lalu tekan <b>E</b>, atau bidik dan <b>klik kiri</b>. Titik keluar: parkir kendaraan menghadap arah keluar lalu tekan <b>G</b>.</div>
            </div>
            <div class="sheet-foot">
                <div id="sheet-msg" class="msg hidden"></div>
                <button id="save-btn" class="primary b-lg">Simpan &amp; Aktifkan</button>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
