<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }
	html, body { width: 512px; height: 300px; overflow: hidden; background: transparent; }
	body { font-family: 'Segoe UI', Arial, sans-serif; color: #c8fbff; }

	.panel {
		position: absolute; inset: 10px;
		border: 2px solid rgba(80, 230, 255, 0.85);
		border-radius: 14px;
		background:
			repeating-linear-gradient(0deg, rgba(120, 240, 255, 0.07) 0 2px, transparent 2px 5px),
			linear-gradient(160deg, rgba(10, 60, 80, 0.78), rgba(5, 25, 40, 0.86));
		padding: 18px 26px;
		display: flex; flex-direction: column; gap: 10px;
	}
	.panel.warn { border-color: rgba(255, 107, 107, 0.9); }

	.head { display: flex; justify-content: space-between; align-items: center;
		font-size: 17px; letter-spacing: 3px; color: rgba(140, 240, 255, 0.75); font-weight: 600; }
	.status { color: #ffd84a; letter-spacing: 2px; }
	.status.done { color: #6dff9e; }
	.status.warn { color: #ff6b6b; }

	.gate { font-size: 20px; font-weight: 600; color: #ffffff; letter-spacing: 1px;
		white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

	.row { display: flex; justify-content: space-between; align-items: baseline; }
	.label { font-size: 21px; letter-spacing: 2px; color: rgba(160, 235, 245, 0.8); }
	.value { font-size: 38px; font-weight: 700; color: #ffffff; font-variant-numeric: tabular-nums; }
	.value.money { color: #7dffb0; }
	.value.minus { color: #ffd84a; }

	.note { margin-top: auto; font-size: 16px; letter-spacing: 1px; color: rgba(160, 235, 245, 0.75);
		white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
	<div class="panel" id="panel">
		<div class="head"><span>E-TOLL</span><span class="status" id="status"></span></div>
		<div class="gate" id="gate"></div>
		<div id="rows"></div>
		<div class="note" id="note"></div>
	</div>

<script>
	const $ = (id) => document.getElementById(id);
	const rp = (n) => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');

	// { status, state: 'done'|'warn', gate, note, rows: [{ label, value, kind: 'money'|'minus' }] }
	window.addEventListener('message', (event) => {
		let d = event.data;
		if (typeof d === 'string') { try { d = JSON.parse(d); } catch { return; } }
		if (!d) return;

		const status = $('status');
		status.textContent = d.status || '';
		status.className = 'status' + (d.state === 'done' ? ' done' : d.state === 'warn' ? ' warn' : '');
		$('panel').className = 'panel' + (d.state === 'warn' ? ' warn' : '');
		$('gate').textContent = d.gate || '';
		$('note').textContent = d.note || '';

		const rows = $('rows');
		rows.innerHTML = '';
		(d.rows || []).forEach((r) => {
			const row = document.createElement('div');
			row.className = 'row';
			const label = document.createElement('span');
			label.className = 'label';
			label.textContent = r.label;
			const value = document.createElement('span');
			value.className = 'value' + (r.kind ? ' ' + r.kind : '');
			value.textContent = rp(r.value);
			row.append(label, value);
			rows.appendChild(row);
		});
	});
</script>
</body>
</html>
