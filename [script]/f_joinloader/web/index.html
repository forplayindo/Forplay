<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
    }

    #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #fff;
        /* tanpa blur / gelap: dunia tetap terlihat, teks dibantu bayangan supaya terbaca */
        text-shadow: 0 2px 6px rgba(0, 0, 0, .85), 0 0 18px rgba(0, 0, 0, .6);
        opacity: 0;
        transition: opacity .4s ease;
        pointer-events: none;
    }
    #loader.show { opacity: 1; }

    #count {
        font-size: 96px;
        font-weight: 800;
        line-height: 1;
        font-variant-numeric: tabular-nums;
    }
    #count.pop { animation: pop .35s ease-out; }
    @keyframes pop {
        from { transform: scale(1.25); opacity: .6; }
        to   { transform: scale(1);    opacity: 1; }
    }

    #title {
        margin-top: 10px;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
    }

    #desc {
        margin-top: 8px;
        max-width: 520px;
        font-size: 16px;
        line-height: 1.5;
        opacity: .9;
    }
</style>
</head>
<body>
<div id="loader">
    <div id="count"></div>
    <div id="title"></div>
    <div id="desc"></div>
</div>
<script>
    const loader = document.getElementById('loader');
    const count = document.getElementById('count');
    const title = document.getElementById('title');
    const desc = document.getElementById('desc');

    function setCount(text) {
        count.textContent = text;
        count.classList.remove('pop');
        void count.offsetWidth; // restart animasi
        count.classList.add('pop');
    }

    window.addEventListener('message', (e) => {
        const { action, data } = e.data || {};
        if (action === 'show') {
            title.textContent = data.title;
            desc.textContent = data.description;
            setCount(data.seconds);
            loader.classList.add('show');
        } else if (action === 'tick') {
            setCount(data);
        } else if (action === 'finishing') {
            count.textContent = '';
            title.textContent = data;
        } else if (action === 'hide') {
            loader.classList.remove('show');
        }
    });
</script>
</body>
</html>
