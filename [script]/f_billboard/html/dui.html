<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #m { display: block; width: 100%; height: 100%; border: 0; }
    #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
           color: #888; font: 600 36px sans-serif; }
</style>
</head>
<body>
<div id="err">Media gagal dimuat</div>
<script>
(function () {
    // Layar billboard (DUI). Parameter: t = image|video|youtube, s = URL / ID YouTube, f = object-fit
    const p = new URLSearchParams(location.search);
    const type = p.get('t');
    const src = p.get('s') || '';
    const fit = ['cover', 'contain', 'fill'].includes(p.get('f')) ? p.get('f') : 'cover';
    const showError = () => { document.getElementById('err').style.display = 'flex'; };
    // URL online, atau file lokal di folder html/images (relatif ke halaman ini)
    const validSrc = /^https?:\/\//.test(src) || /^images\/[\w-]+\.\w+$/.test(src);

    let el;
    if (type === 'image' && validSrc) {
        el = document.createElement('img');
        el.src = src;
    } else if (type === 'video' && validSrc) {
        el = document.createElement('video');
        el.muted = true; // tanpa suara
        el.autoplay = true;
        el.loop = true;
        el.playsInline = true;
        el.src = src;
    } else if (type === 'youtube' && /^[\w-]{11}$/.test(src)) {
        el = document.createElement('iframe');
        el.allow = 'autoplay; encrypted-media';
        el.referrerPolicy = 'strict-origin-when-cross-origin';
        el.src = 'https://www.youtube.com/embed/' + src + '?autoplay=1&mute=1&loop=1&playlist=' + src +
            '&controls=0&disablekb=1&fs=0&iv_load_policy=3&modestbranding=1&rel=0&playsinline=1';
    }

    if (!el) return showError();
    el.id = 'm';
    el.style.objectFit = fit;
    el.onerror = showError;
    document.body.appendChild(el);
})();
</script>
</body>
</html>
