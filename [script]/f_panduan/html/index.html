<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>f_panduan</title>
    <link rel="stylesheet" href="ui/ios.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute">
        <symbol id="i-tree" viewBox="0 0 24 24"><path d="M12 2 5 12h4l-3 5h12l-3-5h4zM12 17v5"/></symbol>
        <symbol id="i-pick" viewBox="0 0 24 24"><path d="M14 4c3 0 6 2 7 5-3-1-6-1-8 0M14 4l-11 11 3 3 11-11M14 4c-1 2-1 4 0 6"/></symbol>
        <symbol id="i-fish" viewBox="0 0 24 24"><path d="M3 12c3-5 9-6 14-3l4-3v12l-4-3c-5 3-11 2-14-3zM15 11h.01"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
        <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
        <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 2 20h20zM12 10v4M12 17h.01"/></symbol>
    </svg>

    <div id="flow" class="panel flow hidden">
        <header>
            <div class="brand"><span class="logo"><svg class="ic"><use id="f-icon" href="#i-tree"/></svg></span><div><h1 id="f-title">Alur Kerja</h1><small>Baca sebentar sebelum mulai bekerja</small></div></div>
            <div class="head-actions"><button class="circle close" id="f-close"><svg class="ic"><use href="#i-x"/></svg></button></div>
        </header>
        <div class="tabs hidden" id="f-tabs"></div>
        <section class="body">
            <div class="steps" id="f-steps"></div>
            <div class="rules" id="f-rules"></div>
            <div class="last hidden" id="f-last">Ini terakhir kali panel ini muncul otomatis. Buka lagi kapan saja dengan <b>F7</b> atau ketik <b>/panduan</b>.</div>
        </section>
        <div class="flow-foot">
            <label><input type="checkbox" id="f-mute">Jangan tampilkan otomatis lagi</label>
            <button class="primary b-lg" id="f-ok">Mengerti</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
