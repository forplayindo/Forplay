<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       ILLENIUM APPEARANCE - CUSTOM ARC UI
       Warna aksen: ubah --accent di bawah.
       ============================================================ */
    :root {
      --accent: #F3B354;
      --accent-dim: rgba(243, 179, 84, .38);
      --accent-soft: rgba(243, 179, 84, .12);
      --panel: rgba(12, 12, 12, .60);
      --panel-solid: rgba(18, 18, 18, .92);
      --panel-line: rgba(255, 255, 255, .09);
      --text: #f2f2f2;
      --text-dim: rgba(240, 240, 240, .50);
      --text-faint: rgba(240, 240, 240, .30);
      --ui-scale: 1;
      --radius: 5px;
      --font: 'Rajdhani', 'Inter', system-ui, sans-serif;
      --font-ui: 'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden; background: transparent;
      font-family: var(--font-ui); color: var(--text); user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    #app { position: fixed; inset: 0; display: none; zoom: var(--ui-scale); }
    #app.visible { display: block; }

    /* ---------- HEADER ---------- */
    .header { position: absolute; top: 2.2vh; left: 2vw; display: flex; align-items: center; gap: .9vw; }
    .header .badge {
      width: 3.4vh; height: 3.4vh; border-radius: var(--radius);
      background: var(--accent); display: grid; place-items: center; flex: none;
    }
    .header .badge svg { width: 62%; height: 62%; fill: #111; }
    .header .kicker {
      font-size: .95vh; font-weight: 700; letter-spacing: .42em;
      color: var(--accent); text-transform: uppercase; margin-bottom: .2vh;
    }
    .header .title {
      font-family: var(--font); font-size: 3.1vh; font-weight: 700;
      letter-spacing: .06em; line-height: .95; text-transform: uppercase;
    }
    .header .sub { font-size: 1.05vh; color: var(--text-dim); margin-top: .35vh; letter-spacing: .06em; }

    /* ---------- TABS ---------- */
    .tabs { position: absolute; top: 9.6vh; left: 2vw; display: flex; flex-wrap: wrap; gap: .6vh; max-width: 26vw; }
    .tab {
      display: flex; align-items: center; gap: .5vw; padding: .75vh 1.1vh;
      border-radius: var(--radius); background: var(--panel); border: 1px solid var(--panel-line);
      font-size: 1.05vh; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
      color: var(--text-dim); cursor: pointer; transition: all .14s ease;
    }
    .tab svg { width: 1.35vh; height: 1.35vh; fill: currentColor; }
    .tab:hover { color: var(--text); border-color: var(--accent-dim); }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #111; box-shadow: 0 0 2.4vh var(--accent-soft); }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      position: absolute; top: 15.5vh; left: 2vw; width: 24vw;
      max-height: 66vh; overflow-y: auto; overflow-x: hidden; padding-right: .4vw;
      scrollbar-width: thin; scrollbar-color: var(--accent-dim) transparent;
    }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 3px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }

    .group-label {
      font-size: .95vh; font-weight: 700; letter-spacing: .34em; color: var(--text-faint);
      text-transform: uppercase; margin: 1.6vh 0 .7vh .3vw;
    }
    .group-label:first-child { margin-top: 0; }

    .row {
      display: flex; align-items: center; gap: .85vw; padding: .9vh 1vh; margin-bottom: .45vh;
      background: var(--panel); border: 1px solid var(--panel-line); border-radius: var(--radius);
      cursor: pointer; transition: border-color .14s ease, background .14s ease;
    }
    .row:hover { border-color: rgba(255,255,255,.22); }
    .row.active {
      border-color: var(--accent);
      background: linear-gradient(90deg, rgba(243,179,84,.14), var(--panel) 60%);
    }
    .row .ico { width: 1.7vh; flex: none; display: grid; place-items: center; }
    .row .ico svg { width: 1.6vh; height: 1.6vh; fill: var(--text-dim); }
    .row.active .ico svg { fill: var(--accent); }
    .row .txt { flex: 1; min-width: 0; }
    .row .name {
      font-family: var(--font); font-size: 1.55vh; font-weight: 600; letter-spacing: .03em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row .val {
      font-size: 1.02vh; color: var(--text-faint); margin-top: .1vh; letter-spacing: .05em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row.active .val { color: var(--accent); opacity: .8; }

    /* ---------- ARC ---------- */
    .arc { position: absolute; top: 50%; right: 16vw; transform: translateY(-50%); width: 24vw; height: 66vh; }
    .arc svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .arc-lbl {
      position: absolute; font-family: var(--font); font-weight: 600; letter-spacing: .04em;
      white-space: nowrap; cursor: pointer; transform: translate(-100%, -50%);
      transition: color .16s ease;
    }
    .arc-lbl.sel { color: var(--accent); text-shadow: 0 0 1.8vh rgba(243,179,84,.5); }
    .arc-lbl:not(.sel):hover { color: #fff; }
    .arc-sw {
      position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
      border: 1px solid rgba(255,255,255,.35); pointer-events: none;
    }

    /* ---------- RIGHT PANEL ---------- */
    .rightcol {
      position: absolute; top: 50%; right: 2vw; transform: translateY(-50%);
      width: 13.5vw; display: flex; flex-direction: column; align-items: stretch; gap: .7vh;
      max-height: 92vh;
    }

    .rpanel {
      width: 100%; display: flex; flex-direction: column; align-items: center;
      padding: 1.8vh 1.1vh 1.1vh; gap: .9vh;
      background: var(--panel); border: 1px solid var(--panel-line);
      border-radius: var(--radius);
    }
    .rp-circle {
      width: 4.4vh; height: 4.4vh; border-radius: 50%;
      background: rgba(243,179,84,.10); border: 1px solid var(--accent-dim);
      display: grid; place-items: center; box-shadow: 0 0 2.8vh var(--accent-soft);
    }
    .rp-circle svg { width: 48%; height: 48%; fill: var(--accent); }
    .rp-title {
      font-family: var(--font); font-size: 2.1vh; font-weight: 700;
      letter-spacing: .26em; text-transform: uppercase; text-align: center;
      line-height: 1.1; word-break: break-word;
    }
    .rp-props { width: 100%; display: flex; flex-direction: column; gap: .45vh; margin-top: .3vh; }
    .rp-box {
      width: 100%; padding: .6vh .7vh .75vh; border-radius: var(--radius);
      border: 1px solid transparent; text-align: center; cursor: pointer;
      transition: all .14s ease;
    }
    .rp-box:hover { background: rgba(255,255,255,.05); }
    .rp-box.active {
      background: var(--accent-soft); border-color: var(--accent-dim);
      box-shadow: 0 0 2vh rgba(243,179,84,.10);
    }
    .rp-label {
      font-size: .88vh; font-weight: 700; letter-spacing: .26em; text-transform: uppercase;
      color: var(--text-faint); margin-bottom: .3vh;
    }
    .rp-box.active .rp-label { color: var(--text-dim); }
    .rp-line { display: flex; align-items: baseline; justify-content: center; gap: .4vw; }
    .rp-val {
      font-family: var(--font); font-size: 1.75vh; font-weight: 700; color: var(--text-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 9.5vw;
    }
    .rp-box.active .rp-val { color: var(--accent); font-size: 2.1vh; }
    .rp-count { font-size: .85vh; color: var(--text-faint); flex: none; }
    .rp-swatch {
      width: 1.5vh; height: 1.5vh; border-radius: 50%; border: 1px solid rgba(255,255,255,.3);
      display: inline-block; vertical-align: middle;
    }

    .rp-price {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: .5vh .6vh; margin-top: .3vh; border-radius: 3px;
      background: rgba(255,255,255,.05); font-size: 1vh;
    }
    .rp-price .k {
      font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--text-faint);
    }
    .rp-price .v { font-family: var(--font); font-size: 1.5vh; font-weight: 700; color: var(--accent); }
    .rp-price.total { background: rgba(243,179,84,.10); border: 1px solid var(--accent-dim); }

    .rp-empty {
      font-size: 1.1vh; color: var(--text-faint); text-align: center; padding: 1vh .5vh;
    }
    .rp-action {
      width: 100%; margin-top: .3vh; padding: .75vh; border-radius: var(--radius);
      background: var(--accent); color: #111; border: none; cursor: pointer;
      font-family: var(--font-ui); font-size: 1vh; font-weight: 700;
      letter-spacing: .2em; text-transform: uppercase; transition: filter .13s ease;
    }
    .rp-action:hover { filter: brightness(1.12); }
    .rp-action.ghost { background: rgba(255,255,255,.07); color: var(--text-dim); }
    .rp-action.ghost:hover { background: rgba(255,80,80,.16); color: #ff7b7b; filter: none; }
    .rp-applied {
      width: 100%; max-height: 13vh; overflow-y: auto; margin-top: .5vh;
      display: flex; flex-direction: column; gap: .25vh;
      scrollbar-width: thin; scrollbar-color: var(--accent-dim) transparent;
    }
    .rp-applied::-webkit-scrollbar { width: 3px; }
    .rp-applied::-webkit-scrollbar-thumb { background: var(--accent-dim); }
    .rp-chip {
      display: flex; align-items: center; justify-content: space-between; gap: .3vw;
      padding: .4vh .6vh; border-radius: 3px; background: rgba(243,179,84,.10);
      border: 1px solid var(--accent-dim); cursor: pointer; font-size: 1vh; color: var(--accent);
      text-align: left;
    }
    .rp-chip:hover { background: rgba(255,80,80,.14); border-color: rgba(255,80,80,.4); color: #ff7b7b; }
    .rp-chip span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rp-chip .x { flex: none; font-weight: 700; }

    .rp-hints { width: 100%; display: flex; flex-direction: column; gap: .35vh; margin-top: .5vh; }
    .rp-hint { display: flex; align-items: center; justify-content: space-between; gap: .4vw; }
    .rp-hint .key {
      font-size: .82vh; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      color: var(--text-dim); background: rgba(255,255,255,.07);
      padding: .35vh .5vh; border-radius: 3px; white-space: nowrap;
    }
    .rp-hint .act {
      font-size: .82vh; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
      color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ---------- TATTOO PANEL ---------- */
    .tattoo {
      position: absolute; top: 15.5vh; right: 2vw; width: 26vw; max-height: 64vh;
      overflow-y: auto; padding: 1.2vh; background: var(--panel);
      border: 1px solid var(--panel-line); border-radius: var(--radius);
      scrollbar-width: thin; scrollbar-color: var(--accent-dim) transparent;
    }
    .tattoo::-webkit-scrollbar { width: 3px; }
    .tattoo::-webkit-scrollbar-thumb { background: var(--accent-dim); }
    .tattoo h4 {
      font-size: .95vh; font-weight: 700; letter-spacing: .3em; text-transform: uppercase;
      color: var(--text-faint); margin: 1vh 0 .8vh;
    }
    .tattoo h4:first-child { margin-top: 0; }
    .tat-item {
      display: flex; align-items: center; justify-content: space-between; gap: .6vw;
      padding: .7vh .9vh; margin-bottom: .35vh; border-radius: 3px;
      background: rgba(0,0,0,.4); border: 1px solid transparent; cursor: pointer; font-size: 1.25vh;
    }
    .tat-item:hover { border-color: var(--accent-dim); background: rgba(243,179,84,.08); }
    .tat-item.on { border-color: var(--accent); color: var(--accent); }
    .tat-item .act {
      font-size: .9vh; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      padding: .3vh .6vh; border-radius: 2px; background: rgba(243,179,84,.16); color: var(--accent); flex: none;
    }
    .tat-item .act.del { background: rgba(255,80,80,.16); color: #ff7b7b; }

    /* ---------- TOOLBAR ---------- */
    .toolbar {
      width: 100%; display: flex; flex-wrap: wrap; justify-content: center;
      gap: .4vh; padding: .7vh;
      background: var(--panel); border: 1px solid var(--panel-line);
      border-radius: var(--radius);
    }
    .tool {
      flex: 1 1 calc(25% - .4vh); height: 3vh; min-width: 2.6vh;
      border-radius: 3px; display: grid; place-items: center; cursor: pointer; transition: all .13s ease;
    }
    .tool svg { width: 1.6vh; height: 1.6vh; fill: var(--text-dim); transition: fill .13s ease; }
    .tool:hover { background: rgba(255,255,255,.08); }
    .tool:hover svg, .tool.active svg { fill: var(--accent); }
    .tool.active { background: rgba(243,179,84,.14); }

    /* ---------- FOOTER ---------- */
    .footer { width: 100%; display: flex; flex-direction: column; gap: .4vh; }
    .fbtn {
      display: flex; align-items: center; justify-content: center; gap: .4vw;
      cursor: pointer; padding: .85vh .6vh;
      border-radius: var(--radius); font-size: 1vh; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim);
      background: var(--panel); border: 1px solid var(--panel-line);
      white-space: nowrap; transition: all .14s ease;
    }
    .fbtn svg { width: 1.4vh; height: 1.4vh; fill: currentColor; }
    .fbtn:hover { color: #fff; border-color: var(--accent-dim); }
    .fbtn.save {
      background: var(--accent); border-color: var(--accent); color: #111;
      box-shadow: 0 0 2.6vh var(--accent-soft);
    }
    .fbtn.save:hover { color: #111; filter: brightness(1.1); }

    /* ---------- MODAL ---------- */
    .modal-bg { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: none; place-items: center; z-index: 50; }
    .modal-bg.show { display: grid; }
    .modal {
      width: 36vh; padding: 2.4vh; text-align: center;
      background: var(--panel-solid); border: 1px solid var(--accent-dim);
      border-radius: var(--radius); box-shadow: 0 0 6vh rgba(0,0,0,.6);
    }
    .modal h3 { font-family: var(--font); font-size: 2.1vh; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: .7vh; }
    .modal p { font-size: 1.25vh; color: var(--text-dim); margin-bottom: 2vh; white-space: pre-line; }
    .modal .acts { display: flex; gap: .8vh; }
    .modal button {
      flex: 1; padding: .95vh; border: 1px solid var(--panel-line); border-radius: 3px;
      background: rgba(255,255,255,.05); color: var(--text-dim);
      font-family: var(--font-ui); font-size: 1.1vh; font-weight: 700;
      letter-spacing: .16em; text-transform: uppercase; cursor: pointer; transition: all .13s ease;
    }
    .modal button:hover { background: rgba(255,255,255,.12); color: #fff; }
    .modal button.yes { background: var(--accent); border-color: var(--accent); color: #111; }
    .modal button.yes:hover { filter: brightness(1.12); color: #111; }

    .hidden { display: none !important; }
  </style>
</head>

<body>
  <div id="app">
    <div class="header">
      <div class="badge" id="hBadge"></div>
      <div>
        <div class="kicker" id="hKicker">Ped</div>
        <div class="title" id="hTitle">Model</div>
        <div class="sub" id="hSub"></div>
      </div>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="sidebar" id="sidebar"></div>
    <div class="arc" id="arc"></div>

    <div class="rightcol" id="rightcol">
      <div class="rpanel" id="rpanel">
        <div class="rp-circle" id="rpIcon"></div>
        <div class="rp-title" id="rpTitle"></div>
        <div class="rp-props" id="rpProps"></div>
        <div class="rp-hints" id="rpHints"></div>
      </div>

      <div class="toolbar" id="toolbar"></div>

      <div class="footer">
        <div class="fbtn" id="btnExit">
          <svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
          <span id="lblExit">Exit Customization</span>
        </div>
        <div class="fbtn save" id="btnSave">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9zm3 12a2 2 0 1 1 2-2 2 2 0 0 1-2 2z"/></svg>
          <span id="lblSave">Save Customization</span>
        </div>
      </div>
    </div>

    <div class="tattoo hidden" id="tattoo"></div>

    <div class="modal-bg" id="modalBg">
      <div class="modal">
        <h3 id="mTitle"></h3>
        <p id="mDesc"></p>
        <div class="acts">
          <button id="mNo"></button>
          <button class="yes" id="mYes"></button>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function () {
    "use strict";

    /* ================== NUI BRIDGE ================== */
    var RES = (function () {
      try { return GetParentResourceName(); } catch (e) { return "illenium-appearance"; }
    })();

    function nui(name, data) {
      return fetch("https://" + RES + "/" + name, {
        method: "POST",
        headers: { "Content-Type": "application/json; charset=UTF-8" },
        body: JSON.stringify(data === undefined ? {} : data)
      }).then(function (r) { return r.json(); }).catch(function () { return null; });
    }

    /* ================== ICONS ================== */
    var I = {
      ped: '<svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4 0-9 2-9 5v3h18v-3c0-3-5-5-9-5z"/></svg>',
      face: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zM8.5 9A1.5 1.5 0 1 1 7 10.5 1.5 1.5 0 0 1 8.5 9zm7 0A1.5 1.5 0 1 1 14 10.5 1.5 1.5 0 0 1 15.5 9zM12 18a5 5 0 0 1-4.6-3h9.2A5 5 0 0 1 12 18z"/></svg>',
      shirt: '<svg viewBox="0 0 24 24"><path d="M16 2l6 3-2 5-2-1v13H6V9L4 10 2 5l6-3 4 3z"/></svg>',
      tattoo: '<svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6zm0 5a3 3 0 1 1-3 3 3 3 0 0 1 3-3z"/></svg>',
      slider: '<svg viewBox="0 0 24 24"><path d="M3 7h9v2H3zm12 0h6v2h-6zM3 15h5v2H3zm8 0h10v2H11zM12 5h2v6h-2zM8 13h2v6H8z"/></svg>',
      dna: '<svg viewBox="0 0 24 24"><path d="M7 2h2c0 4 6 5 6 10s-6 6-6 10H7c0-4 6-5 6-10S7 6 7 2zm10 0h2c0 4-6 5-6 10s6 6 6 10h-2c0-4-6-5-6-10S17 6 17 2z"/></svg>',
      hair: '<svg viewBox="0 0 24 24"><path d="M12 2C7 2 4 6 4 11v9h3v-8c2 0 3-1 4-2 1 2 4 3 6 3v7h3v-9c0-5-3-9-8-9z"/></svg>',
      eye: '<svg viewBox="0 0 24 24"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 1 1 4-4 4 4 0 0 1-4 4z"/></svg>',
      brow: '<svg viewBox="0 0 24 24"><path d="M3 9c3-4 15-4 18 0l-1 2c-3-3-13-3-16 0zm2 6a7 7 0 0 0 14 0z"/></svg>',
      beard: '<svg viewBox="0 0 24 24"><path d="M6 4h12v6a6 6 0 0 1-2 4.5L12 22l-4-7.5A6 6 0 0 1 6 10z"/></svg>',
      brush: '<svg viewBox="0 0 24 24"><path d="M19 3 9 13l2 2L21 5zM7 15c-2 0-3 1.5-3 3s-1 2-2 2c1.5 1.5 3 1 4.5 1S10 19.5 10 18s-1-3-3-3z"/></svg>',
      lips: '<svg viewBox="0 0 24 24"><path d="M12 9c2-3 7-4 10-2-2 5-6 9-10 9S4 12 2 7c3-2 8-1 10 2z"/></svg>',
      star: '<svg viewBox="0 0 24 24"><path d="m12 2 2.9 6.3 6.8.8-5 4.6 1.3 6.8L12 17.2 6 20.5l1.3-6.8-5-4.6 6.8-.8z"/></svg>',
      cam: '<svg viewBox="0 0 24 24"><path d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4zm3 5a5 5 0 1 1-5 5 5 5 0 0 1 5-5z"/></svg>',
      head: '<svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v3l-2 3h3v4h5v-4h3a2 2 0 0 0 2-2V9a6 6 0 0 0-5-6z"/></svg>',
      body: '<svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 1 1-2 2 2 2 0 0 1 2-2zm-5 5h10v6h-3v9h-4v-9H7z"/></svg>',
      legs: '<svg viewBox="0 0 24 24"><path d="M8 2h8v7l-1 13h-4l-1-8-1 8H5z"/></svg>',

    /* PED_TATTOOS di Lua adalah tabel kosong saat pemain belum punya tattoo. json.encode
       mengubahnya jadi "[]", yang di JS menjadi Array. Menaruh properti bernama pada Array
       (arr["ZONE_TORSO"] = [...]) tidak error, tapi JSON.stringify MENGABAIKANNYA - jadi
       payload yang dikirim balik ke Lua kosong dan semua tattoo lenyap.
       Karena itu map tattoo selalu dinormalkan jadi objek biasa. */
    function tattooMap(src) {
      var out = {};
      if (src && typeof src === "object" && !Array.isArray(src)) {
        for (var k in src) {
          if (Object.prototype.hasOwnProperty.call(src, k)) {
            out[k] = Array.isArray(src[k]) ? src[k].slice() : [];
          }
        }
      }
      /* pastikan setiap zona yang dikenal selalu ada sebagai array */
      var items = S.settings && S.settings.tattoos && S.settings.tattoos.items;
      if (items) {
        for (var z in items) {
          if (Object.prototype.hasOwnProperty.call(items, z) && !out[z]) out[z] = [];
        }
      }
      return out;
    }

    function cloneTattoos(src) {
      var m = tattooMap(src), out = {};
      for (var k in m) {
        out[k] = m[k].map(function (t) {
          var c = {};
          for (var f in t) if (Object.prototype.hasOwnProperty.call(t, f)) c[f] = t[f];
          return c;
        });
      }
      return out;
    }

    function tattooCost(t) {
      if (!t) return 0;
      return (typeof t.cost === "number") ? t.cost : S.tatCost;
    }
    function money(n) { return "$" + String(n); }

    /* Tattoo yang ada sekarang tapi belum ada saat menu dibuka = yang akan ditagih. */
    function pendingTattoos() {
      var before = {}, added = [];
      var orig = S.origTattoos || {};
      for (var z in orig) {
        for (var i = 0; i < orig[z].length; i++) {
          var k = z + "|" + (orig[z][i].name || orig[z][i].label || "?");
          before[k] = (before[k] || 0) + 1;
        }
      }
      var cur = S.data.tattoos || {};
      for (var z2 in cur) {
        for (var j = 0; j < cur[z2].length; j++) {
          var t = cur[z2][j];
          var k2 = z2 + "|" + (t.name || t.label || "?");
          if ((before[k2] || 0) > 0) { before[k2] -= 1; }
          else { added.push(t); }
        }
      }
      return added;
    }
    function pendingTotal() {
      var list = pendingTattoos(), sum = 0;
      for (var i = 0; i < list.length; i++) sum += tattooCost(list[i]);
      return sum;
    }

    function zoneList(zone) {
      var st = S.settings.tattoos;
      return (st && st.items && st.items[zone]) || [];
    }
    function selectedTattoo(zone) {
      var list = zoneList(zone);
      if (!list.length) return null;
      var t = list[clamp(S.tatSel[zone] || 0, 0, list.length - 1)];
      var copy = {};
      for (var k in t) copy[k] = t[k];
      copy.opacity = S.tatOpacity;
      return copy;
    }
    function previewTattoo(zone) {
      var t = selectedTattoo(zone);
      if (!t) return;
      S.data.tattoos = tattooMap(S.data.tattoos);
      nui("appearance_preview_tattoo", { data: S.data.tattoos, tattoo: t });
    }
    function applyTattoo(zone) {
      var t = selectedTattoo(zone);
      if (!t) return;
      var updated = cloneTattoos(S.data.tattoos);
      if (!updated[zone]) updated[zone] = [];
      updated[zone].push(t);
      nui("appearance_apply_tattoo", { tattoo: t, updatedTattoos: updated }).then(function (ok) {
        if (ok) { S.data.tattoos = updated; renderAll(); }
      });
    }
    function removeTattoo(zone, i) {
      /* PENTING: callback Lua `appearance_delete_tattoo` meneruskan payload apa adanya ke
         client.removePedTattoo(ped, tattoos) -> setTattoos(ped, tattoos), yang meng-iterasi
         SELURUH map tattoo per zona. Jadi yang harus dikirim adalah map lengkap setelah
         penghapusan, bukan objek tattoo yang dihapus. */
      var updated = cloneTattoos(S.data.tattoos);
      if (!updated[zone] || !updated[zone].length) return;
      updated[zone].splice(i, 1);
      S.data.tattoos = updated;
      nui("appearance_delete_tattoo", updated);
      renderAll();
    }

    function changeModel(model) {
      S.data.model = model;
      nui("appearance_change_model", model).then(function (res) {
        if (res && res.appearanceSettings) {
          S.settings = res.appearanceSettings;
          S.data = res.appearanceData;
          rebuild(true);
        }
      });
    }

    /* ================== SELECTORS ================== */
    function currentTab() { return S.tabs[S.tabIndex]; }
    function flatRows() {
      var t = currentTab(), out = [];
      if (!t) return out;
      for (var g = 0; g < t.groups.length; g++) {
        for (var r = 0; r < t.groups[g].rows.length; r++) out.push(t.groups[g].rows[r]);
      }
      return out;
    }
    function currentRow() { return flatRows()[S.rowIndex] || null; }
    function currentProp() {
      var row = currentRow();
      if (!row || !row.props.length) return null;
      return row.props[clamp(S.propIndex, 0, row.props.length - 1)];
    }
    function fmtVal(p) {
      var idx = indexOfVal(p.dom, p.get());
      return p.dom.labels[idx] !== undefined ? p.dom.labels[idx] : String(p.get());
    }
    function rowSummary(row) {
      if (!row || !row.props.length) return "";
      var parts = [];
      for (var i = 0; i < row.props.length; i++) parts.push(fmtVal(row.props[i]));
      return parts.join(" · ");
    }

    /* ================== RENDER ================== */
    function renderTabs() {
      var c = $("tabs"); c.innerHTML = "";
      S.tabs.forEach(function (t, i) {
        var n = el("div", "tab" + (i === S.tabIndex ? " active" : ""), t.icon + "<span>" + t.label + "</span>");
        n.onclick = function () { selectTab(i); };
        c.appendChild(n);
      });
    }

    function renderSidebar() {
      var c = $("sidebar"); c.innerHTML = "";
      var t = currentTab(); if (!t) return;
      var counter = 0, activeNode = null;

      t.groups.forEach(function (grp) {
        c.appendChild(el("div", "group-label", grp.title));
        grp.rows.forEach(function (row) {
          var absIdx = counter++;
          var active = absIdx === S.rowIndex;
          var node = el("div", "row" + (active ? " active" : ""));
          node.appendChild(el("div", "ico", row.icon || I.slider));
          var wrap = el("div", "txt");
          wrap.appendChild(el("div", "name", row.label));
          var sum = rowSummary(row);
          if (sum) wrap.appendChild(el("div", "val", sum));
          node.appendChild(wrap);
          node.onclick = function () {
            S.rowIndex = absIdx; S.propIndex = 0;
            if (row.zone) S.tattooZone = row.zone;
            renderAll();
          };
          c.appendChild(node);
          if (active) activeNode = node;
        });
      });

      if (activeNode && activeNode.scrollIntoView) activeNode.scrollIntoView({ block: "nearest" });
    }

    /* --- busur --- */
    var ARC_SLOTS = 5;       // item terlihat di atas & bawah item terpilih
    var ARC_GAP_VH = 5.2;    // jarak vertikal antar item (vh)
    var ARC_BOW_VH = 20.0;   // kedalaman lengkungan (vh)
    var ARC_K = 0.26;        // kerapatan lengkungan
    var ARC_LBLGAP_VH = 1.4; // jarak label ke titik

    function bowAt(off) { return ARC_BOW_VH * (1 - Math.cos(off * ARC_K)); }

    function renderArc() {
      var arc = $("arc");
      arc.innerHTML = "";
      var p = currentProp();
      if (!p) return;

      var W = arc.clientWidth, H = arc.clientHeight;
      if (!W || !H) return;

      var dom = p.dom, cur = indexOfVal(dom, p.get());
      var gap = vh(ARC_GAP_VH), lblGap = vh(ARC_LBLGAP_VH);
      var maxBow = vh(bowAt(ARC_SLOTS + 1));
      var x0 = W - maxBow;

      var svgNS = "http://www.w3.org/2000/svg";
      var svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", "0 0 " + W + " " + H);

      var AC = accent();
      var defs = document.createElementNS(svgNS, "defs");
      defs.innerHTML =
        '<linearGradient id="arcFade" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="' + AC + '" stop-opacity="0"/>' +
        '<stop offset="28%" stop-color="' + AC + '" stop-opacity="0.35"/>' +
        '<stop offset="50%" stop-color="' + AC + '" stop-opacity="0.9"/>' +
        '<stop offset="72%" stop-color="' + AC + '" stop-opacity="0.35"/>' +
        '<stop offset="100%" stop-color="' + AC + '" stop-opacity="0"/>' +
        "</linearGradient>";
      svg.appendChild(defs);

      /* garis lengkung */
      var dPath = "";
      for (var o = -(ARC_SLOTS + 1); o <= ARC_SLOTS + 1; o += 0.25) {
        var px = x0 + vh(bowAt(o)), py = H / 2 + o * gap;
        dPath += (dPath ? " L" : "M") + px.toFixed(1) + " " + py.toFixed(1);
      }
      var path = document.createElementNS(svgNS, "path");
      path.setAttribute("d", dPath);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "url(#arcFade)");
      path.setAttribute("stroke-width", "1.6");
      svg.appendChild(path);

      var dots = [];
      for (var off = -ARC_SLOTS; off <= ARC_SLOTS; off++) {
        var idx = cur + off;
        if (idx < 0 || idx >= dom.vals.length) continue;
        var a = Math.abs(off);
        var dx = x0 + vh(bowAt(off)), dy = H / 2 + off * gap;
        var isSel = off === 0;
        var fade = isSel ? 1 : Math.max(.14, 0.7 - a * 0.13);

        if (dom.kind === "color") {
          var sw = document.createElementNS(svgNS, "circle");
          sw.setAttribute("cx", dx); sw.setAttribute("cy", dy);
          sw.setAttribute("r", isSel ? vh(.85) : vh(.6));
          sw.setAttribute("fill", dom.colors[idx]);
          sw.setAttribute("stroke", isSel ? AC : "rgba(255,255,255,.3)");
          sw.setAttribute("stroke-width", isSel ? 1.6 : 1);
          sw.setAttribute("opacity", fade);
          svg.appendChild(sw);
        } else {
          if (isSel) {
            var glow = document.createElementNS(svgNS, "circle");
            glow.setAttribute("cx", dx); glow.setAttribute("cy", dy);
            glow.setAttribute("r", vh(1.7));
            glow.setAttribute("fill", AC);
            glow.setAttribute("opacity", ".18");
            svg.appendChild(glow);
          }
          var dot = document.createElementNS(svgNS, "circle");
          dot.setAttribute("cx", dx); dot.setAttribute("cy", dy);
          dot.setAttribute("r", isSel ? vh(.75) : vh(.34));
          dot.setAttribute("fill", isSel ? AC : "rgba(255,255,255,.5)");
          dot.setAttribute("opacity", fade);
          svg.appendChild(dot);
        }
        dots.push({ idx: idx, off: off, dx: dx, dy: dy, fade: fade, sel: isSel, a: a });
      }
      arc.appendChild(svg);

      /* label HTML supaya font & ellipsis konsisten */
      dots.forEach(function (n) {
        var lab = el("div", "arc-lbl" + (n.sel ? " sel" : ""), dom.labels[n.idx]);
        lab.style.left = (n.dx - lblGap) + "px";
        lab.style.top = n.dy + "px";
        lab.style.fontSize = (n.sel ? 2.05 : Math.max(1.05, 1.55 - n.a * 0.10)) + "vh";
        lab.style.opacity = n.fade;
        if (!n.sel) lab.style.color = "rgba(240,240,240,.78)";
        lab.onclick = function () { setValueByIndex(n.idx); };
        arc.appendChild(lab);
      });
    }

    /* --- panel kanan --- */
    function renderRight() {
      var row = currentRow();
      var rp = $("rpanel");
      if (!row || (!row.props.length && !row.zone)) { rp.classList.add("hidden"); return; }
      rp.classList.remove("hidden");

      $("rpIcon").innerHTML = row.icon || I.ped;
      $("rpTitle").textContent = row.label;

      var box = $("rpProps"); box.innerHTML = "";
      row.props.forEach(function (p, i) {
        var dom = p.dom, cur = indexOfVal(dom, p.get());
        var n = el("div", "rp-box" + (i === S.propIndex ? " active" : ""));
        n.appendChild(el("div", "rp-label", p.label));
        var line = el("div", "rp-line");
        if (dom.kind === "color") {
          var sw = el("span", "rp-swatch");
          sw.style.background = dom.colors[cur];
          line.appendChild(sw);
        } else {
          var lv = String(dom.labels[cur]);
          var vn = el("span", "rp-val", lv);
          if (lv.length > 10) {
            var base = (i === S.propIndex) ? 2.1 : 1.75;
            vn.style.fontSize = Math.max(1.0, base * 10 / lv.length).toFixed(2) + "vh";
          }
          line.appendChild(vn);
        }
        line.appendChild(el("span", "rp-count", (cur + 1) + "/" + dom.vals.length));
        n.appendChild(line);
        n.onclick = function () { S.propIndex = i; renderAll(); };
        box.appendChild(n);
      });

      var hints = $("rpHints"); hints.innerHTML = "";
      function hint(key, act) {
        var h = el("div", "rp-hint");
        h.appendChild(el("span", "key", key));
        h.appendChild(el("span", "act", act));
        hints.appendChild(h);
      }

      if (row.zone) {
        if (!row.props.length) box.appendChild(el("div", "rp-empty", "—"));

        if (row.props.length && S.tatCost > 0) {
          var sel = selectedTattoo(row.zone);
          var pr = el("div", "rp-price");
          pr.appendChild(el("span", "k", "Price"));
          pr.appendChild(el("span", "v", money(tattooCost(sel))));
          box.appendChild(pr);
        }

        if (row.props.length) {
          var btn = el("button", "rp-action", txt("tattoos.apply", "Apply"));
          btn.onclick = function () { applyTattoo(row.zone); };
          box.appendChild(btn);
        }

        var applied = (S.data.tattoos && S.data.tattoos[row.zone]) || [];
        if (applied.length) {
          var wrap = el("div", "rp-applied");
          applied.forEach(function (tt, ai) {
            var chip = el("div", "rp-chip");
            chip.appendChild(el("span", null, tt.label || tt.name));
            chip.appendChild(el("span", "x", "\u00d7"));
            chip.title = txt("tattoos.delete", "Remove");
            chip.onclick = function () { removeTattoo(row.zone, ai); };
            wrap.appendChild(chip);
          });
          box.appendChild(wrap);
        }

        var due = pendingTotal();
        if (due > 0) {
          var tt = el("div", "rp-price total");
          tt.appendChild(el("span", "k", S.tatChargeOnSave ? "On save" : "Spent"));
          tt.appendChild(el("span", "v", money(due)));
          box.appendChild(tt);
        }

        if (row.props.length) {
          hint("Scroll", row.props[S.propIndex].label);
          if (row.props.length > 1) hint("Alt + Scroll", row.props[S.propIndex === 1 ? 0 : 1].label);
        }
        hint("Enter", txt("tattoos.apply", "Apply"));
        return;
      }

      hint("Scroll", row.props[S.propIndex].label);
      if (row.props.length > 1) {
        var other = S.propIndex === 1 ? 0 : 1;
        hint("Alt + Scroll", row.props[other].label);
      }
    }

    function renderHeader() {
      var t = currentTab(), row = currentRow();
      $("hKicker").textContent = t ? t.label : "";
      $("hTitle").textContent = row ? row.label : (t ? t.label : "");
      var sum = rowSummary(row);
      $("hSub").textContent = sum || ((S.data && S.data.model) || "");
      $("hBadge").innerHTML = (t && t.icon) || I.ped;
    }

    function renderAll() {
      renderTabs(); renderHeader(); renderSidebar();
      $("tattoo").classList.add("hidden");
      $("arc").classList.remove("hidden");
      renderRight();
      renderArc();
    }

    function rebuild(keep) {
      var tabId = keep && currentTab() ? currentTab().id : null;
      var rowId = keep && currentRow() ? currentRow().id : null;
      var pIdx = S.propIndex;
      S.tabs = buildSchema();
      S.tabIndex = 0;
      if (tabId) for (var i = 0; i < S.tabs.length; i++) if (S.tabs[i].id === tabId) { S.tabIndex = i; break; }
      S.rowIndex = 0;
      if (rowId) {
        var fr = flatRows();
        for (var j = 0; j < fr.length; j++) if (fr[j].id === rowId) { S.rowIndex = j; break; }
      }
      var row = currentRow();
      S.propIndex = row ? clamp(pIdx, 0, Math.max(0, row.props.length - 1)) : 0;
      renderAll();
    }

    /* ================== INTERACTION ================== */
    function selectTab(i) {
      S.tabIndex = i; S.rowIndex = 0; S.propIndex = 0;
      var t = currentTab();
      if (t && t.isTattoo && t.groups[0].rows[0]) S.tattooZone = t.groups[0].rows[0].zone;
      renderAll();
    }

    function setValueByIndex(idx, propIdx) {
      var row = currentRow(); if (!row || !row.props.length) return;
      var p = row.props[clamp(propIdx === undefined ? S.propIndex : propIdx, 0, row.props.length - 1)];
      var dom = p.dom;
      idx = clamp(idx, 0, dom.vals.length - 1);
      var v = dom.vals[idx];
      if (isBlocked(dom, v)) return;
      p.set(v);
      renderAll();
    }

    function step(dir, propIdx) {
      var row = currentRow(); if (!row || !row.props.length) return;
      var pi = clamp(propIdx === undefined ? S.propIndex : propIdx, 0, row.props.length - 1);
      var p = row.props[pi], dom = p.dom;
      var i = indexOfVal(dom, p.get()), guard = 0;
      do {
        i += dir; guard++;
        if (i < 0) i = dom.vals.length - 1;
        if (i >= dom.vals.length) i = 0;
      } while (isBlocked(dom, dom.vals[i]) && guard < dom.vals.length + 2);
      setValueByIndex(i, pi);
    }

    function moveRow(dir) {
      var fr = flatRows(); if (!fr.length) return;
      S.rowIndex = (S.rowIndex + dir + fr.length) % fr.length;
      S.propIndex = 0;
      var row = currentRow();
      if (row && row.zone) S.tattooZone = row.zone;
      renderAll();
    }

    function moveProp(dir) {
      var row = currentRow(); if (!row || row.props.length < 2) return;
      S.propIndex = (S.propIndex + dir + row.props.length) % row.props.length;
      renderAll();
    }

    document.addEventListener("wheel", function (e) {
      if (!S.visible) return;
      if ($("modalBg").classList.contains("show")) return;
      if ($("sidebar").contains(e.target)) return;
      var dir = e.deltaY > 0 ? 1 : -1;
      if (e.altKey) {
        var row = currentRow();
        if (row && row.props.length > 1) {
          step(dir, S.propIndex === 1 ? 0 : 1);
          return;
        }
      }
      step(dir);
    }, { passive: true });

    document.addEventListener("keydown", function (e) {
      if (!S.visible) return;
      if ($("modalBg").classList.contains("show")) { if (e.key === "Escape") closeModal(); return; }
      switch (e.key) {
        case "ArrowUp": e.preventDefault(); moveRow(-1); break;
        case "ArrowDown": e.preventDefault(); moveRow(1); break;
        case "ArrowLeft": e.preventDefault(); step(-1); break;
        case "ArrowRight": e.preventDefault(); step(1); break;
        case "a": case "A": nui("rotate_left"); break;
        case "d": case "D": nui("rotate_right"); break;
        case "q": case "Q": moveProp(-1); break;
        case "e": case "E": moveProp(1); break;
        case "Tab":
          e.preventDefault();
          if (!S.tabs.length) break;
          selectTab((S.tabIndex + (e.shiftKey ? -1 : 1) + S.tabs.length) % S.tabs.length);
          break;
        case "Escape": if (!S.config || S.config.enableExit !== false) askExit(); break;
        case "Enter": {
          var r = currentRow();
          if (r && r.zone) { applyTattoo(r.zone); break; }
          askSave(); break;
        }
      }
    });

    window.addEventListener("resize", function () { if (S.visible) renderAll(); });

    /* ================== TOOLBAR ================== */
    function renderToolbar() {
      var c = $("toolbar"); c.innerHTML = "";
      [{ id: "default", icon: I.cam, tip: "Full body" }, { id: "head", icon: I.head, tip: "Head" },
       { id: "body", icon: I.body, tip: "Torso" }, { id: "bottom", icon: I.legs, tip: "Legs" }].forEach(function (cam) {
        var n = el("div", "tool" + (S.camera === cam.id ? " active" : ""), cam.icon);
        n.title = cam.tip;
        n.onclick = function () { S.camera = cam.id; nui("appearance_set_camera", cam.id); renderToolbar(); };
        c.appendChild(n);
      });
      function tool(icon, tip, fn) {
        var n = el("div", "tool", icon);
        n.title = tip;
        n.onclick = fn;
        c.appendChild(n);
      }
      tool(I.turn, "Turn around", function () { nui("appearance_turn_around"); });
      tool(I.rotl, "Rotate ped left  (A)", function () { nui("rotate_left"); });
      tool(I.rotr, "Rotate ped right  (D)", function () { nui("rotate_right"); });
      tool(I.reset, "Orbit camera", function () { nui("appearance_rotate_camera", "left"); });
    }

    /* ================== MODAL ================== */
    var modalAction = null;
    function openModal(title, desc, fn) {
      $("mTitle").textContent = title;
      $("mDesc").textContent = desc;
      $("mYes").textContent = txt("modal.accept", "Yes");
      $("mNo").textContent = txt("modal.decline", "No");
      modalAction = fn;
      $("modalBg").classList.add("show");
    }
    function closeModal() { $("modalBg").classList.remove("show"); modalAction = null; }
    $("mYes").onclick = function () { var f = modalAction; closeModal(); if (f) f(); };
    $("mNo").onclick = closeModal;

    function askExit() {
      openModal(txt("modal.exit.title", "Exit customization"), txt("modal.exit.description", ""), function () {
        hide(); nui("appearance_exit");
      });
    }
    function askSave() {
      var desc = txt("modal.save.description", "");
      var due = S.tatChargeOnSave ? pendingTotal() : 0;
      if (due > 0) {
        var n = pendingTattoos().length;
        desc = txt("tattoos.title", "Tattoos") + ": " + n + " \u00d7 \u2014 " + money(due) + (desc ? "\n" + desc : "");
      }
      openModal(txt("modal.save.title", "Save customization"), desc, function () {
        hide(); nui("appearance_save", S.data);
      });
    }
    $("btnExit").onclick = askExit;
    $("btnSave").onclick = askSave;

    /* ================== SHOW / HIDE ================== */
    function show() { S.visible = true; $("app").classList.add("visible"); renderAll(); }
    function hide() { S.visible = false; $("app").classList.remove("visible"); closeModal(); }

    function boot() {
      nui("appearance_get_locales").then(function (loc) {
        S.L = loc || {};
        $("lblExit").textContent = txt("modal.exit.title", "Exit Customization");
        $("lblSave").textContent = txt("modal.save.title", "Save Customization");
        return nui("appearance_get_settings");
      }).then(function (res) {
        S.settings = (res && res.appearanceSettings) || {};
        return nui("appearance_get_data");
      }).then(function (res) {
        S.config = (res && res.config) || {};
        S.data = (res && res.appearanceData) || {};
        S.data.tattoos = tattooMap(S.data.tattoos);
        S.origTattoos = cloneTattoos(S.data.tattoos);
        if (S.config.enableExit === false) $("btnExit").classList.add("hidden");
        else $("btnExit").classList.remove("hidden");

        S.tabIndex = 0; S.rowIndex = 0; S.propIndex = 0;
        S.tabs = buildSchema();
        var t = currentTab();
        if (t && t.isTattoo && t.groups[0].rows[0]) S.tattooZone = t.groups[0].rows[0].zone;
        S.camera = "default";
        renderToolbar();
        show();
      });
    }

    window.addEventListener("message", function (ev) {
      var msg = ev.data || {};
      if (msg.type === "appearance_display") boot();
      else if (msg.type === "appearance_hide") hide();
    });

    document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  })();
  </script>
</body>

</html>
