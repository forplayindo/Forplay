    /* ============================================================
     * Background image / slideshow — one source is a static
     * background, several cross-fade. Drawn under the video layer,
     * so it also covers a video that never decodes.
     * ============================================================ */
    function applyImage() {
        const wrap = document.getElementById('bgSlides');
        const I = CFG.image || {};
        const list = Array.isArray(I.sources) ? I.sources.filter(s => typeof s === 'string' && s) : [];
        if (!I.enabled || !list.length) { wrap.style.display = 'none'; return; }
        const opacity = I.opacity != null ? I.opacity : 1;
        const fade = I.fadeMs != null ? I.fadeMs : 1200;
        if (I.blurPx) wrap.style.filter = `blur(${I.blurPx}px)`;
        const slides = list.map((src, i) => {
            const d = document.createElement('div');
            d.className = 'slide' + (I.kenBurns !== false ? ' kb' : '');
            d.style.backgroundImage = `url("${String(src).replace(/["\\]/g, '')}")`;
            d.style.backgroundSize = I.objectFit === 'contain' ? 'contain' : 'cover';
            d.style.transition = `opacity ${fade}ms ease`;
            d.style.animationDelay = `-${i * 4}s`;
            if (i === 0) d.style.opacity = opacity;
            wrap.appendChild(d);
            return d;
        });
        if (slides.length < 2) return;
        let cur = 0;
        setInterval(() => {
            const next = (cur + 1) % slides.length;
            slides[cur].style.opacity = 0;
            slides[next].style.opacity = opacity;
            cur = next;
        }, Math.max(1200, I.intervalMs != null ? I.intervalMs : 9000));
    }

    /* ============================================================
     * Background video — local webm/mp4 with fallback chain.
     * If nothing decodes, the element stays hidden and the gradient
     * background is what the player sees.
     * ============================================================ */
    const DEAD_CONTAINER = /\.(avi|wmv|flv|mpg|mpeg|m2ts|mov)(\?.*)?$/i;
    // Matroska is the container WebM is a profile of, and CEF demuxes it with
    // the same code — an .mkv holding VP8 / VP9 / H.264 plays. One holding
    // HEVC or AC-3 does not, so the .webm and .mp4 of the same name are queued
    // behind it rather than in place of it: the file is tried first and the
    // chain still has somewhere to go if its codec is the one CEF lacks.
    const MAYBE_CONTAINER = /\.(mkv|ogv)(\?.*)?$/i;

    // Containers CEF can never demux are swapped for the .webm and .mp4 of the
    // same name instead of being requested and failing.
    function videoSources(list) {
        const out = [];
        const add = src => { if (out.indexOf(src) < 0) out.push(src); };
        list.forEach(src => {
            if (typeof src !== 'string' || !src) return;
            if (DEAD_CONTAINER.test(src)) {
                const base = src.replace(DEAD_CONTAINER, '');
                add(base + '.webm');
                add(base + '.mp4');
                return;
            }
            add(src);
            if (MAYBE_CONTAINER.test(src)) {
                const base = src.replace(MAYBE_CONTAINER, '');
                add(base + '.webm');
                add(base + '.mp4');
            }
        });
        return out;
    }

    function applyVideo() {
        const v = document.getElementById('bgVideo');
        const V = CFG.video || {};
        const sources = (V.enabled && Array.isArray(V.sources)) ? videoSources(V.sources) : [];
        if (!sources.length) {
            v.classList.add('hidden');
            return;
        }
        startLocalVideo(v, V, sources);
    }

    function startLocalVideo(v, V, sources) {
        v.classList.remove('hidden');
        v.loop = V.loop !== false;
        v.muted = V.muted !== false;
        v.autoplay = V.autoplay !== false;
        v.playsInline = true;
        v.style.objectFit = V.objectFit || 'cover';
        v.style.opacity = V.opacity != null ? V.opacity : 1;
        if (V.blurPx) v.style.filter = `blur(${V.blurPx}px)`;

        const STALL_MS = 6000;
        let i = 0, probe = null, current = '', decoded = false, exhausted = false;

        function arm() {
            clearTimeout(probe);
            // A source that never errors but never decodes must not stall the
            // chain. Bytes arriving re-arm it, so a large or slow stream that is
            // genuinely still loading is never cut off for taking its time.
            probe = setTimeout(() => {
                console.warn('[lastresort_loading] video timed out: ' + current);
                tryNext();
            }, STALL_MS);
        }
        function tryNext() {
            clearTimeout(probe);
            decoded = false;
            v.classList.remove('playing');
            if (i >= sources.length) {
                // A late error from a source already given up on lands here too,
                // and the list is only ever declared dead once.
                if (exhausted) return;
                exhausted = true;
                v.classList.add('hidden');
                console.warn('[lastresort_loading] no background video decoded — falling back to the image or gradient layer.');
                return;
            }
            current = sources[i++];
            v.src = current;
            v.load();
            arm();
            const p = v.play();
            if (p && typeof p.catch === 'function') p.catch(() => {});
        }
        v.addEventListener('error', () => {
            const err = v.error;
            console.warn('[lastresort_loading] video source failed: ' + current
                + (err ? ' (code ' + err.code + ')' : ''));
            tryNext();
        });
        v.addEventListener('progress', () => { if (!decoded) arm(); });
        v.addEventListener('loadeddata', () => {
            decoded = true;
            clearTimeout(probe);
            v.classList.add('playing');
            console.info('[lastresort_loading] background video: ' + current);
        });
        tryNext();
    }

    /* ============================================================
     * Music — one playlist of files this resource ships, played by
     * the page's own <audio>.
     * ============================================================ */
    let audioEl, tracks, ti = 0, musicPlaying = false, userVolume = 50, shuffleOrder = null;
    let deadTracks = 0;
    let rememberVolume = true, volumeTouched = false, volumeSaveTimer = null;

    // The volume the player set last is theirs, not the config's. It is kept in
    // the page's own storage and mirrored into client KVP by the bridge, so it
    // survives a cleared browser cache as well as a rejoin.
    const VOLUME_KEY = 'lastresort_loading:volume';

    function readStoredVolume() {
        try {
            const raw = localStorage.getItem(VOLUME_KEY);
            if (raw == null) return null;
            const v = Number(raw);
            return Number.isFinite(v) ? Math.max(0, Math.min(100, Math.round(v))) : null;
        } catch { return null; }
    }
    function storeVolume(v) {
        try { localStorage.setItem(VOLUME_KEY, String(v)); } catch {}
        clearTimeout(volumeSaveTimer);
        volumeSaveTimer = setTimeout(() => { NUI.post('lrlVolume', { volume: v }).catch(() => {}); }, 350);
    }
    function setVolume(v, persist) {
        if (!Number.isFinite(v)) return;
        userVolume = Math.max(0, Math.min(100, Math.round(v)));
        applyVolume(userVolume);
        const lv = document.getElementById('lv');
        const kn = document.getElementById('kn');
        if (lv) lv.style.width = userVolume + '%';
        if (kn) kn.style.left = userVolume + '%';
        if (persist && rememberVolume) storeVolume(userVolume);
    }
    function applyVolume(v) {
        if (audioEl) audioEl.volume = Math.max(0, Math.min(1, v / 100));
    }

    function normalizeTracks(list) {
        const out = [];
        for (const raw of (Array.isArray(list) ? list : [])) {
            if (!raw) continue;
            const src = typeof raw === 'string' ? raw : raw.src;
            if (!src) continue;
            out.push({
                title: (typeof raw === 'object' && raw.title) ? raw.title : '',
                src: String(src)
            });
        }
        return out;
    }

    function applyMusic() {
        const M = CFG.music || {};
        const wrap = document.getElementById('music');
        const vline1 = document.getElementById('vline1');
        if (!M.showUI || !M.enabled) {
            wrap.style.display = 'none';
            if (!M.showUI) vline1.style.display = 'none';
            if (!M.enabled) return;
        }
        const useVideo = !!M.useVideoAudio;
        audioEl = document.getElementById(useVideo ? 'bgVideo' : 'audio');
        tracks = useVideo ? [] : normalizeTracks(M.tracks);
        rememberVolume = M.rememberVolume !== false;
        const vol = Number(M.volume != null ? M.volume : 50);
        const stored = rememberVolume ? readStoredVolume() : null;
        setVolume(stored != null ? stored : (isFinite(vol) ? vol : 50), false);

        // Nothing to draw into on a hidden panel — the music still plays.
        if (M.showUI) Visualizer.start();

        if (useVideo) { wireVideoSound(M); return; }

        const trk = document.getElementById('trk');
        if (!tracks.length) {
            trk.textContent = t('noTrack', 'No tracks');
            document.getElementById('listBtn').style.display = 'none';
            disableMusicControls();
            return;
        }
        if (M.shuffle) shuffleOrder = makeShuffle(tracks.length);
        wireMusicControls();
        loadTrack(0);
        if (M.autoplay) tryPlay();
        if (M.showPlaylist === false) {
            document.getElementById('listBtn').style.display = 'none';
        } else {
            buildPlaylist();
        }
    }

    /* ============================================================
     * Visualizer
     * The <audio> is routed through an AnalyserNode and the cover art
     * IS the spectrum. Where the browser will not hand the page a
     * running audio context the same bars are driven by a synthetic
     * signal instead — the panel reads as alive either way, which is
     * the whole point of having it on a loading screen.
     * ============================================================ */
    const Visualizer = (() => {
        let barsCv, waveCv, barsCtx, waveCtx;
        let audioCtx = null, analyser = null, srcNode = null;
        let freq = null, wave = null;
        let levels = [], phases = [];
        let raf = null, started = false, attachTried = false;

        function cfg() {
            const V = (CFG.music || {}).visualizer || {};
            return {
                enabled: V.enabled !== false,
                bars: Math.max(4, Math.min(48, Number(V.bars) || 14)),
                wave: V.wave !== false,
                analyse: V.analyse !== false,
                smoothing: V.smoothing != null ? Number(V.smoothing) : 0.72,
                sensitivity: V.sensitivity != null ? Number(V.sensitivity) : 1.0
            };
        }
        const V = () => cfg();

        function sizeCanvas(cv) {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = cv.clientWidth || 1, h = cv.clientHeight || 1;
            cv.width = Math.max(1, Math.round(w * dpr));
            cv.height = Math.max(1, Math.round(h * dpr));
            const ctx = cv.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            return ctx;
        }

        // The element is only ever re-routed through the graph once the context
        // is known to be running. A suspended context that already owns the
        // element would mean silent music, which is far worse than flat bars.
        function attach() {
            const c = V();
            if (!c.analyse || analyser || attachTried || !audioEl) return;
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) { attachTried = true; return; }
            let ctx;
            try { ctx = new AC(); } catch { attachTried = true; return; }
            const finish = () => {
                if (ctx.state !== 'running') { try { ctx.close(); } catch {} return; }
                try {
                    srcNode = ctx.createMediaElementSource(audioEl);
                    analyser = ctx.createAnalyser();
                    analyser.fftSize = 256;
                    analyser.smoothingTimeConstant = Math.max(0, Math.min(0.95, c.smoothing));
                    srcNode.connect(analyser);
                    analyser.connect(ctx.destination);
                    freq = new Uint8Array(analyser.frequencyBinCount);
                    wave = new Uint8Array(analyser.fftSize);
                    audioCtx = ctx;
                    attachTried = true;
                } catch (e) {
                    analyser = null;
                    try { ctx.close(); } catch {}
                    attachTried = true;
                }
            };
            if (ctx.state === 'suspended') {
                const p = ctx.resume();
                if (p && p.then) p.then(finish).catch(() => { try { ctx.close(); } catch {} });
                else finish();
            } else {
                finish();
            }
        }

        function synthetic(i, n, now) {
            // Three detuned oscillators per bar plus a slow envelope: no two
            // bars ever line up, so it never reads as a looping animation.
            const p = phases[i];
            const s = Math.sin(now * 0.0042 + p) * 0.5
                    + Math.sin(now * 0.0113 + p * 2.3) * 0.32
                    + Math.sin(now * 0.0007 + p * 0.7) * 0.18;
            const tilt = 1 - (i / n) * 0.45;          // highs sit lower, like real music
            return Math.max(0.06, Math.min(1, (0.52 + s * 0.48) * tilt));
        }

        function readBars(n, now) {
            const out = new Array(n);
            if (analyser && musicPlaying) {
                analyser.getByteFrequencyData(freq);
                // Logarithmic buckets: an even split puts everything audible
                // into the first two bars and leaves the rest permanently flat.
                const bins = freq.length;
                let sum = 0;
                for (let i = 0; i < n; i++) {
                    const lo = Math.floor(Math.pow(i / n, 1.7) * bins);
                    const hi = Math.max(lo + 1, Math.floor(Math.pow((i + 1) / n, 1.7) * bins));
                    let acc = 0;
                    for (let b = lo; b < hi && b < bins; b++) acc += freq[b];
                    const v = (acc / (hi - lo)) / 255;
                    out[i] = Math.max(0, Math.min(1, v * V().sensitivity * (1 + i / n)));
                    sum += out[i];
                }
                // A track that decodes to digital silence would leave the panel
                // looking broken; fall through to the synthetic signal instead.
                if (sum > 0.02) return out;
            }
            if (!musicPlaying) { for (let i = 0; i < n; i++) out[i] = 0.05; return out; }
            for (let i = 0; i < n; i++) out[i] = synthetic(i, n, now);
            return out;
        }

        function accent() {
            return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#5fe0ff';
        }

        function draw(now) {
            raf = requestAnimationFrame(draw);
            const c = V();
            const n = c.bars;
            const target = readBars(n, now);
            for (let i = 0; i < n; i++) {
                const prev = levels[i] || 0;
                // Fast attack, slow release — the shape a VU meter has.
                const k = target[i] > prev ? 0.55 : 0.12;
                levels[i] = prev + (target[i] - prev) * k;
            }

            if (barsCtx) {
                const w = barsCv.clientWidth, h = barsCv.clientHeight;
                barsCtx.clearRect(0, 0, w, h);
                const pad = 5;
                const inner = w - pad * 2;
                const gap = Math.max(1, inner / n * 0.32);
                const bw = (inner - gap * (n - 1)) / n;
                const col = accent();
                barsCtx.fillStyle = col;
                barsCtx.shadowColor = col;
                barsCtx.shadowBlur = 6;
                for (let i = 0; i < n; i++) {
                    const bh = Math.max(1.5, levels[i] * (h - pad * 2));
                    const x = pad + i * (bw + gap);
                    barsCtx.globalAlpha = 0.35 + levels[i] * 0.65;
                    barsCtx.fillRect(x, h - pad - bh, bw, bh);
                }
                barsCtx.globalAlpha = 1;
                barsCtx.shadowBlur = 0;
            }

            if (waveCtx) {
                const w = waveCv.clientWidth, h = waveCv.clientHeight;
                waveCtx.clearRect(0, 0, w, h);
                waveCtx.beginPath();
                const mid = h / 2;
                const useReal = analyser && musicPlaying;
                if (useReal) analyser.getByteTimeDomainData(wave);
                const steps = Math.max(24, Math.min(160, Math.round(w / 2)));
                for (let i = 0; i <= steps; i++) {
                    const p = i / steps;
                    let v;
                    if (useReal) {
                        v = (wave[Math.floor(p * (wave.length - 1))] - 128) / 128;
                    } else if (musicPlaying) {
                        const amp = levels[Math.floor(p * (n - 1))] || 0;
                        v = Math.sin(p * 18 + now * 0.006) * amp * 0.9;
                    } else {
                        v = 0;
                    }
                    const y = mid - v * (mid - 1) * V().sensitivity;
                    if (i === 0) waveCtx.moveTo(0, y); else waveCtx.lineTo(p * w, y);
                }
                waveCtx.strokeStyle = accent();
                waveCtx.globalAlpha = musicPlaying ? 0.75 : 0.28;
                waveCtx.lineWidth = 1.4;
                waveCtx.stroke();
                waveCtx.globalAlpha = 1;
            }
        }

        function start() {
            const c = cfg();
            barsCv = document.getElementById('vizBars');
            waveCv = document.getElementById('vizWave');
            if (!c.enabled) {
                if (barsCv) barsCv.style.display = 'none';
                if (waveCv) waveCv.style.display = 'none';
                return;
            }
            if (started) return;
            started = true;
            if (!c.wave && waveCv) { waveCv.style.display = 'none'; waveCv = null; }
            for (let i = 0; i < 48; i++) { levels[i] = 0.05; phases[i] = i * 1.7 + Math.random() * 6.28; }
            const resize = () => {
                if (barsCv) barsCtx = sizeCanvas(barsCv);
                if (waveCv) waveCtx = sizeCanvas(waveCv);
            };
            resize();
            window.addEventListener('resize', resize);
            // A browser that would not give us a running audio context before
            // the player touched anything will give us one after they did.
            const retry = () => {
                document.removeEventListener('pointerdown', retry, true);
                document.removeEventListener('keydown', retry, true);
                if (!analyser) { attachTried = false; attach(); }
            };
            document.addEventListener('pointerdown', retry, true);
            document.addEventListener('keydown', retry, true);
            raf = requestAnimationFrame(draw);
        }

        return {
            start,
            attach,
            stop() { cancelAnimationFrame(raf); raf = null; }
        };
    })();

    /* ============================================================
     * Playlist — the whole queue, not just the track that happens
     * to be playing. Clicking a row jumps straight to it.
     * ============================================================ */
    function trackTitle(i) {
        const t0 = tracks[actualIndex(i)];
        if (!t0) return '';
        if (t0.title) return t0.title;
        return decodeURIComponent(String(t0.src || '').split('/').pop().replace(/\.[a-z0-9]+$/i, ''));
    }
    function buildPlaylist() {
        const body = document.getElementById('plistBody');
        body.innerHTML = '';
        for (let i = 0; i < tracks.length; i++) {
            const row = document.createElement('button');
            row.className = 'ptrack';
            row.dataset.i = i;
            const n = document.createElement('span');
            n.className = 'i';
            n.textContent = String(i + 1).padStart(2, '0');
            const label = document.createElement('span');
            label.className = 't';
            label.textContent = trackTitle(i);
            row.appendChild(n);
            row.appendChild(label);
            row.onclick = () => {
                loadTrack(i);
                playCurrent();
                togglePlaylist(false);
            };
            body.appendChild(row);
        }
        document.getElementById('plistTitle').textContent = t('playlist', 'Playlist');
        markPlaylist();
    }
    function markPlaylist() {
        const body = document.getElementById('plistBody');
        if (!body || !tracks) return;
        body.querySelectorAll('.ptrack').forEach(el => {
            el.classList.toggle('on', Number(el.dataset.i) === ti);
        });
        const count = document.getElementById('plistCount');
        if (count && tracks.length) {
            count.textContent = t('trackCount', '{n} / {total}')
                .replace('{n}', String(ti + 1).padStart(2, '0'))
                .replace('{total}', String(tracks.length).padStart(2, '0'));
        }
    }
    function togglePlaylist(force) {
        const el = document.getElementById('plist');
        const btn = document.getElementById('listBtn');
        if (!el || !btn) return;
        const on = force != null ? force : !el.classList.contains('on');
        el.classList.toggle('on', on);
        btn.classList.toggle('on', on);
    }
    function playCurrent() {
        if (!audioEl) return;
        Visualizer.attach();
        const p = audioEl.play();
        if (p && p.then) p.then(() => { musicPlaying = true; refreshPlayBtn(); }).catch(() => {});
    }
    function makeShuffle(n) {
        const a = Array.from({ length: n }, (_, i) => i);
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }
    function actualIndex(i) { return shuffleOrder ? shuffleOrder[i % shuffleOrder.length] : (i % tracks.length); }

    function loadTrack(i) {
        if (!tracks.length) return;
        ti = (i + tracks.length) % tracks.length;
        const t0 = tracks[actualIndex(ti)];
        const wantPlaying = musicPlaying;
        audioEl.src = t0.src;
        if (wantPlaying) { const p = audioEl.play(); if (p && p.catch) p.catch(() => {}); }
        document.getElementById('trk').textContent = trackTitle(ti) || t('loadingTrack', '…');
        markPlaylist();
    }
    // The step next/prev and an ended track all take, so `loop: false` is
    // honoured in exactly one place.
    function advance(step) {
        step = step || 1;
        if (step > 0 && ti === tracks.length - 1 && CFG.music && CFG.music.loop === false) {
            musicPlaying = false;
            refreshPlayBtn();
            return;
        }
        loadTrack(ti + step);
    }
    function tryPlay() {
        Visualizer.attach();
        const p = audioEl.play();
        if (p && p.catch) {
            p.then(() => { musicPlaying = true; refreshPlayBtn(); }).catch(() => {
                // Autoplay blocked — fall back to first interaction.
                const unlock = () => {
                    document.removeEventListener('pointerdown', unlock, true);
                    document.removeEventListener('keydown', unlock, true);
                    Visualizer.attach();
                    playCurrent();
                };
                document.addEventListener('pointerdown', unlock, true);
                document.addEventListener('keydown', unlock, true);
            });
        } else {
            musicPlaying = true;
            refreshPlayBtn();
        }
    }
    function refreshPlayBtn() {
        document.getElementById('playIc').className = musicPlaying ? 'icon-pause' : 'icon-play';
        document.getElementById('music').classList.toggle('playing', musicPlaying);
    }
    function disableMusicControls() {
        ['prev', 'play', 'next', 'listBtn'].forEach(id => { const e = document.getElementById(id); if (e) e.disabled = true; });
        document.getElementById('music').classList.add('off');
    }
    function wireMusicControls() {
        document.getElementById('play').onclick = () => {
            if (!tracks.length) return;
            if (audioEl.paused) {
                playCurrent();
            } else {
                audioEl.pause();
                musicPlaying = false;
                refreshPlayBtn();
            }
        };
        document.getElementById('next').onclick = () => advance(1);
        document.getElementById('prev').onclick = () => loadTrack(ti - 1);
        document.getElementById('listBtn').onclick = () => togglePlaylist();
        document.addEventListener('pointerdown', e => {
            const el = document.getElementById('plist');
            const btn = document.getElementById('listBtn');
            if (!el || !el.classList.contains('on')) return;
            if (el.contains(e.target) || btn.contains(e.target)) return;
            togglePlaylist(false);
        });
        audioEl.addEventListener('ended', () => advance(1));
        audioEl.addEventListener('play', () => {
            musicPlaying = true; refreshPlayBtn(); Visualizer.attach();
            deadTracks = 0;
        });
        audioEl.addEventListener('pause', () => {
            musicPlaying = false; refreshPlayBtn();
        });
        // A source that 404s or is in a container the game's browser cannot
        // decode used to leave the panel stuck on a track that never starts.
        // Skipping alone is not enough: a one-entry playlist had nothing to
        // skip to, and a list where every entry fails would cycle forever.
        audioEl.addEventListener('error', () => {
            console.warn('[lastresort_loading] track could not be played:', audioEl.src);
            deadTracks += 1;
            if (deadTracks >= tracks.length) {
                musicPlaying = false;
                refreshPlayBtn();
                document.getElementById('trk').textContent = t('noTrack', 'No tracks');
                return;
            }
            advance(1);
        });

        wireVolumeBar();
    }

    /* ============================================================
     * Video sound — the background video's soundtrack is the music.
     * The video keeps looping muted no matter what; the play button
     * only flips its sound on and off.
     * ============================================================ */
    function wireVideoSound(M) {
        ['prev', 'next', 'listBtn'].forEach(id => { const e = document.getElementById(id); if (e) e.style.display = 'none'; });
        document.getElementById('trk').textContent = M.videoTitle || '';

        const sync = () => {
            musicPlaying = !audioEl.muted && !audioEl.paused;
            refreshPlayBtn();
        };
        const mute = () => {
            audioEl.muted = true;
            const p = audioEl.play();
            if (p && p.catch) p.catch(() => {});
            sync();
        };
        let gestureArmed = false;
        const armGesture = () => {
            if (gestureArmed) return;
            gestureArmed = true;
            const unlock = () => {
                document.removeEventListener('pointerdown', unlock, true);
                document.removeEventListener('keydown', unlock, true);
                gestureArmed = false;
                if (audioEl.muted && M.autoplay) unmute();
            };
            document.addEventListener('pointerdown', unlock, true);
            document.addEventListener('keydown', unlock, true);
        };
        // A browser that refuses sound without a gesture pauses the video
        // instead of rejecting — so fall back to muted playback, never a frozen
        // background, and retry on the first click / key press.
        const unmute = () => {
            Visualizer.attach();
            audioEl.muted = false;
            const p = audioEl.play();
            if (p && p.catch) p.catch(() => { mute(); armGesture(); });
            setTimeout(() => {
                if (!audioEl.muted && audioEl.paused) { mute(); armGesture(); }
                sync();
            }, 300);
            sync();
        };

        document.getElementById('play').onclick = () => {
            if (audioEl.muted) unmute(); else mute();
        };
        audioEl.addEventListener('volumechange', sync);
        audioEl.addEventListener('play', sync);
        audioEl.addEventListener('pause', sync);
        wireVolumeBar();

        if (M.autoplay) unmute(); else sync();
    }

    function wireVolumeBar() {
        const vbar = document.getElementById('vbar');
        const setVol = e => {
            const r = vbar.getBoundingClientRect();
            let p = (e.clientX - r.left) / r.width;
            p = Math.max(0, Math.min(1, p));
            volumeTouched = true;
            setVolume(p * 100, true);
        };
        let drag = false;
        vbar.addEventListener('mousedown', e => { drag = true; setVol(e); });
        window.addEventListener('mousemove', e => { if (drag) setVol(e); });
        window.addEventListener('mouseup', () => drag = false);
    }

    /* ============================================================
     * Tips rotator
     * A tip list from the server replaces the config / locale one
     * the moment it arrives, so the owner can rotate tips live
     * without the page ever having heard of them.
     * ============================================================ */
    let tipTimer = null, tipKey = null;

    function tipSources() {
        if (serverTips && serverTips.length) return serverTips;
        const T = CFG.tips || {};
        if (T.override && T.override.length) return T.override;
        return L.tips || [];
    }

    function applyTips() {
        const T = CFG.tips || {};
        const row = document.getElementById('tipRow');
        if (!T.enabled) { row.style.display = 'none'; return; }
        const list = tipSources().map(x => String(x == null ? '' : x).trim()).filter(Boolean);
        const key = list.join('\n');
        if (key === tipKey) return;
        tipKey = key;
        clearInterval(tipTimer);
        tipTimer = null;
        if (!list.length) { row.style.display = 'none'; return; }
        row.style.display = '';
        const el = document.getElementById('tipText');
        const interval = T.intervalMs || 5000;
        const fade = T.fadeMs || 400;
        el.style.transition = `opacity ${fade}ms`;
        el.style.opacity = 1;
        let i = 0;
        el.textContent = list[0];
        if (list.length < 2) return;
        tipTimer = setInterval(() => {
            el.style.opacity = 0;
            setTimeout(() => {
                i = (i + 1) % list.length;
                el.textContent = list[i];
                el.style.opacity = 1;
            }, fade);
        }, interval);
    }

    /* ============================================================
     * Rules acceptance gate
     * Shown only when bridge/server.lua says this identifier still
     * owes an acceptance for the current rules version, and the
     * screen is held open by the client bridge until it is answered.
     * ============================================================ */
    let gateShown = false, gateAnswered = false, pendingGate = null;

    function gateRules() {
        const list = Array.isArray(CFG.rules) ? CFG.rules : (L.rules || []);
        return list.map(x => String(x == null ? '' : x).trim()).filter(Boolean);
    }

    function showGate(version) {
        if (gateShown || gateAnswered) return;
        if (!booted) { pendingGate = version == null ? '' : version; return; }
        const G = CFG.rulesGate || {};
        const el = document.getElementById('gate');
        const body = document.getElementById('gateBody');
        const accept = document.getElementById('gateAccept');
        const decline = document.getElementById('gateDecline');
        const hint = document.getElementById('gateHint');
        gateShown = true;

        document.getElementById('gateTitle').textContent = t('gateTitle', 'Server rules');
        document.getElementById('gateIntro').textContent =
            t('gateIntro', 'Read the rules through and accept them to finish joining.');
        const versionEl = document.getElementById('gateVersion');
        const vs = String(version == null ? '' : version).trim();
        if (vs) {
            versionEl.textContent = t('gateVersion', 'Version {v}').replace('{v}', vs);
        } else {
            versionEl.style.display = 'none';
        }

        body.innerHTML = '';
        gateRules().forEach((text, i) => {
            const row = document.createElement('div');
            row.className = 'rule';
            const n = document.createElement('span');
            n.className = 'n';
            n.textContent = String(i + 1).padStart(2, '0');
            row.appendChild(n);
            row.appendChild(document.createTextNode(text));
            body.appendChild(row);
        });

        accept.textContent = t('gateAccept', 'I accept');
        decline.textContent = t('gateDecline', 'Decline');
        if (G.showDecline === false) decline.style.display = 'none';

        const dim = Number(G.dim);
        if (Number.isFinite(dim)) {
            el.style.background = `rgba(4, 6, 10, ${Math.max(0, Math.min(1, dim))})`;
        }

        const requireScroll = G.requireScroll !== false;
        let unlocked = !requireScroll;
        function paintHint() {
            hint.textContent = '';
            hint.appendChild(makeIcon(unlocked ? 'check' : 'arrow-down'));
            hint.appendChild(document.createTextNode(unlocked
                ? t('gateReadyHint', 'Rules read — you can accept now.')
                : t('gateScrollHint', 'Scroll to the end of the rules to continue.')));
            hint.classList.toggle('ready', unlocked);
            accept.disabled = !unlocked;
        }
        paintHint();
        if (requireScroll) {
            body.addEventListener('scroll', () => {
                if (unlocked) return;
                if (body.scrollTop + body.clientHeight >= body.scrollHeight - 8) {
                    unlocked = true;
                    paintHint();
                }
            });
            // A rules list short enough to fit has already been read in full.
            requestAnimationFrame(() => {
                if (!unlocked && body.scrollHeight <= body.clientHeight + 8) {
                    unlocked = true;
                    paintHint();
                }
            });
        }

        // A post that never lands hands the buttons back rather than leaving
        // the player on a dead panel.
        function retryable(btn, label) {
            return () => {
                btn.disabled = false;
                btn.textContent = label;
                if (btn === accept) decline.disabled = false;
            };
        }
        accept.onclick = () => {
            if (accept.disabled) return;
            const label = accept.textContent;
            accept.disabled = true;
            decline.disabled = true;
            accept.textContent = t('gateSaving', 'Saving…');
            NUI.post('lrlRulesAccept', { version: vs }).catch(retryable(accept, label));
        };
        decline.onclick = () => {
            const label = decline.textContent;
            decline.disabled = true;
            NUI.post('lrlRulesDecline', { locale: CFG.locale || 'en' }).catch(retryable(decline, label));
        };

        el.classList.add('on');
    }

    function hideGate() {
        gateAnswered = true;
        pendingGate = null;
        const el = document.getElementById('gate');
        if (el) el.classList.remove('on');
    }

    /* ============================================================
     * Progress (real + simulated)
     * ============================================================ */
    let displayed = 0, target = 0, rafId = null, simTimer = null, realProgress = false;
    let handoverAt = 0, handoverFrom = 0, statusHoldUntil = 0, lastFrameAt = 0;
    function getStages() {
        return (L.stages && L.stages.length) ? L.stages : ['Loading'];
    }
    // The bar redraws on every animation frame while the map streams, so the
    // rows it touches are built once and then written through text nodes: no
    // parsing, no element churn, and nothing is written when the value has not
    // actually changed.
    let ui = null, lastWidth = '', lastPct = -1, lastStage = '', lastStatus = '';
    function progressUI() {
        if (ui) return ui;
        const pct = document.getElementById('pct');
        const status = document.getElementById('status');
        const pctValue = document.createTextNode('0');
        const pctUnit = document.createElement('small');
        pctUnit.textContent = '%';
        pct.textContent = '';
        pct.appendChild(pctValue);
        pct.appendChild(pctUnit);
        const statusValue = document.createTextNode('');
        const caret = document.createElement('span');
        caret.className = 'bk';
        caret.textContent = '…';
        status.textContent = '';
        status.appendChild(statusValue);
        status.appendChild(caret);
        ui = {
            fill: document.getElementById('fill'),
            stage: document.getElementById('stageLabel'),
            pct: pctValue,
            status: statusValue
        };
        return ui;
    }
    // A game log line owns the status row for holdMs, otherwise the next
    // animation frame would overwrite it with the stage name before it can be
    // read. The stage name simply resumes when the hold expires.
    function setStatus(text, holdMs) {
        if (!holdMs && performance.now() < statusHoldUntil) return;
        const s = String(text);
        if (s !== lastStatus) {
            progressUI().status.nodeValue = s;
            lastStatus = s;
        }
        if (holdMs) statusHoldUntil = performance.now() + holdMs;
    }
    function renderProgress(frac) {
        const u = progressUI();
        const f = Math.max(0, Math.min(1, frac));
        const width = (f * 100).toFixed(2) + '%';
        if (width !== lastWidth) { u.fill.style.width = width; lastWidth = width; }
        const intPct = Math.round(f * 100);
        if (intPct !== lastPct) { u.pct.nodeValue = intPct; lastPct = intPct; }
        const stages = getStages();
        const idx = Math.min(stages.length - 1, Math.floor(f * stages.length));
        const stageNum = String(idx + 1).padStart(2, '0');
        const total = String(stages.length).padStart(2, '0');
        const label = f >= 1 ? t('ready', 'Ready') : t('stageOf', 'Stage {n} / {total}')
            .replace('{n}', stageNum).replace('{total}', total);
        if (label !== lastStage) { u.stage.textContent = label; lastStage = label; }
        if (f >= 1) statusHoldUntil = 0;
        setStatus(f >= 1 ? t('ready', 'Ready') : stages[idx]);
    }
    // Eased with the real frame delta rather than a fixed per-frame share, so a
    // client rendering at 30 fps reaches the target in the same wall-clock time
    // as one at 144.
    function tick(now) {
        const dt = lastFrameAt ? Math.min(100, now - lastFrameAt) : 16.67;
        lastFrameAt = now;
        const diff = target - displayed;
        if (Math.abs(diff) < 0.0005) {
            displayed = target;
            renderProgress(displayed);
            rafId = null;
            lastFrameAt = 0;
            return;
        }
        displayed += diff * (1 - Math.pow(0.92, dt / 16.67));
        renderProgress(displayed);
        rafId = requestAnimationFrame(tick);
    }
    function setTarget(v) {
        target = Math.max(target, Math.max(0, Math.min(1, v)));
        if (rafId === null) { lastFrameAt = 0; rafId = requestAnimationFrame(tick); }
    }
    // The simulation only fills the bar until the game reports for real. On the
    // first loadProgress the travel that is left is remapped onto the real
    // fraction, so control passes over without the bar ever jumping backwards.
    function takeOverProgress(fraction) {
        realProgress = true;
        clearInterval(simTimer);
        handoverAt = target;
        handoverFrom = Math.max(0, Math.min(1, Number(fraction) || 0));
    }
    function realToBar(fraction) {
        const f = Math.max(0, Math.min(1, Number(fraction) || 0));
        if (handoverAt >= 1 || handoverFrom >= 1) return 1;
        return handoverAt + (Math.max(f, handoverFrom) - handoverFrom) * (1 - handoverAt) / (1 - handoverFrom);
    }
    function startSimulation() {
        const P = CFG.progress || {};
        cancelAnimationFrame(rafId); rafId = null; lastFrameAt = 0;
        displayed = 0; target = 0;
        handoverAt = 0; handoverFrom = 0;
        renderProgress(0);
        clearInterval(simTimer);
        if (!P.simulate) return;
        simTimer = setInterval(() => {
            if (target >= 0.999) { clearInterval(simTimer); return; }
            const step = (P.stepMin || 0.02) + Math.random() * ((P.stepMax || 0.07) - (P.stepMin || 0.02));
            setTarget(Math.min(1, target + step));
        }, P.intervalMs || 380);
    }
    window.addEventListener('message', e => {
        const d = e.data || {};
        if (d.eventName === 'loadProgress') {
            if (!realProgress) takeOverProgress(d.loadFraction);
            setTarget(realToBar(d.loadFraction));
        } else if (d.eventName === 'onLogLine' && d.message) {
            const P = CFG.progress || {};
            setStatus(d.message, P.logHoldMs != null ? P.logHoldMs : 2500);
        } else if (d.eventName === 'serverStats') {
            lastStats = d;
            updateStatusChip(d);
            const sn = typeof d.serverName === 'string' ? d.serverName.trim() : '';
            if (sn && sn !== liveServerName) {
                liveServerName = sn;
                if (booted && wantsLiveTitle()) guard(applyBrand);
            }
        } else if (d.eventName === 'setPlayerName') {
            pendingName = d.name || '';
            if (typeof window.__lrrSetName === 'function') window.__lrrSetName(pendingName);
        } else if (d.eventName === 'serverContent') {
            if (Array.isArray(d.news)) serverNews = d.news;
            if (Array.isArray(d.tips)) serverTips = d.tips;
            if (booted) { guard(applyInfoPanel); guard(applyTips); }
        } else if (d.eventName === 'rulesGate') {
            guard(() => showGate(d.version));
        } else if (d.eventName === 'rulesAccepted' || d.eventName === 'rulesGateOff') {
            guard(hideGate);
        } else if (d.eventName === 'storedVolume') {
            if (rememberVolume && !volumeTouched) guard(() => setVolume(Number(d.volume), false));
        } else if (d.eventName === 'fadeOut') {
            fadeOut(Number(d.durationMs) > 0 ? Number(d.durationMs) : 600);
        }
    });

    /* ============================================================
     * Fade out — sent by bridge/handover.lua right before the screen
     * is shut down (loadscreen_manual_shutdown). The page dims and the
     * music ramps to silence, so the NUI is already gone visually by
     * the time it is destroyed.
     * ============================================================ */
    let fading = false;
    function fadeOut(ms) {
        if (fading) return;
        fading = true;
        clearInterval(simTimer);
        document.body.style.transition = `opacity ${ms}ms var(--lr-ease-in)`;
        document.body.style.opacity = '0';
        const video = document.getElementById('bgVideo');
        const from = userVolume;
        const t0 = performance.now();
        const ramp = () => {
            const k = Math.min(1, (performance.now() - t0) / ms);
            applyVolume(Math.max(0, from * (1 - k)));
            if (k < 1) { requestAnimationFrame(ramp); return; }
            if (audioEl) audioEl.pause();
            try { video.pause(); } catch {}
        };
        requestAnimationFrame(ramp);
    }

    /* ============================================================
     * Particles canvas (rising dots)
     * ============================================================ */
    function startParticles() {
        const P = CFG.particles || {};
        const canvas = document.getElementById('particles');
        if (!P.enabled) { canvas.style.display = 'none'; return; }
        const ctx = canvas.getContext('2d');
        const palette = P.palette || [
            { r: 220, g: 232, b: 248, weight: 0.65 },
            { r: 150, g: 220, b: 255, weight: 0.25 },
            { r: 200, g: 180, b: 255, weight: 0.10 }
        ];
        const totalWeight = palette.reduce((s, c) => s + (c.weight || 0), 0) || 1;

        // Every dot is the same picture at a different size and opacity, so each
        // palette colour is drawn once into an offscreen canvas and blitted from
        // there. Building the gradient per dot per frame is what used to cost
        // thousands of allocations a second while the map streams in.
        const sizeMax = P.sizeMax || 1.5;
        const haloMul = P.haloMultiplier || 3.5;
        const haloOpacity = P.haloOpacity != null ? P.haloOpacity : 0.45;
        const SUPERSAMPLE = 4;
        const spriteRadius = Math.max(1, Math.ceil(sizeMax * haloMul * SUPERSAMPLE));
        const sprites = palette.map(c => {
            const s = document.createElement('canvas');
            s.width = s.height = spriteRadius * 2;
            const sctx = s.getContext('2d');
            const mid = spriteRadius;
            const grad = sctx.createRadialGradient(mid, mid, 0, mid, mid, spriteRadius);
            grad.addColorStop(0, `rgba(${c.r},${c.g},${c.b},${haloOpacity})`);
            grad.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0)`);
            sctx.fillStyle = grad;
            sctx.fillRect(0, 0, s.width, s.height);
            sctx.fillStyle = `rgb(${c.r},${c.g},${c.b})`;
            sctx.beginPath();
            sctx.arc(mid, mid, spriteRadius / haloMul, 0, Math.PI * 2);
            sctx.fill();
            return s;
        });
        function pickSprite() {
            const r = Math.random() * totalWeight;
            let acc = 0;
            for (let i = 0; i < palette.length; i++) {
                acc += (palette[i].weight || 0);
                if (r <= acc) return sprites[i];
            }
            return sprites[0];
        }

        let w = 0, h = 0, dpr = 1, parts = [];

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 1.5);
            w = canvas.clientWidth || window.innerWidth;
            h = canvas.clientHeight || window.innerHeight;
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const target = Math.round((w * h) / (P.density || 32000));
            const count = Math.max(P.minCount || 30, Math.min(P.maxCount || 60, target));
            parts = [];
            for (let i = 0; i < count; i++) parts.push(spawn(true));
        }
        function spawn(initial) {
            return {
                x: Math.random() * w,
                y: initial ? Math.random() * h : h + Math.random() * 30,
                r: (P.sizeMin || 0.5) + Math.random() * ((P.sizeMax || 1.5) - (P.sizeMin || 0.5)),
                vy: (P.speedMin || 0.12) + Math.random() * ((P.speedMax || 0.47) - (P.speedMin || 0.12)),
                drift: (Math.random() - 0.5) * 0.12,
                phase: Math.random() * Math.PI * 2,
                wob: 0.2 + Math.random() * 0.4,
                life: 0,
                ttl: 800 + Math.random() * 1200,
                sprite: pickSprite(),
                alpha: (P.alphaMin || 0.18) + Math.random() * ((P.alphaMax || 0.6) - (P.alphaMin || 0.18))
            };
        }
        let last = performance.now();
        function step(now) {
            const dt = Math.min(2.5, (now - last) / 16.67);
            last = now;
            ctx.clearRect(0, 0, w, h);
            for (let i = 0; i < parts.length; i++) {
                const p = parts[i];
                p.life += dt;
                p.phase += 0.008 * dt;
                p.y -= p.vy * dt;
                p.x += (Math.sin(p.phase) * p.wob * 0.25 + p.drift) * dt;
                const tin = Math.min(1, p.life / 60);
                const tout = Math.min(1, (p.ttl - p.life) / 100);
                const yfade = Math.min(1, p.y / (h * 0.18));
                const a = p.alpha * tin * Math.max(0, tout) * yfade;
                if (a > 0.002) {
                    const halo = p.r * haloMul;
                    ctx.globalAlpha = a;
                    ctx.drawImage(p.sprite, p.x - halo, p.y - halo, halo * 2, halo * 2);
                }
                if (p.y < -10 || p.life > p.ttl) parts[i] = spawn(false);
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(step);
        }
        window.addEventListener('resize', resize);
        requestAnimationFrame(() => { resize(); requestAnimationFrame(step); });
    }

    /* ============================================================
     * Dev dock (replay)
     * ============================================================ */
    function applyDevDock() {
        const d = document.getElementById('dock');
        if (!CFG.devDock) return;
        d.classList.add('on');
        document.getElementById('replay').onclick = () => {
            document.querySelectorAll('.a1,.a2,.a3,.a4').forEach(el => {
                el.style.animation = 'none'; void el.offsetHeight; el.style.animation = '';
            });
            realProgress = false;
            startSimulation();
        };
    }

    /* ============================================================
     * Boot
     * Every step is isolated: one bad config key may cost its own
     * feature, never the whole loading screen.
     * ============================================================ */
    function guard(fn) {
        try { fn(); } catch (e) { console.error('[lastresort_loading]', fn.name || 'step', e); }
    }

    (async function boot() {
        guard(seedFromHandover);
        guard(openChannel);
        guard(applyTheme);
        guard(applyBackground);
        guard(applyPattern);
        guard(applyScrim);
        guard(applyGrain);
        guard(applyCorners);
        // The welcome line and the status chip are painted BEFORE the locale
        // fetch resolves, on the built-in English fallbacks. The bridge starts
        // pushing the player name and the live player count within the first
        // frames, and a chip that does not exist yet has nowhere to put them —
        // that is what used to make the numbers show up late, or not at all.
        guard(applyBrand);
        guard(applyStatusChip);
        L = await loadLocale(CFG.locale || 'en');
        guard(applyBrand);
        guard(applyLogo);
        guard(applyStatusChip);
        guard(applyInfoPanel);
        guard(applySocials);
        guard(applyImage);
        guard(applyVideo);
        guard(applyMusic);
        guard(applyTips);
        guard(applyDevDock);
        guard(startParticles);
        booted = true;
        if (pendingGate !== null) guard(() => showGate(pendingGate));
        if (!realProgress) guard(startSimulation);
    })();
})();
</script>
</body>
</html>
