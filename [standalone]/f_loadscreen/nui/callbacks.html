<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Foreplay</title>
    <style>html, body { margin: 0; background: transparent; overflow: hidden; }</style>
</head>
<body>
<!--
    Intentionally blank.

    NUI callbacks are only routed to a resource that declares a `ui_page`, and
    a loading screen does not count as one. Without this file index.html could
    call the client script but never be answered: the rules gate could not be
    accepted and the volume could not be remembered. Nothing is ever drawn
    here — the frame stays empty and never takes focus.
-->
</body>
</html>
