<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>f_courierjob</title>
    <link rel="stylesheet" href="ui/ios.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute">
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
        <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
        <symbol id="i-crown" viewBox="0 0 24 24"><path d="m3 8 4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></symbol>
    </svg>

    <div id="panel" class="panel hidden">
        <header>
            <div class="brand"><span class="logo"><svg class="ic"><use href="#i-box"/></svg></span><div><h1>Kurir Paket</h1><small id="sub">GoPostal</small></div></div>
            <div class="head-actions"><button class="circle close" id="close"><svg class="ic"><use href="#i-x"/></svg></button></div>
        </header>

        <section class="body">
            <div id="status" class="notice hidden"></div>

            <div id="diff-wrap">
                <div class="group-h">Rute</div>
                <div class="seg" id="diffs"></div>
                <div class="group diff-info">
                    <div class="row"><svg class="ic t-accent"><use href="#i-pin"/></svg><span class="t" id="d-desc">-</span><span class="d" id="d-stops">-</span></div>
                    <div class="row"><span class="t">Gaji per titik</span><span class="d" id="d-pay">-</span></div>
                    <div class="row"><span class="t">Gaji per km</span><span class="d" id="d-km">-</span></div>
                </div>
            </div>

            <div>
                <div class="group-h">Kru <span id="crew-count"></span></div>
                <div class="group icons" id="crew"></div>
            </div>

            <div id="near-wrap">
                <div class="group-h head-row">Ajak pemain di dekatmu <button class="b-plain" id="refresh"><svg class="ic"><use href="#i-refresh"/></svg></button></div>
                <div class="group icons" id="near"></div>
                <div class="group-f">1 orang jadi supir, sisanya pengantar: tiap titik 1 paket per pengantar (2 orang 1, 3 orang 2, 4 orang 3). Titik paket besar diangkat berdua. Kas kru dibagi rata.</div>
            </div>

            <div id="msg" class="msg hidden"></div>
            <div class="menu-actions">
                <button id="leave" class="b b-red-tint b-lg hidden">Keluar</button>
                <button id="start" class="primary b-lg">Mulai Kerja</button>
            </div>
        </section>
    </div>
    <!-- progres kerja, kanan tengah layar, tanpa fokus mouse -->
    <div id="hud" class="hud hidden">
        <div class="hud-h"><span class="hud-ic"><svg class="ic"><use href="#i-box"/></svg></span><div><b id="h-title">-</b><small id="h-sub"></small></div></div>
        <div id="h-rows"></div>
        <div class="hud-f"><span id="h-share-l">Gajimu</span><b id="h-earned">Rp 0</b></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
