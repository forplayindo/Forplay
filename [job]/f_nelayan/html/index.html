<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>f_nelayan</title>
    <link rel="stylesheet" href="ui/ios.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute">
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
        <symbol id="i-fish" viewBox="0 0 24 24"><path d="M2 12c3-4 7-6 11-6 4 0 7 3 9 6-2 3-5 6-9 6-4 0-8-2-11-6z"/><path d="M2 12 0 9M2 12l-2 3"/><circle cx="17" cy="11" r="1"/></symbol>
        <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1.4 1.1-2 2.5-2s2.5.8 2.5 2-1 1.8-2.5 2.2-2.5 1-2.5 2.3 1.1 2 2.5 2 2.5-.6 2.5-2"/></symbol>
        <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
        <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
        <symbol id="i-crown" viewBox="0 0 24 24"><path d="m3 8 4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></symbol>
    </svg>

    <div id="panel" class="panel hidden">
        <header>
            <div class="brand"><span class="logo"><svg class="ic"><use href="#i-fish"/></svg></span><div><h1>Nelayan</h1><small>Syahbandar Dermaga</small></div></div>
            <div class="head-actions"><button class="circle close" id="close"><svg class="ic"><use href="#i-x"/></svg></button></div>
        </header>

        <section class="body">
            <div id="status" class="notice hidden"></div>

            <div>
                <div class="group-h">Harga Pasar Ikan (per peti)</div>
                <div class="group" id="prices"></div>
                <div class="group-f" id="price-info"></div>
            </div>

            <div>
                <div class="group-h">Jaring Ikan</div>
                <div class="group">
                    <div class="row"><svg class="ic t-accent"><use href="#i-fish"/></svg><span class="t">Jaring di tasmu<small id="net-info">-</small></span><span class="d" id="nets">-</span></div>
                </div>
            </div>

            <div>
                <div class="group-h">Kru <span id="crew-count"></span></div>
                <div class="group icons" id="crew"></div>
                <div class="group-f" id="crew-info"></div>
            </div>

            <div id="near-wrap">
                <div class="group-h head-row">Ajak pemain di dekatmu <button class="b-plain" id="refresh"><svg class="ic"><use href="#i-refresh"/></svg></button></div>
                <div class="group icons" id="near"></div>
            </div>

            <div id="msg" class="msg hidden"></div>
            <div class="menu-actions">
                <button id="leave" class="b b-red-tint b-lg hidden">Keluar</button>
                <button id="start" class="primary b-lg">Mulai Melaut</button>
            </div>
        </section>
    </div>

    <!-- progres kerja, kanan tengah layar, tanpa fokus mouse -->
    <div id="hud" class="hud hidden">
        <div class="hud-h"><span class="hud-ic"><svg class="ic"><use href="#i-fish"/></svg></span><div><b id="h-title">-</b><small id="h-sub"></small></div></div>
        <div id="h-rows"></div>
        <div class="hud-f"><span>Pendapatanmu</span><b id="h-earned">Rp 0</b></div>
        <div id="h-tip" class="hud-tip hidden"></div>
    </div>

    <!-- tarik-ulur jaring: tekan [E] saat penanda di zona hijau -->
    <div id="pull" class="pull hidden">
        <div class="pull-h"><b>Tarik jaring!</b><span id="pull-round">1/3</span></div>
        <div class="pull-bar"><i id="pull-zone"></i><b id="pull-cursor"></b></div>
        <div class="pull-dots" id="pull-dots"></div>
        <small>Tekan <kbd>E</kbd> saat penanda di zona hijau</small>
    </div>

    <script src="app.js"></script>
</body>
</html>
