<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>f_lumberjack</title>
    <link rel="stylesheet" href="ui/ios.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute">
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
        <symbol id="i-tree" viewBox="0 0 24 24"><path d="M12 2 5 12h4l-3 5h12l-3-5h4zM12 17v5"/></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
        <symbol id="i-crown" viewBox="0 0 24 24"><path d="m3 8 4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></symbol>
        <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></symbol>
    </svg>

    <div id="panel" class="panel hidden">
        <header>
            <div class="brand"><span class="logo"><svg class="ic"><use href="#i-tree"/></svg></span><div><h1>Penebang Kayu</h1><small>Mandor Paleto</small></div></div>
            <div class="head-actions"><button class="circle close" id="close"><svg class="ic"><use href="#i-x"/></svg></button></div>
        </header>

        <section class="body">
            <div id="status" class="notice hidden"></div>

            <div>
                <div class="group-h">Hasil kerja</div>
                <div class="group" id="info"></div>
            </div>

            <div>
                <div class="group-h head-row">Kru <span id="crew-count"></span></div>
                <div class="group icons" id="crew"></div>
                <div class="group-f" id="share-f">Papan dibagi saat dibongkar di markas sesuai persen bagian, masuk Gudang Kayu masing-masing. Sisa persen untuk ketua.</div>
                <button id="save-shares" class="b b-tint b-sm hidden">Simpan bagian</button>
            </div>

            <div id="near-wrap">
                <div class="group-h head-row">Ajak pemain di dekatmu <button class="b-plain" id="refresh"><svg class="ic"><use href="#i-refresh"/></svg></button></div>
                <div class="group icons" id="near"></div>
            </div>

            <div id="msg" class="msg hidden"></div>
            <div class="menu-actions">
                <button id="leave" class="b b-red-tint b-lg hidden">Keluar</button>
                <button id="start" class="primary b-lg">Mulai Kerja</button>
            </div>
        </section>
    </div>

    <!-- Gudang Kayu: stok papan pribadi -->
    <div id="gudang" class="panel confirm hidden">
        <header>
            <div class="brand"><span class="logo"><svg class="ic"><use href="#i-box"/></svg></span><div><h1>Gudang Kayu</h1><small>Papan milikmu, aman walau tas penuh</small></div></div>
            <div class="head-actions"><button class="circle close" id="g-close"><svg class="ic"><use href="#i-x"/></svg></button></div>
        </header>
        <section class="body">
            <div class="group" id="g-rows"></div>
            <div>
                <div class="group-h">Ambil ke tas</div>
                <div class="take-row">
                    <input type="number" id="g-amount" min="1" step="1" value="1">
                    <button id="g-max" class="b b-tint">Maks</button>
                </div>
            </div>
            <div id="g-msg" class="msg hidden"></div>
            <div class="menu-actions">
                <button id="g-take" class="primary b-lg">Ambil Papan</button>
            </div>
        </section>
    </div>

    <!-- konfirmasi olah kayu / selesai kerja -->
    <div id="confirm" class="panel confirm hidden">
        <header><div class="brand"><span class="logo"><svg class="ic"><use href="#i-tree"/></svg></span><div><h1 id="c-title">-</h1></div></div></header>
        <section class="body">
            <div class="group" id="c-rows"></div>
            <div class="group-f" id="c-note"></div>
            <div class="menu-actions">
                <button id="c-cancel" class="b b-lg">Batal</button>
                <button id="c-ok" class="primary b-lg">OK</button>
            </div>
        </section>
    </div>

    <!-- progres kerja, kanan tengah layar, tanpa fokus mouse -->
    <div id="hud" class="hud hidden">
        <div class="hud-h"><span class="hud-ic"><svg class="ic"><use href="#i-tree"/></svg></span><div><b id="h-title">-</b><small id="h-sub"></small></div></div>
        <div id="h-rows"></div>
        <div class="hud-f"><span id="h-share-l">Papanmu</span><b id="h-mine">0</b></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
