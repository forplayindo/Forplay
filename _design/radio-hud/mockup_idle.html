<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><style>
@font-face { font-family: 'Sentic'; font-weight: 700; src: url('sentic-text-bold.woff2') format('woff2'); }
@font-face { font-family: 'Sentic'; font-weight: 300; src: url('sentic-text-light.woff2') format('woff2'); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; font-family: 'Sentic', 'Segoe UI', sans-serif; color: #fff; display: flex; gap: 18px; padding: 18px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.title { font-size: 15px; font-weight: 700; color: #f3b354; }
.sub { font-size: 11px; font-weight: 300; color: rgba(255,255,255,.7); width: 560px; }
.shot { position: relative; width: 560px; height: 460px; border-radius: 6px; overflow: hidden; background-size: cover; }
.anchor { position: absolute; left: 16px; bottom: 192px; width: 318px; display: flex; flex-direction: column; gap: 7px; }
/* tanpa latar: teks putih + bayangan gelap (gaya angka bar f_hud) */
.row { display: flex; align-items: center; gap: 9px; text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 5px rgba(0,0,0,.7); }
.ico { width: 24px; height: 24px; border-radius: 5px; background: #f3b354; display: grid; place-items: center; flex: none; box-shadow: 0 1px 4px rgba(0,0,0,.6); }
.ico svg { width: 14px; height: 14px; fill: none; stroke: #1d1406; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.txt { line-height: 1.12; }
.k { font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.8); }
.n { font-size: 12.5px; font-weight: 700; }
.wave { display: flex; align-items: center; gap: 2px; height: 14px; margin-left: 4px; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.9)); }
.wave i { display: block; width: 3px; border-radius: 2px; background: #f3b354; }
.tx { font-size: 8.5px; font-weight: 700; color: #1d1406; background: #f3b354; border-radius: 3px; padding: 1px 4px; letter-spacing: .06em; text-shadow: none; box-shadow: 0 1px 3px rgba(0,0,0,.6); }
</style><style>
.idle { opacity: .78; }
.idle .ico { background: rgba(243,179,84,.85); }
.mini { display: flex; align-items: center; gap: 7px; text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 5px rgba(0,0,0,.7); font-size: 11px; font-weight: 700; }
.mini .ico { width: 18px; height: 18px; border-radius: 4px; }
.mini .ico svg { width: 11px; height: 11px; }
.empty { font-size: 10px; color: rgba(255,255,255,.55); font-weight: 300; text-shadow: 0 1px 2px #000; border: 1px dashed rgba(255,255,255,.35); border-radius: 5px; padding: 6px 8px; }
</style></head><body>

<script>
const ICO = '<div class="ico"><svg viewBox="0 0 24 24"><path d="M6 8h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z"/><path d="M8 8 17 3"/><circle cx="15" cy="15" r="2.5"/><path d="M7 13h3M7 16h3"/></svg></div>';
const opts = [
 ['1 — Hilang total', 'Saat sepi tidak ada apa-apa (area kosong). Muncul hanya saat ada yang bicara.', '<div class="empty">(kosong — tidak tampil apa-apa)</div>'],
 ['2 — Baris redup', 'Selama kamu di channel: ikon, frekuensi, jumlah anggota (agak transparan). Saat ada yang bicara, berganti jadi baris nama + TX.', '<div class="row idle">' + ICO + '<div class="txt"><div class="k">Radio terhubung</div><div class="n">101.5 MHz <span style="font-weight:300;font-size:10px;color:rgba(255,255,255,.75)">&middot; 4 anggota</span></div></div></div>'],
 ['3 — Ikon kecil saja', 'Selama di channel hanya ikon kecil + frekuensi. Paling hemat tempat.', '<div class="mini">' + ICO + '101.5</div>'],
];
document.body.innerHTML = opts.map(([t, d, h]) => '<div class="col"><div class="title">' + t + '</div><div class="sub">' + d + '</div><div class="shot" style="background-image:url(bg.png)"><div class="anchor">' + h + '</div></div></div>').join('');
</script></body></html>
