<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><style>
@font-face { font-family: 'Sentic'; font-weight: 700; src: url('sentic-text-bold.woff2') format('woff2'); }
@font-face { font-family: 'Sentic'; font-weight: 300; src: url('sentic-text-light.woff2') format('woff2'); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; font-family: 'Sentic', 'Segoe UI', sans-serif; color: #fff; display: flex; flex-wrap: wrap; gap: 18px; padding: 18px; width: 1176px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.title { font-size: 15px; font-weight: 700; color: #f3b354; }
.sub { font-size: 11px; font-weight: 300; color: rgba(255,255,255,.7); width: 560px; }
.shot { position: relative; width: 560px; height: 460px; border-radius: 6px; overflow: hidden; background-size: cover; }
.anchor { position: absolute; left: 16px; bottom: 192px; width: 318px; display: flex; flex-direction: column; gap: 7px; }
.sh { text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 5px rgba(0,0,0,.7); }
/* ikon sinyal radio tanpa kotak */
.sig { flex: none; fill: none; stroke: #f3b354; stroke-width: 2.4; stroke-linecap: round; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.95)) drop-shadow(0 0 3px rgba(0,0,0,.6)); }
.sig .dot { fill: #f3b354; stroke: none; }
.row { display: flex; align-items: center; gap: 8px; }
.row .sig { width: 22px; height: 22px; }
.txt { line-height: 1.12; }
.k { font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.8); }
.n { font-size: 12.5px; font-weight: 700; }
.wave { display: flex; align-items: center; gap: 2px; height: 14px; margin-left: 4px; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.9)); }
.wave i { display: block; width: 3px; border-radius: 2px; background: #f3b354; }
.tx { font-size: 8.5px; font-weight: 700; color: #1d1406; background: #f3b354; border-radius: 3px; padding: 1px 4px; letter-spacing: .06em; box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.mini { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; }
.mini .sig { width: 16px; height: 16px; }
</style></head><body>
<script>
const SIG = '<svg class="sig" viewBox="0 0 24 24"><circle class="dot" cx="12" cy="12" r="2.2"/><path d="M8.2 8.2a5.4 5.4 0 0 0 0 7.6M15.8 8.2a5.4 5.4 0 0 1 0 7.6"/><path d="M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></svg>';
const row = (name, h) => `<div class="row sh">${SIG}<div class="txt"><div class="k">Radio 101.5 MHz</div><div class="n">${name}</div></div><div class="wave">${h.map(x => `<i style="height:${x}px"></i>`).join('')}</div><span class="tx">TX</span></div>`;
const idle = `<div class="mini sh">${SIG}101.5</div>`;
const talk = row('Sora Ajah', [5, 11, 14, 8, 12]) + row('Budi Santoso', [9, 13, 6, 12, 7]);
const items = [
 ['Sepi — siang', 'Hanya ikon sinyal kuning + frekuensi selama di channel.', 'bg.png', idle],
 ['Sepi — malam', '', 'bg_night.png', idle],
 ['Ada yang bicara — siang', 'Baris nama tanpa latar, ikon sinyal, gelombang, TX. Maks 3 orang.', 'bg.png', talk],
 ['Ada yang bicara — malam', '', 'bg_night.png', talk],
];
document.body.innerHTML = items.map(([t, d, bg, h]) => `<div class="col"><div class="title">${t}</div><div class="sub">${d || '&nbsp;'}</div><div class="shot" style="background-image:url('${bg}')"><div class="anchor">${h}</div></div></div>`).join('');
</script></body></html>
